<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c3e66">
<meta name="robots" content="noindex, nofollow">
<title>Yönetici Paneli | Öğrenci Bahçesi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
<style>
:root{--navy:#2c3e66;--navy-d:#1a2744;--text:#2d3748;--muted:#718096;--line:#e2e8f0;--soft:#f7fafc;--danger:#c53030;--ok:#276749;--grad:linear-gradient(135deg,var(--navy),var(--navy-d))}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(135deg,#f5f7fa,#c3cfe2) fixed;min-height:100vh;color:var(--text);overflow-wrap:anywhere;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:100;padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.95);box-shadow:0 2px 20px rgba(0,0,0,.08);backdrop-filter:blur(10px)}
.topbar-in{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.logo{padding:16px 0;font-size:1.4em;color:var(--navy)}
.tabs{display:flex;list-style:none;gap:32px}
.tabs a{display:block;padding:20px 0;color:#4a5568;font-weight:500;font-size:15px;text-decoration:none;border-bottom:2px solid transparent}
.tabs a:hover,.tabs a.active{color:var(--navy);border-color:var(--navy)}
.main{max-width:1280px;margin:0 auto;padding:32px 24px}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:clamp(1.5rem,1.1rem + 1.8vw,2.2rem);color:var(--navy);margin-bottom:8px}
.header p{color:var(--muted)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.card{background:rgba(255,255,255,.98);border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08);margin-bottom:32px}
.card h2{margin-bottom:24px;font-size:1.5em;border-left:3px solid var(--navy);padding-left:16px}
.card>p{color:#4a5568;margin-bottom:12px}
.form-card{max-width:480px;margin:0 auto 32px;text-align:center}
.form-card h2{border:0;padding:0;color:var(--navy);margin-bottom:8px}
.form-card .sub-t{color:var(--muted);font-size:14px;margin-bottom:24px}
.fg{margin-bottom:20px;text-align:left}
label{display:block;margin-bottom:8px;color:#4a5568;font-weight:500;font-size:14px}
input,select,textarea{width:100%;padding:12px 16px;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(44,62,102,.1);background:#fff}
button{width:100%;padding:12px 28px;background:var(--grad);color:#fff;border:0;border-radius:12px;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
button:hover{opacity:.95}
button.gray{background:var(--line);color:#4a5568;margin-top:12px}
.sm{display:inline-block;width:auto;min-height:36px;padding:8px 16px;font-size:13px;font-weight:500;text-decoration:none;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:20px;cursor:pointer}
.sm:hover{background:var(--navy);color:#fff}
.sm.del{color:var(--danger);border-color:#feb2b2}
.sm.del:hover{background:var(--danger);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.alert{padding:14px 18px;border-radius:12px;margin-bottom:24px;font-size:14px;font-weight:500;text-align:left}
.ok{background:#f0fff4;color:var(--ok);border:1px solid #9ae6b4}
.er{background:#fff5f5;color:var(--danger);border:1px solid #feb2b2}
.item{background:var(--soft);padding:18px;margin-bottom:12px;border-radius:14px;border-left:3px solid var(--navy)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nm{font-size:17px}
small,.mut{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.mut{font-size:13px;color:#a0aec0;margin:12px 0}
.sub{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.t{font-size:13px;font-weight:600;color:#4a5568;margin-bottom:8px}
.les{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;padding:10px 14px;margin:8px 0;border-radius:10px;border-left:2px solid var(--navy)}
.inl{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.inl input{flex:1;min-width:160px}
.inl button{width:auto}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.empty{text-align:center;padding:48px 24px;color:#a0aec0;background:var(--soft);border-radius:16px}
.acc{margin-bottom:16px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.ah{display:flex;justify-content:space-between;gap:12px;width:100%;padding:16px 20px;background:var(--grad);color:#fff;border-radius:0;text-align:left;font-size:16px}
.ac{display:none;max-height:500px;overflow-y:auto}
.acc.open .ac{display:block}
.acc.stu .ac{max-height:none}
.li{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--soft);padding:16px;margin:12px;border-radius:12px;border-left:3px solid var(--navy)}
.modal{display:none;position:fixed;inset:0;z-index:1000;padding:16px;overflow-y:auto;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.modal.open{display:flex}
.mc{width:100%;max-width:450px;margin:auto;padding:32px;background:#fff;border-radius:24px;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.2)}
.mc h3{margin-bottom:16px}
.mc p{margin-bottom:16px}
.wel{background:var(--grad);color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.out{width:auto;padding:10px 20px;background:#edf2f7;color:#4a5568;border:1px solid var(--line);font-size:14px;font-weight:600}
@media(max-width:768px){
.dash{grid-template-columns:1fr;gap:24px}
.topbar-in{flex-direction:column;padding:4px 16px}
.logo{padding:12px 0 4px;font-size:1.2em}
.tabs{width:100%;justify-content:space-around;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:12px 6px;font-size:14px;white-space:nowrap}
.main{padding:24px 12px}
.card{padding:20px}
.btns,.btns .sm,.row>.sm{width:100%;text-align:center}
.inl button{width:100%}
.top{flex-direction:column;align-items:stretch}
.out{width:100%;padding:12px}
}
@media(max-width:400px){.card{padding:16px;border-radius:16px}.main{padding:16px 10px}.tabs a{font-size:13px}.mc{padding:24px 18px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <h2 class="logo">Öğrenci Bahçesi · Yönetici</h2>
    <nav aria-label="Ana menü">
      <ul class="tabs">
        <li><a href="#dashboard">Ana Sayfa</a></li>
        <li><a href="#classes">Sınıflar</a></li>
        <li><a href="#students">Öğrenciler</a></li>
        <li><a href="#quizzes">Sınavlar</a></li>
        <li><a href="#links">Bağlantılar</a></li>
        <li><a href="#options">Seçenekler</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="main" id="app"><div class="card" style="text-align:center">Yükleniyor…</div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mc" id="mc"></div></div>

<script type="module">
'use strict';

const firebaseConfig = {
  apiKey: "AIzaSyBc0CMtxvo2VMLGcrmnxHqfVV9AtzI4LyA",
  authDomain: "ogrenci-ff085.firebaseapp.com",
  databaseURL: "https://ogrenci-ff085-default-rtdb.firebaseio.com",
  projectId: "ogrenci-ff085",
  storageBucket: "ogrenci-ff085.firebasestorage.app",
  messagingSenderId: "300504744285",
  appId: "1:300504744285:web:041551e1e4dd81775ea8b4"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getDatabase, ref, get, set, remove, push, update } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getDatabase(fb);

const U = {
  esc: s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';'),
  now: () => new Date().toISOString(),
  fd(iso, withTime = true) {
    if (!iso) return '-';
    const d = new Date(iso), p = n => String(n).padStart(2, '0');
    const date = `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
    return withTime ? `${date} ${p(d.getHours())}:${p(d.getMinutes())}` : date;
  },
  okUrl(u) { try { return /^https?:$/.test(new URL(u).protocol); } catch { return false; } }
};
const { esc, now, fd, okUrl } = U;

const app = document.getElementById('app');
const modalEl = document.getElementById('modal');
const modalBox = document.getElementById('mc');
let D = { classes: [], lessons: [], users: [], links: [], options: [], quizzes: [] };
let flash = null;
let isAdmin = false;
let currentUid = null;
const collapsed = new Set();

const snapToArray = snap => {
  const v = snap.val() || {};
  return Object.entries(v).map(([id, o]) => ({ id, ...o }));
};

async function loadData() {
  const [c, l, u, k, o, q] = await Promise.all([
    get(ref(db, 'classes')), get(ref(db, 'lessons')), get(ref(db, 'users')),
    get(ref(db, 'links')), get(ref(db, 'options')), get(ref(db, 'quizzes'))
  ]);
  D = {
    classes: snapToArray(c).sort((a, b) => (a.created_at || '').localeCompare(b.created_at || '')),
    lessons: snapToArray(l),
    users: snapToArray(u),
    links: snapToArray(k),
    options: snapToArray(o),
    quizzes: snapToArray(q)
  };
}

const msg = (type, text) => { flash = { type, text }; return render(); };
const alertHtml = () => { const f = flash; flash = null; return f ? `<div class="alert ${f.type}">${esc(f.text)}</div>` : ''; };
const head = (h, s) => `<div class="header"><h1>${h}</h1><p>${s}</p></div>`;
const empty = (a, b) => `<div class="empty"><p>${a}</p><p>${b}</p></div>`;

const loginView = () => `
  <div class="card form-card">
    <h2>Yönetici Girişi</h2>
    <p class="sub-t">Firebase yönetici hesabınızla giriş yapın</p>
    ${alertHtml()}
    <form data-f="login">
      <div class="fg"><label>E-posta</label><input name="email" type="email" required autocomplete="username"></div>
      <div class="fg"><label>Şifre</label><input name="pw" type="password" required autocomplete="current-password"></div>
      <button>Giriş Yap</button>
    </form>
  </div>`;

const views = {
  dashboard: () => head('Yönetici Paneli', 'Öğrenci Bahçesi - Ana Panel') + `
    <div class="dash">
      <div class="card"><h2>Sınıf Oluştur</h2>${alertHtml()}
        <form data-f="class"><div class="fg"><label>Sınıf Adı</label>
          <input name="n" required maxlength="100" placeholder="Örn: TYT Lise, KPSS Lisans">
          <div class="hint">Sınav türü ve öğrenim düzeyi sınıf adında geçen sınıfa otomatik atanır.</div></div>
          <button>Sınıf Ekle</button></form></div>
      <div class="card"><h2>Bilgi</h2>
        <p>Öğrenciler <b>ogrenci.html</b> üzerinden kendi e-posta/şifreleriyle giriş yapar. Veriler Firebase'de senkron tutulur.</p>
        <p><strong>Durum:</strong> ${isAdmin ? '<span style="color:var(--ok)">Yönetici yetkisi aktif</span>' : '<span style="color:var(--danger)">Yetki yok</span>'}</p></div>
    </div>`,

  classes() {
    const list = [...D.classes].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    return head('Sınıf Yönetimi', 'Tüm sınıflar ve dersler') + `<div class="card"><h2>Tüm Sınıflar</h2>${alertHtml()}` +
      (list.length ? list.map(c => {
        const lessons = D.lessons.filter(l => l.class_id === c.id).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
        return `<div class="item">
          <div class="row"><strong class="nm">${esc(c.class_name)}</strong><button class="sm del" data-a="delClass" data-id="${c.id}">Sil</button></div>
          <small>Eklenme: ${fd(c.created_at)}</small>
          <div class="sub"><div class="t">Bu Sınıfa Ait Dersler:</div>
            ${lessons.length ? lessons.map(l => `<div class="les"><span>${esc(l.lesson_name)}</span>
              <button class="sm" data-a="lessonLink" data-id="${l.id}">Link Ekle</button></div>`).join('') : '<div class="mut">Henüz ders eklenmemiş.</div>'}
            <form class="inl" data-f="lesson" data-id="${c.id}">
              <input name="n" required maxlength="100" placeholder="Ders adı (Örn: Matematik)"><button>Ders Ekle</button></form>
          </div></div>`;
      }).join('') : empty('Henüz hiç sınıf eklenmemiş.', 'Ana sayfadaki formdan sınıf ekleyebilirsiniz.')) + '</div>';
  },

  students() {
    const list = [...D.users].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    return head('Öğrenci Yönetimi', 'Öğrenci hesapları') + `<div class="card"><h2>Öğrenci Ekleme</h2>${alertHtml()}
        <p>Öğrenci eklemek için Firebase Console → Authentication → Add user kullanın. Ardından aşağıdaki listede e-posta ile görünen kullanıcıya sınıf atayabilirsiniz. Öğrenci ilk girişte sınav türü ve düzey seçer; <code>users/{uid}</code> kaydı otomatik oluşur.</p>
      </div>
      <div class="card"><h2>Kayıtlı Öğrenciler</h2>` +
      (list.length ? list.map(u => {
        const c = D.classes.find(x => x.id === u.class_id);
        return `<div class="item"><div class="row"><div>
          <strong class="nm">${esc(u.username || '-')}</strong> <small style="display:inline">(${esc(u.email || '-')})</small>
          <small>Kayıt: ${fd(u.created_at)}</small>
          <small>Profil: ${u.exam || '?'} · ${u.education_status || '?'}</small>
          <small>${c ? `Sınıf: <b>${esc(c.class_name)}</b>` : 'Sınıf atanmamış'}</small></div>
          <div class="btns">
            <button class="sm" data-a="assign" data-id="${u.id}">Sınıf Seç</button>
            <button class="sm del" data-a="delUser" data-id="${u.id}">Sil</button></div></div></div>`;
      }).join('') : empty('Henüz öğrenci yok.', 'Öğrenciler ilk giriş yaptığında burada listelenir.')) + '</div>';
  },

  quizzes() {
    const list = [...(D.quizzes || [])].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    return head('Sınav Yönetimi', '30 soruluk denemeler oluşturun') + `
      <div class="card"><h2>Yeni Sınav Oluştur</h2>${alertHtml()}
        <form data-f="quiz" id="quizForm">
          <div class="fg"><label>Sınav Başlığı</label>
            <input name="title" required maxlength="100" placeholder="Örn: TYT Lise Deneme 1"></div>
          <div class="fg"><label>Sınav Türü</label>
            <select name="exam_type" required><option value="">-- Seçiniz --</option>
              ${D.options.filter(o => o.type === 'exam').map(o => `<option value="${esc(o.label)}">${esc(o.label)}</option>`).join('')}
            </select></div>
          <div class="fg"><label>Öğrenim Düzeyi</label>
            <select name="education_status" required><option value="">-- Seçiniz --</option>
              ${D.options.filter(o => o.type === 'edu').map(o => `<option value="${esc(o.label)}">${esc(o.label)}</option>`).join('')}
            </select></div>
          <div class="fg"><label>Sorular</label>
            <div id="qbox"></div>
            <div class="btns" style="margin-top:12px">
              <button type="button" class="sm" data-a="addQuestion">+ Boş Soru Ekle</button>
              <button type="button" class="sm" data-a="pasteQuestions">Toplu Yapıştır</button>
              <button type="button" class="sm del" data-a="clearQuestions">Temizle</button>
            </div>
            <div class="hint" id="qcount">0 / 30 soru</div>
          </div>
          <button>Sınavı Kaydet</button>
        </form></div>
      <div class="card"><h2>Kayıtlı Sınavlar</h2>` +
      (list.length ? list.map(q => `
        <div class="acc"><button class="ah" data-a="toggle">
          <span>${esc(q.title)} · ${esc(q.exam_type)} / ${esc(q.education_status)} (${(q.questions || []).length} soru)</span>
          <span>▼</span></button>
          <div class="ac"><div class="li"><div>
            <small>Oluşturma: ${fd(q.created_at)}</small></div>
            <div class="btns">
              <button class="sm" data-a="viewQuiz" data-id="${q.id}">Önizle</button>
              <button class="sm del" data-a="delQuiz" data-id="${q.id}">Sil</button></div></div>
          </div></div>`).join('')
        : empty('Henüz sınav yok.', 'Yukarıdaki formdan oluşturun.')) + '</div>';
  },

  links() {
    const groups = {};
    D.links.forEach(l => (groups[l.category] = groups[l.category] || []).push(l));
    const cats = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'tr'));
    return head('Bağlantı Yönetimi', 'Kategorilere göre bağlantılar') + `
      <div class="card"><h2>Yeni Bağlantı Ekle</h2>${alertHtml()}
        <form data-f="link">
          <div class="fg"><label>Kategori Seç</label>
            <select name="c" id="cat" required><option value="">-- Seçiniz --</option>
              ${cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
              <option value="__new">+ Yeni kategori...</option></select>
            <input name="nc" id="nc" maxlength="100" placeholder="Yeni kategori adı" hidden style="margin-top:10px"></div>
          <div class="fg"><label>Buton Metni</label><input name="b" required maxlength="100"></div>
          <div class="fg"><label>URL</label><input name="u" type="url" required placeholder="https://..."></div>
          <button>Ekle</button></form></div>` +
      (cats.length ? cats.map(c => `<div class="acc"><button class="ah" data-a="toggle"><span>${esc(c)} (${groups[c].length})</span><span>▼</span></button>
        <div class="ac">${[...groups[c]].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || '')).map(l => `<div class="li"><div>
          <strong>${esc(l.button_text)}</strong><small>${esc(l.link_url)}</small><small>${fd(l.created_at)}</small></div>
          <div class="btns"><a class="sm" href="${esc(l.link_url)}" target="_blank" rel="noopener noreferrer">Git</a>
            <button class="sm del" data-a="delLink" data-id="${l.id}">Sil</button></div></div>`).join('')}</div></div>`).join('')
        : empty('Henüz bağlantı yok.', 'Yukarıdan ekleyin.'));
  },

  options() {
    const section = (type, title, ph) => {
      const list = D.options.filter(o => o.type === type).sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
      return `<div class="card"><h2>${title}</h2>
        <form class="inl" data-f="option" data-type="${type}" style="margin:0 0 20px">
          <input name="n" required maxlength="60" placeholder="${ph}"><button>Ekle</button></form>` +
        (list.length ? list.map(o => `<div class="item"><div class="row"><strong class="nm">${esc(o.label)}</strong>
          <button class="sm del" data-a="delOption" data-id="${o.id}">Sil</button></div></div>`).join('')
          : empty('Henüz seçenek yok.', 'Öğrenciler bu listeyi göremez.')) + '</div>';
    };
    return head('Seçenekler', 'Sınav türü ve öğrenim düzeyi listeleri') + alertHtml() +
      section('exam', 'Sınav Türleri', 'TYT, AYT, LGS...') +
      section('edu', 'Öğrenim Düzeyleri', 'Lise, Önlisans, Lisans...');
  }
};

async function render() {
  if (!currentUid) { app.innerHTML = loginView(); return; }
  if (!isAdmin) {
    app.innerHTML = `<div class="card form-card"><h2>Yetkisiz Hesap</h2>
      <p class="sub-t">Bu hesabın yönetici yetkisi yok.</p>
      <button class="gray" data-a="logout">Çıkış Yap</button></div>`;
    return;
  }
  try { await loadData(); } catch (e) {
    app.innerHTML = `<div class="alert er">Veriler yüklenemedi: ${esc(e.message)}</div>`;
    return;
  }
  let page = location.hash.slice(1);
  if (!views[page]) page = 'dashboard';
  app.innerHTML = views[page]();
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + page));
}

const closeModal = () => modalEl.classList.remove('open');
function modal(title, text, fields, button, onSubmit) {
  modalBox.innerHTML = `<h3>${title}</h3><p>${text}</p><form>${fields}<button>${button}</button>
    <button type="button" class="gray" data-a="close">İptal</button></form>`;
  modalEl.classList.add('open');
