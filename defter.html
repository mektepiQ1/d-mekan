<!DOCTYPE html>
<html lang="tr">
<head>
<script src="kapi.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#22325a">
<title>Defterim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,wght@0,500;0,600;0,700;1,400&display=swap">
<style>
  :root{
    --navy:#2b3d68; --hair:#d8dfeb; --brass:#a98445; --brass-l:#c9ab6b;
    --c-text:#2b3d68; --c-muted:#6d7a96; --c-surface2:#edf1f7;
    --display:"Newsreader",Georgia,"Iowan Old Style",serif;
    --ui:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --cover-w:clamp(112px,30vw,176px);
    --cover-h:calc(var(--cover-w) * 385 / 247);
    --depth:calc(var(--cover-w) * .4);
    --hdr:radial-gradient(60% 140% at 85% -20%,rgba(120,150,220,.38),transparent 60%),
          repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 16px),
          linear-gradient(135deg,#141d33 0%,#22325a 50%,#334a80 100%);
    --bg:linear-gradient(180deg,#eef2f9 0%,#e2e9f4 45%,#d3ddee 100%);
    /* defter kağıdı */
    --paper-color:#fffdf5; --line-blue:#93c5fd; --margin-red:#fca5a5; --line-height:32px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#dfe6f2}
  @supports (height:100dvh){html,body{height:100dvh}}
  body{display:flex;flex-direction:column;font-family:var(--ui);color:var(--c-text);-webkit-font-smoothing:antialiased;background:var(--bg) fixed}
  button{font:inherit;color:inherit}
  svg{display:block}

  /* ---------- Üst başlık ---------- */
  header{flex:none;position:relative;overflow:hidden;color:#fff;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 28px;
    padding:max(30px,env(safe-area-inset-top)) max(20px,calc((100vw - 1200px) / 2 + 20px)) 30px;
    background:var(--hdr);border-bottom:3px solid var(--brass);box-shadow:0 12px 30px -14px rgba(20,29,51,.55);z-index:5}
  .brand h1{font:600 clamp(30px,7vw,42px)/1.1 var(--display);letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.25)}
  .brand p{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;letter-spacing:.04em;color:#c9d4ee}
  .brand p::before{content:"";width:30px;height:2px;background:var(--brass-l)}
  .hbtn{height:50px;padding:0 22px;border:0;border-radius:10px;background:#fff;color:var(--navy);font:700 15px var(--ui);cursor:pointer;display:flex;align-items:center;gap:9px;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);transition:transform .2s}
  .hbtn:hover{transform:translateY(-2px)}
  .hbtn:focus-visible,.ibtn:focus-visible,.btn:focus-visible,.card:focus-visible .bk-front,.topic:focus-visible{outline:2px solid var(--brass-l);outline-offset:2px}
  .hbtn svg{width:20px;height:20px}
  @media(max-width:600px){.hbtn{width:100%;justify-content:center}}

  main{flex:1 1 auto;min-height:0;width:100%;max-width:1200px;margin:0 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 20px 0;padding:16px 20px;background:#fff;border:1px solid var(--hair);border-left:5px solid var(--navy);border-radius:12px;box-shadow:0 10px 26px -14px rgba(20,29,51,.35)}
  .sec-head h2{font:600 clamp(21px,4.6vw,25px)/1.2 var(--display);color:var(--navy)}
  .sec-head small{font:600 12.5px var(--ui);background:#eef2f9;color:var(--navy);padding:4px 11px;border-radius:999px}

  /* ---------- Raf ve 3B defterler ---------- */
  .railwrap{position:relative;padding-top:6px}
  .railwrap::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--cover-h) + 90px);pointer-events:none;
    background:linear-gradient(180deg,rgba(120,86,18,0) calc(100% - 100px),rgba(120,86,18,.09) calc(100% - 26px),rgba(120,86,18,.04) 100%),
               radial-gradient(55% 80% at 50% 30%,rgba(255,255,255,.75),rgba(255,255,255,0) 72%)}
  .shelf{position:absolute;left:0;right:0;top:calc(22px + var(--cover-h) - 24px);height:52px;pointer-events:none;z-index:0}
  .sh-top{position:absolute;left:0;right:0;top:0;height:34px;background:linear-gradient(180deg,#d8b457 0,#e6c675 22%,#f1dc9d 62%,#faedc3 92%,#fff7de 100%);box-shadow:inset 0 4px 6px -3px rgba(120,86,18,.4)}
  .sh-top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(120,86,18,.05) 0 1px,transparent 1px 5px),linear-gradient(90deg,rgba(120,86,18,.12),transparent 12%,transparent 88%,rgba(120,86,18,.12))}
  .sh-front{position:absolute;left:0;right:0;top:34px;height:18px;border-radius:0 0 9px 9px;background:linear-gradient(180deg,#f7e6ae 0,#e9cd82 30%,#d5b15c 75%,#c09b45 100%);box-shadow:inset 0 1px 0 #fff4cc,inset 0 -2px 3px rgba(120,86,18,.3),0 20px 30px -8px rgba(120,86,18,.5),0 6px 10px -2px rgba(120,86,18,.3)}
  .rail{position:relative;z-index:1;display:flex;gap:68px;overflow-x:auto;padding:16px 54px 20px;scroll-padding-left:54px;scroll-snap-type:x proximity;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .rail::-webkit-scrollbar{display:none}
  .rnav{position:absolute;top:calc(22px + var(--cover-h) / 2 - 22px);width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);background:#fff;color:var(--navy);cursor:pointer;display:none;place-items:center;z-index:3;box-shadow:0 4px 14px rgba(20,29,51,.16)}
  .rnav svg{width:22px;height:22px}
  .rnav.l{left:8px}.rnav.r{right:8px}
  @media (hover:hover){.railwrap:hover .rnav{display:grid}}

  .card{position:relative;flex:0 0 var(--cover-w);width:var(--cover-w);scroll-snap-align:start;cursor:pointer;background:none;border:0;text-align:left;outline:none;
    perspective:1200px;perspective-origin:50% calc(var(--cover-h) - 70px)}
  .card .cover{position:relative;width:100%;aspect-ratio:247/385;transform-style:preserve-3d;transform-origin:50% 50% calc(var(--depth) / 2);transform:rotateY(24deg);transition:transform .6s cubic-bezier(.22,1,.36,1)}
  .bk-front{position:absolute;inset:0;transform:translateZ(var(--depth));border-radius:2px 8px 8px 2px;overflow:hidden;backface-visibility:hidden;background:var(--c-surface2);container-type:inline-size;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(255,255,255,.12)}
  .bk-front::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:
    linear-gradient(180deg,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 1.5px),
    linear-gradient(0deg,rgba(0,0,0,.26),rgba(0,0,0,0) 16%),
    linear-gradient(270deg,rgba(0,0,0,.18),rgba(0,0,0,0) 7%),
    linear-gradient(90deg,rgba(0,0,0,.38),rgba(255,255,255,.24) 2.2%,rgba(0,0,0,.16) 5.5%,rgba(0,0,0,0) 13%),
    linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,0) 40%)}
  .bk-front::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 62%);transform:translateX(-130%);animation:sweep 6.5s cubic-bezier(.4,0,.2,1) infinite}
  .card:nth-child(2n) .bk-front::before{animation-delay:1.7s}
  .card:nth-child(3n) .bk-front::before{animation-delay:3.3s}
  .bk-front img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .bk-spine,.bk-pages,.bk-back{position:absolute;top:0;height:100%;backface-visibility:hidden}
  .bk-spine{left:0;width:var(--depth);transform-origin:0 50%;transform:rotateY(-90deg);border-radius:2px 0 0 2px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.4);
    background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.16) 35%,rgba(0,0,0,.3)),var(--spine,#2b3d68)}
  .bk-spine::after,.bk-pages::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 18%,rgba(0,0,0,0) 85%,rgba(0,0,0,.18))}
  .bk-spine span{position:relative;z-index:1;writing-mode:vertical-rl;transform:rotate(180deg) scaleX(1.7);max-height:84%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:800 calc(var(--depth) * .32)/1.15 var(--ui);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45)}
  .bk-pages{right:0;top:3px;height:calc(100% - 6px);width:var(--depth);transform-origin:100% 50%;transform:rotateY(90deg);box-shadow:inset 0 0 6px rgba(60,45,20,.45);
    background:linear-gradient(90deg,rgba(60,45,20,.28),transparent 25%,transparent 75%,rgba(60,45,20,.2)),repeating-linear-gradient(90deg,#f7f2e6 0 2px,#d9d0ba 2px 3.4px)}
  .bk-back{left:0;width:100%;background:var(--spine,#2b3d68);transform:rotateY(180deg)}
  .bk-shadow{position:absolute;display:block;left:-9%;width:124%;top:calc(var(--cover-h) - 8px);height:22px;z-index:-1;pointer-events:none;transform:skewX(-14deg);transform-origin:50% 100%;transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .6s;
    background:radial-gradient(ellipse 50% 40% at 50% 40%,rgba(8,14,34,.9),rgba(8,14,34,0) 100%),radial-gradient(ellipse 50% 55% at 50% 50%,rgba(8,14,34,.5),rgba(8,14,34,0) 100%)}
  .bk-shadow::before{content:"";position:absolute;left:14%;right:-6%;top:3px;height:9px;background:linear-gradient(180deg,rgba(8,14,34,.55),rgba(8,14,34,0));border-radius:0 0 40% 40%}
  .card::after{content:"";position:absolute;left:-16%;right:-16%;top:calc(var(--cover-h) * .28);height:calc(var(--cover-h) * .85);pointer-events:none;z-index:-1;opacity:.5;
    background:radial-gradient(ellipse 50% 50% at 50% 55%,rgba(255,255,255,.9),rgba(140,172,255,.32) 46%,rgba(140,172,255,0) 72%);animation:breathe 8s ease-in-out infinite}
  .card:nth-child(2n)::after{animation-delay:2s}.card:nth-child(3n)::after{animation-delay:4s}
  .card:focus-visible .cover,.card:active .cover{transform:rotateY(8deg) translateY(-8px)}
  .card:focus-visible .bk-shadow,.card:active .bk-shadow{transform:skewX(-14deg) scale(.88,.9) translateY(6px);opacity:.55}
  @media (hover:hover){
    .card:hover .cover{transform:rotateY(8deg) translateY(-8px)}
    .card:hover .bk-shadow{transform:skewX(-14deg) scale(.88,.9) translateY(6px);opacity:.55}
  }
  .card .title,.card .sub{display:block;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-size:260% 100%;background-position:220% 0;animation:softShine 7s ease-in-out infinite}
  .card .title{margin-top:40px;font:600 16px/1.3 var(--display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;
    background-image:linear-gradient(105deg,#16213f 0%,#16213f 34%,#3f66cf 45%,#8fb0ff 50%,#3f66cf 55%,#16213f 66%,#16213f 100%)}
  .card .sub{margin-top:4px;font:500 12.5px var(--ui);letter-spacing:.02em;animation-delay:.3s;
    background-image:linear-gradient(105deg,#6d7a96 0%,#6d7a96 34%,#4a72dc 45%,#9bb8ff 50%,#4a72dc 55%,#6d7a96 66%,#6d7a96 100%)}
  .card:nth-child(2n) .title{animation-delay:1.8s}.card:nth-child(2n) .sub{animation-delay:2.1s}
  .card:nth-child(3n) .title{animation-delay:3.4s}.card:nth-child(3n) .sub{animation-delay:3.7s}
  @keyframes sweep{0%,58%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
  @keyframes breathe{0%,100%{opacity:.4}50%{opacity:.95}}
  @keyframes softShine{0%{background-position:220% 0}100%{background-position:-120% 0}}
  body.nofx .card .bk-front::before,body.nofx .card::after,body.nofx .card .title,body.nofx .card .sub{animation:none}
  @media (prefers-reduced-motion:reduce){.card .bk-front::before,.card::after,.card .title,.card .sub{animation:none}.card .title,.card .sub{background-position:0 0}.card .cover,.bk-shadow{transition:none}}

  /* Hazır (görselsiz) kapak */
  .bk-front.preset,.cp-prev.preset,.mini.preset{background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 80%,#fff),var(--cc) 70%)}
  .pc::before{content:"";position:absolute;inset:7%;border:1px solid rgba(255,255,255,.45);border-radius:3px;pointer-events:none}
  .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6cqw;padding:14cqw 10cqw 14cqw 14cqw;text-align:center;color:#fff}
  .pc b{font:700 14cqw/1.2 var(--display);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;word-break:normal;hyphens:manual;max-width:100%;text-shadow:0 2px 10px rgba(0,0,0,.35)}
  .pc i{font-style:normal;font-size:12cqw;opacity:.85}

  .empty{margin:30px 20px;padding:44px 20px;text-align:center;border:1px dashed #b9c5db;border-radius:12px;background:#fff;color:var(--c-muted);line-height:1.6}
  .empty strong{display:block;font:600 22px var(--display);color:var(--navy);margin-bottom:6px}

  /* ---------- Tam ekran sayfalar ---------- */
  .screen{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:var(--bg)}
  .screen.open{display:flex}
  #editScreen{z-index:60}
  .bar{flex:none;display:flex;align-items:center;gap:10px;color:#fff;padding:max(10px,env(safe-area-inset-top)) 14px 12px;background:var(--hdr);border-bottom:3px solid var(--brass);box-shadow:0 12px 30px -14px rgba(20,29,51,.55)}
  .bar h1{flex:1;min-width:0;font:600 clamp(19px,5vw,24px)/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #editScreen .bar{padding:max(8px,env(safe-area-inset-top)) 10px 8px;border-bottom-width:2px;box-shadow:none}
  #editScreen .ibtn,#editScreen .mic{width:38px;height:38px}
  .ibtn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(15,22,40,.5);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s}
  .ibtn:hover{background:rgba(255,255,255,.2)}
  .ibtn svg{width:20px;height:20px}
  .sbody{flex:1;min-height:0;width:100%;max-width:820px;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 20px calc(30px + env(safe-area-inset-bottom,0px))}
  .banner{display:flex;align-items:center;gap:16px;padding:16px;background:#fff;border:1px solid var(--hair);border-left:5px solid var(--brass);border-radius:12px;box-shadow:0 10px 26px -14px rgba(20,29,51,.35)}
  .mini{position:relative;flex:none;width:78px;aspect-ratio:247/385;border-radius:2px 7px 7px 2px;overflow:hidden;container-type:inline-size;box-shadow:0 10px 18px -6px rgba(20,29,51,.5)}
  .mini img{width:100%;height:100%;object-fit:cover;display:block}
  .mini::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.22) 4%,rgba(0,0,0,.12) 9%,transparent 18%)}
  .binfo{flex:1;min-width:0}
  .binfo h2{font:600 clamp(20px,5vw,24px)/1.2 var(--display);color:var(--navy);overflow-wrap:anywhere}
  .binfo p{margin:4px 0 12px;font-size:13.5px;color:var(--c-muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;border:1px solid #cfd8e6;background:#fff;color:var(--navy);font:600 15px var(--ui);cursor:pointer;transition:background .2s,transform .2s}
  .btn:hover{background:#f1f5fb}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.primary:hover{background:#22325a}
  .btn.danger{background:#c0392b;border-color:#c0392b;color:#fff}
  .btn.danger:hover{background:#a93226}
  .btn svg{width:18px;height:18px}
  .topics{margin-top:6px}
  .topic{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:15px 12px 15px 18px;background:#fff;border:1px solid var(--hair);border-left:5px solid var(--navy);border-radius:12px;box-shadow:0 10px 26px -16px rgba(20,29,51,.4);cursor:pointer;text-align:left;transition:box-shadow .25s,transform .25s}
  .topic:hover{box-shadow:0 14px 30px -12px rgba(20,29,51,.45);transform:translateY(-1px)}
  .topic .tt{flex:1;min-width:0}
  .topic .tt b{display:block;font:600 18px/1.3 var(--display);color:var(--navy);overflow-wrap:anywhere}
  .topic .tt small{display:block;margin-top:2px;font-size:12.5px;color:var(--c-muted)}
  .xbtn{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:none;color:var(--c-muted);display:grid;place-items:center;cursor:pointer}
  .xbtn:hover{background:#fdecea;color:#c0392b}
  .xbtn svg{width:18px;height:18px}
  /* ---------- Çekmece ---------- */
  .drawer{margin-top:14px}
  .tsearch{position:relative;margin-top:14px}
  .tsearch svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--c-muted);pointer-events:none}
  .tsearch input{width:100%;height:46px;padding:0 14px 0 42px;border:1px solid #cfd8e6;border-radius:12px;background:#fff;font:500 15.5px var(--ui);color:var(--navy);outline:none;box-shadow:0 8px 20px -14px rgba(20,29,51,.4)}
  .tsearch input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(43,61,104,.14)}
  .dfront{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;padding:9px 10px 22px 14px;border-radius:14px;color:#4a3410;
    background:linear-gradient(180deg,#f1dc9d 0,#e2c06c 40%,#cfa84f 100%);border:1px solid #b78f3f;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(120,86,18,.35),0 14px 22px -10px rgba(80,55,10,.55)}
  .dfront::before{content:"";position:absolute;inset:5px;border:1px solid rgba(120,86,18,.35);border-radius:9px;pointer-events:none}
  .dplate{flex:1;min-width:0;padding:5px 12px;background:linear-gradient(180deg,#fffaf0,#f3e7c6);border:1px solid #b78f3f;border-radius:8px;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(80,55,10,.3)}
  .dplate b{display:block;font:600 17px/1.25 var(--display);color:var(--navy);overflow-wrap:anywhere}
  .dplate small{display:block;font-size:12.5px;color:var(--c-muted)}
  .dhandle{position:absolute;left:50%;bottom:7px;width:72px;height:9px;margin-left:-36px;border-radius:8px;background:linear-gradient(180deg,#8b6a2b,#5c4416);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 3px rgba(60,40,5,.5)}
  .dfront{cursor:pointer;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s;user-select:none;-webkit-user-select:none}
  .dfront:active{transform:translateY(2px)}
  .drawer.open .dfront{transform:translateY(-3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 6px rgba(120,86,18,.35),0 22px 28px -10px rgba(80,55,10,.6)}
  .dfront:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  .dbelow{margin:0 6px;display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.22,1,.36,1)}
  .drawer.open .dbelow{grid-template-rows:1fr}
  .dinner{min-height:0;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .3s,visibility 0s .38s}
  .drawer.open .dinner{visibility:visible;opacity:1;transition:opacity .35s .08s,visibility 0s}
  .dbox{margin-top:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.55);border:1px dashed #b9c5db}
  .addpage{width:100%}
  .pgs{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .pg{display:flex;align-items:center;gap:8px;width:100%;padding:10px 6px 10px 14px;background:#fff;border:1px solid var(--hair);border-left:4px solid var(--brass);border-radius:10px;cursor:pointer;text-align:left}
  .pg:hover{background:#f7f9fc}
  .pg span{flex:1;min-width:0;font:600 15.5px var(--ui);color:var(--navy);overflow-wrap:anywhere}
  .tempty{margin-top:16px;padding:34px 16px;text-align:center;border:1px dashed #b9c5db;border-radius:12px;background:rgba(255,255,255,.7);color:var(--c-muted);line-height:1.6}

  /* ---------- Defter kağıdı (yazı alanı) ---------- */
  .save{display:flex;align-items:center;gap:6px;flex:none;font-size:12.5px;color:#d4dcf0;background:rgba(15,22,40,.5);padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2)}
  .dot{width:8px;height:8px;border-radius:50%;background:#34d399;transition:background .3s}
  .save.saving .dot{background:#fbbf24;animation:pulse 1s infinite}
  @keyframes pulse{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
  .mic{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(15,22,40,.5);color:#fff;display:grid;place-items:center;cursor:pointer;transition:all .2s}
  .mic svg{width:20px;height:20px}
  .mic.listening{background:#ef4444;border-color:#ef4444;animation:micPulse 1.2s infinite}
  @keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 12px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  .mic-hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(30,41,59,.92);color:#fff;padding:8px 14px;border-radius:20px;font-size:.85rem;z-index:2000;display:none;max-width:90vw;text-align:center}
  .paper-wrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0;display:flex;flex-direction:column}
  .paper{width:100%;max-width:none;flex:1 0 auto;min-height:0;height:auto;background-color:var(--paper-color);
    box-shadow:none;border-radius:0;position:relative;font:400 1.05rem/var(--line-height) var(--ui);color:#334155;outline:none;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;
    background-image:linear-gradient(90deg,transparent 75px,var(--margin-red) 75px,var(--margin-red) 76px,transparent 76px),linear-gradient(90deg,transparent 79px,var(--margin-red) 79px,var(--margin-red) 80px,transparent 80px),linear-gradient(transparent 31px,var(--line-blue) 31px,var(--line-blue) 32px);
    background-size:100% 100%,100% 100%,100% var(--line-height);background-attachment:local;padding:var(--line-height) 30px calc(var(--line-height) * 3 + env(safe-area-inset-bottom,0px)) 95px}
  .paper:empty:before{content:attr(data-placeholder);color:#94a3b8;font-style:italic}
  .paper img{max-width:100%;height:auto;display:block;margin:10px 0}
  @media (max-width:600px){
    .paper{background-image:linear-gradient(90deg,transparent 45px,var(--margin-red) 45px,var(--margin-red) 46px,transparent 46px),linear-gradient(90deg,transparent 49px,var(--margin-red) 49px,var(--margin-red) 50px,transparent 50px),linear-gradient(transparent 31px,var(--line-blue) 31px,var(--line-blue) 32px);padding:var(--line-height) 15px calc(var(--line-height) * 3 + env(safe-area-inset-bottom,0px)) 60px}
    .save span{display:none}.save{padding:9px}
  }

  /* ---------- Pencereler ---------- */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,22,40,.55)}
  .modal.open{display:flex}
  .msheet{width:100%;max-width:440px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(8,14,34,.7);animation:mIn .25s cubic-bezier(.16,1,.3,1)}
  @keyframes mIn{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
  .mh{flex:none;padding:16px 22px;border-bottom:1px solid var(--hair);font:600 21px var(--display);color:var(--navy)}
  .mb{padding:20px 22px;overflow-y:auto}
  .mb label{display:block;font-size:13px;font-weight:600;color:var(--c-muted);margin-bottom:8px}
  .mb input[type=text]{width:100%;height:48px;padding:0 14px;border:1px solid #cfd8e6;border-radius:10px;background:#f7f9fc;font:500 16px var(--ui);color:var(--navy);outline:none;transition:border-color .2s,box-shadow .2s}
  .mb input[type=text]:focus{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(43,61,104,.14)}
  .mb p{font-size:15px;line-height:1.6;color:var(--navy)}
  .mf{flex:none;display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--hair);background:#f7f9fc}
  .cp{display:flex;gap:18px;margin-top:20px;align-items:flex-start}
  .cp-prev{position:relative;flex:none;width:96px;aspect-ratio:247/385;border-radius:2px 8px 8px 2px;overflow:hidden;container-type:inline-size;box-shadow:0 12px 20px -8px rgba(20,29,51,.55);background:var(--c-surface2)}
  .cp-prev img{width:100%;height:100%;object-fit:cover;display:block}
  .cp-prev::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.22) 4%,rgba(0,0,0,.12) 9%,transparent 18%)}
  .cp-side{flex:1;min-width:0}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:var(--cc);box-shadow:0 0 0 1px #cfd8e6;cursor:pointer;padding:0}
  .sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--navy)}
  .cp-side .btn{width:100%}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c3cde0;border-radius:4px}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>Defterim</h1><p>Not defterlerim</p></div>
  <button class="hbtn" id="addBookBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Defter ekle
  </button>
</header>

<main>
  <div class="sec-head"><h2>Defterlerim</h2><small id="cnt">0 defter</small></div>
  <div class="railwrap" id="railwrap">
    <div class="shelf" aria-hidden="true"><i class="sh-top"></i><i class="sh-front"></i></div>
    <button class="rnav l" id="rl" type="button" aria-label="Sola kaydır"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <div class="rail" id="rail"></div>
    <button class="rnav r" id="rr" type="button" aria-label="Sağa kaydır"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>

</main>

<!-- Defterin içi: konular -->
<section class="screen" id="bookScreen" aria-label="Defter">

    <button class="ibtn" id="bookBack" type="button" aria-label="Defterlerime dön"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="bookBarTitle"></h1>
    <button class="ibtn" id="bookEdit" type="button" aria-label="Defteri düzenle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
    <button class="ibtn" id="bookDel" type="button" aria-label="Defteri sil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button>
  </div>
  <div class="sbody">
    <div class="banner">
      <div class="mini" id="miniCover"></div>
      <div class="binfo">
        <h2 id="bookName"></h2>
        <p id="bookCount"></p>
        <button class="btn primary" id="addTopicBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Konu ekle</button>
      </div>
    </div>
    <div class="tsearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="topicSearch" placeholder="Konu ara…" autocomplete="off" aria-label="Konu ara">

</section>

<!-- Konu yazı sayfası -->
<section class="screen" id="editScreen" aria-label="Konu">
  <div class="bar">
    <button class="ibtn" id="editBack" type="button" aria-label="Konulara dön"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="editTitle"></h1>
    <button class="mic" id="micBtn" type="button" aria-label="Sesle yaz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    <div class="save" id="saveStatus"><i class="dot"></i><span id="saveText">Kaydedildi</span></div>

<!-- Defter ekle / düzenle -->
<div class="modal" id="bookModal">
  <div class="msheet" role="dialog" aria-modal="true" aria-labelledby="bookModalTitle">
    <div class="mh" id="bookModalTitle">Defter ekle</div>
    <div class="mb">
      <label for="bookNameInput">Defter adı</label>
      <input type="text" id="bookNameInput" placeholder="Örn: Matematik, Türkçe, KPSS…" autocomplete="off" maxlength="60">
      <div class="cp">
        <div class="cp-prev" id="cpPrev"></div>
        <div class="cp-side">
          <label>Kapak rengi</label>
          <div class="swatches" id="swatches"></div>
          <button class="btn" id="pickImgBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>Görsel seç</button>
        </div>

      <input type="file" id="fileInp" accept="image/*" hidden>

      <button class="btn" id="bookCancel" type="button">İptal</button>

<!-- Konu ekle -->

<!-- Silme onayı -->
<div class="modal" id="confirmModal">
  <div class="msheet" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="mh" id="confirmTitle">Silinsin mi?</div>
    <div class="mb"><p id="confirmMsg"></p></div>
    <div class="mf">
      <button class="btn" id="confirmNo" type="button">Vazgeç</button>
      <button class="btn danger" id="confirmYes" type="button">Sil</button>
    </div>

<script>
/* Veri: IndexedDB (eski kayıtlarla aynı veritabanı).
   subjects = defterler {id, name, createdAt, color?, cover?}
   notes    = konular   {id, subjectId, title, content, updatedAt}            */
const dbName = "UltraStudentNotebookDB_v2";
const subjectStoreName = "subjects";
const noteStoreName = "notes";

let db;
let __nbResolve; window.__nbReady = new Promise(r => { __nbResolve = r; });   // hesap yedeği için: veritabanı hazır işareti
let allSubjects = [];
let allNotes = [];

const initDB = () => new Promise((resolve, reject) => {
    const request = indexedDB.open(dbName, 1);
    request.onerror = (e) => reject(e.target.error);
    request.onsuccess = (e) => { db = e.target.result; resolve(db); __nbResolve(); loadData(); };
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains(subjectStoreName)) db.createObjectStore(subjectStoreName, { keyPath: "id", autoIncrement: true });
        if (!db.objectStoreNames.contains(noteStoreName)) db.createObjectStore(noteStoreName, { keyPath: "id", autoIncrement: true });
    };
});

const saveToDB = (store, data) => new Promise((resolve, reject) => {
    const req = db.transaction([store], "readwrite").objectStore(store).put(data);
    req.onsuccess = (e) => { resolve(e.target.result); try { window.__senkron && window.__senkron.put(store, e.target.result, data); } catch (_) {} };
    req.onerror = () => reject(req.error);
});
const getAllFromDB = (store) => new Promise((resolve, reject) => {
    const req = db.transaction([store], "readonly").objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
});
const deleteFromDB = (store, id) => new Promise((resolve, reject) => {
    const req = db.transaction([store], "readwrite").objectStore(store).delete(id);
    req.onsuccess = () => { resolve(); try { window.__senkron && window.__senkron.del(store, id); } catch (_) {} };
    req.onerror = () => reject(req.error);
});

const $ = (id) => document.getElementById(id);
const PRESETS = ["#2b3d68", "#7a2e3b", "#1f6b5c", "#b4772e", "#5b3f8c", "#2f6fa8", "#3d3d46"];
const colorOf = (s) => s.color || PRESETS[(Number(s.id) || 0) % PRESETS.length];

let activeBookId = null, activeNote = null, dirty = false, saveTimeout, view = "home";

/* ---------- Kapak çizimi (raf, başlık şeridi, önizleme) ---------- */
function paintCover(el, s) {
    el.textContent = "";
    el.classList.remove("preset");
    el.style.removeProperty("--cc");
    if (s.cover) {
        const i = document.createElement("img");
        i.alt = ""; i.draggable = false; i.src = s.cover;
        el.appendChild(i);
        return i;
    }
    el.classList.add("preset");
    el.style.setProperty("--cc", colorOf(s));
    const t = document.createElement("div"); t.className = "pc";
    const b = document.createElement("b"); b.textContent = s.name || "";
    const L = Math.max(1, ...(s.name || "").split(/\s+/).map(w => w.length));   // en uzun kelime sığsın diye yazı boyunu ayarla
    b.style.fontSize = Math.max(6.5, Math.min(14, 70 / (L * 0.78))) + "cqw";
    const o = document.createElement("i"); o.textContent = "❦";
    t.append(b, o); el.appendChild(t);
    return null;
}
function spineFromImage(img, card) {
    try {
        const c = document.createElement("canvas"); c.width = 4; c.height = 16;
        const g = c.getContext("2d", { willReadFrequently: true });
        g.drawImage(img, 0, 0, Math.max(1, img.naturalWidth * .1), img.naturalHeight, 0, 0, 4, 16);
        const d = g.getImageData(0, 0, 4, 16).data; let r = 0, gr = 0, b = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) { r += d[i]; gr += d[i + 1]; b += d[i + 2]; n++; }
        const k = .62;
        card.style.setProperty("--spine", "rgb(" + Math.round(r / n * k) + "," + Math.round(gr / n * k) + "," + Math.round(b / n * k) + ")");
    } catch (_) {}
}

/* ---------- Raf ---------- */
const rail = $("rail");
function makeCard(s) {
    const count = allNotes.filter(n => n.subjectId === s.id).length;
    const b = document.createElement("button"); b.className = "card"; b.type = "button";
    b.setAttribute("aria-label", s.name + " defterini aç");
    const cover = document.createElement("div"); cover.className = "cover";
    const fr = document.createElement("div"); fr.className = "bk-front";
    const img = paintCover(fr, s);
    if (img) img.onload = () => spineFromImage(img, b);
    else b.style.setProperty("--spine", "color-mix(in srgb," + colorOf(s) + " 62%,#000)");
    cover.appendChild(fr);
    const sp = document.createElement("div"); sp.className = "bk-spine";
    const spt = document.createElement("span"); spt.textContent = s.name; sp.appendChild(spt); cover.appendChild(sp);
    ["bk-pages", "bk-back"].forEach(k => { const e = document.createElement("i"); e.className = k; cover.appendChild(e); });
    b.appendChild(cover);
    const shd = document.createElement("i"); shd.className = "bk-shadow"; b.appendChild(shd);
    const t = document.createElement("span"); t.className = "title"; t.textContent = s.name;
    const sub = document.createElement("span"); sub.className = "sub"; sub.textContent = count + " konu";
    b.append(t, sub);
    b.addEventListener("click", () => openBook(s.id));
    return b;
}
function renderShelf() {
    rail.innerHTML = "";
    const has = allSubjects.length > 0;
    $("railwrap").style.display = has ? "" : "none";
    $("empty").style.display = has ? "none" : "";
    $("cnt").textContent = allSubjects.length + " defter";
    allSubjects.forEach(s => rail.appendChild(makeCard(s)));
}
$("rl").addEventListener("click", () => rail.scrollBy({ left: -rail.clientWidth * .8 }));
$("rr").addEventListener("click", () => rail.scrollBy({ left: rail.clientWidth * .8 }));

/* ---------- Defterin içi: konu listesi ---------- */
const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" }); } catch (_) { return ""; } };
const currentBook = () => allSubjects.find(s => s.id === activeBookId);
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';

let openDrawerId = null;
function renderTopics() {
    const s = currentBook();
    if (!s) return;
    const notes = allNotes.filter(n => n.subjectId === s.id);
    $("bookBarTitle").textContent = s.name;
    $("bookName").textContent = s.name;
    $("bookCount").textContent = notes.length + " konu";
    paintCover($("miniCover"), s);
    const box = $("topics"); box.innerHTML = "";
    if (!notes.length) {
        const d = document.createElement("div"); d.className = "tempty";
        d.textContent = "Bu defterde henüz konu yok. “Konu ekle” ile ilk konunu oluştur, sonra dokunup yazmaya başla.";
        box.appendChild(d); return;
    }
    const q = $("topicSearch").value.trim().toLocaleLowerCase("tr-TR");
    const shown = q ? notes.filter(n => (n.title || "").toLocaleLowerCase("tr-TR").includes(q)) : notes;
    if (!shown.length) {
        const d = document.createElement("div"); d.className = "tempty";
        d.textContent = "“" + $("topicSearch").value.trim() + "” ile eşleşen konu bulunamadı.";
        box.appendChild(d); return;
    }
    shown.forEach(n => {
        ensurePages(n);
        const dr = document.createElement("div"); dr.className = "drawer"; dr.dataset.id = n.id;
        if (n.id === openDrawerId) dr.classList.add("open");
        const fr = document.createElement("div"); fr.className = "dfront"; fr.tabIndex = 0; fr.setAttribute("role", "button");
        fr.setAttribute("aria-expanded", n.id === openDrawerId ? "true" : "false");
        const toggleDrawer = () => {
            openDrawerId = (openDrawerId === n.id) ? null : n.id;
            box.querySelectorAll(".drawer").forEach(d => {
                const o = Number(d.dataset.id) === openDrawerId;
                d.classList.toggle("open", o);
                d.querySelector(".dfront").setAttribute("aria-expanded", o ? "true" : "false");
            });
        };
        fr.addEventListener("click", toggleDrawer);
        fr.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === fr) { e.preventDefault(); toggleDrawer(); } });
        const pl = document.createElement("div"); pl.className = "dplate";
        const b = document.createElement("b"); b.textContent = n.title;
        const sm = document.createElement("small"); sm.textContent = n.pages.length + " sayfa";
        pl.append(b, sm);
        const x = document.createElement("button"); x.className = "xbtn"; x.type = "button"; x.setAttribute("aria-label", "Çekmeceyi sil"); x.innerHTML = TRASH;
        const h = document.createElement("i"); h.className = "dhandle";
        fr.append(pl, x, h);
        x.addEventListener("click", (e) => {
            e.stopPropagation();
            askConfirm("Konuyu sil", "“" + n.title + "” çekmecesini ve içindeki sayfaları silmek istediğine emin misin?", async () => {
                await deleteFromDB(noteStoreName, n.id);
                await loadData();
            });
        });
        const below = document.createElement("div"); below.className = "dbox";
        const add = document.createElement("button"); add.className = "btn primary addpage"; add.type = "button";
        add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Sayfa oluştur';
        add.addEventListener("click", async () => {
            n.pages.push({ content: "", updatedAt: new Date().toISOString() });
            n.content = ""; n.updatedAt = new Date().toISOString();
            try { await saveToDB(noteStoreName, n); await loadData(); }
            catch (err) { console.error(err); alert("Sayfa oluşturulamadı."); }
        });
        below.appendChild(add);
        const list = document.createElement("div"); list.className = "pgs";
        n.pages.forEach((p, i) => {
            const pb = document.createElement("div"); pb.className = "pg"; pb.tabIndex = 0; pb.setAttribute("role", "button");
            const sp = document.createElement("span"); sp.textContent = n.title + " sayfa " + (i + 1);
            const px = document.createElement("button"); px.className = "xbtn"; px.type = "button"; px.setAttribute("aria-label", "Sayfayı sil"); px.innerHTML = TRASH;
            pb.append(sp, px);
            pb.addEventListener("click", () => openTopic(n, i));
            pb.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target === pb) openTopic(n, i); });
            px.addEventListener("click", (e) => {
                e.stopPropagation();
                askConfirm("Sayfayı sil", "“" + n.title + " sayfa " + (i + 1) + "” silinsin mi?", async () => {
                    n.pages.splice(i, 1); n.updatedAt = new Date().toISOString();
                    await saveToDB(noteStoreName, n); await loadData();
                });
            });
            list.appendChild(pb);
        });
        below.appendChild(list);
        const wrap = document.createElement("div"); wrap.className = "dbelow";
        const inner = document.createElement("div"); inner.className = "dinner";
        inner.appendChild(below); wrap.appendChild(inner);
        dr.append(fr, wrap);
        box.appendChild(dr);
    });
}

const loadData = async () => {
    try {
        allSubjects = await getAllFromDB(subjectStoreName);
        allNotes = await getAllFromDB(noteStoreName);
        allSubjects.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        allNotes.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        renderShelf();
        if (activeBookId != null && currentBook()) renderTopics();
    } catch (err) { console.error("Yükleme hatası:", err); }
};

/* ---------- Ekranlar ve geri tuşu ---------- */
function setView(v) {
    if (view === "edit" && v !== "edit") {
        flushSave(); activeNote = null;
        try { if (document.fullscreenElement) document.exitFullscreen(); } catch (_) {}
    }
    view = v;
    $("bookScreen").classList.toggle("open", v === "book" || v === "edit");
    $("editScreen").classList.toggle("open", v === "edit");
    document.body.classList.toggle("nofx", v !== "home");
    if (v === "home") activeBookId = null;
}
function go(v) { history.pushState({ v }, ""); setView(v); }
history.replaceState({ v: "home" }, "");
window.addEventListener("popstate", (e) => setView((e.state && e.state.v) || "home"));
$("bookBack").addEventListener("click", () => history.back());
$("editBack").addEventListener("click", () => history.back());

$("topicSearch").addEventListener("input", () => { openDrawerId = null; renderTopics(); });
function openBook(id) { activeBookId = id; openDrawerId = null; $("topicSearch").value = ""; renderTopics(); go("book"); $("bookScreen").querySelector(".sbody").scrollTop = 0; }
function ensurePages(n) {   // eski konuların yazısı "sayfa 1" olarak taşınır
    if (!Array.isArray(n.pages)) {
        n.pages = [];
        if (n.content) n.pages.push({ content: n.content, updatedAt: n.updatedAt });
    }
}
let activePage = 0;
function openTopic(n, idx) {
    ensurePages(n);
    activeNote = n; activePage = idx || 0; dirty = false;
    if (!n.pages[activePage]) n.pages[activePage] = { content: "", updatedAt: new Date().toISOString() };
    $("editTitle").textContent = n.title + " sayfa " + (activePage + 1);
    $("paper").innerHTML = n.pages[activePage].content || "";
    $("saveStatus").classList.remove("saving"); $("saveText").textContent = "Kaydedildi";
    go("edit");
    try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen({ navigationUI: "hide" }); if (r && r.catch) r.catch(() => {}); } catch (_) {}
    $("editScreen").querySelector(".paper-wrap").scrollTop = 0;
}

/* ---------- Pencere yardımcıları ---------- */
const openModal = (id) => $(id).classList.add("open");
const closeModal = (id) => $(id).classList.remove("open");
document.querySelectorAll(".modal").forEach(m => m.addEventListener("mousedown", (e) => { if (e.target === m) m.classList.remove("open"); }));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".modal.open").forEach(m => m.classList.remove("open")); });

let confirmAction = null;
function askConfirm(title, msg, fn) {
    $("confirmTitle").textContent = title; $("confirmMsg").textContent = msg; confirmAction = fn; openModal("confirmModal");
}
$("confirmNo").addEventListener("click", () => { confirmAction = null; closeModal("confirmModal"); });
$("confirmYes").addEventListener("click", async () => {
    const fn = confirmAction; confirmAction = null; closeModal("confirmModal");
    if (fn) { try { await fn(); } catch (e) { console.error(e); alert("İşlem yapılamadı."); } }
});

/* ---------- Defter ekle / düzenle (kapak seçimi) ---------- */
let draft = null, editingId = null;
function renderDraft() {
    paintCover($("cpPrev"), { id: editingId || 0, name: $("bookNameInput").value.trim() || "Defter", color: draft.color, cover: draft.cover });
    $("swatches").querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", (!draft.cover && b.dataset.c === draft.color) ? "true" : "false"));
}
PRESETS.forEach(c => {
    const b = document.createElement("button"); b.type = "button"; b.className = "sw"; b.dataset.c = c; b.style.setProperty("--cc", c); b.setAttribute("aria-label", "Kapak rengi " + c);
    b.addEventListener("click", () => { draft.color = c; draft.cover = ""; renderDraft(); });
    $("swatches").appendChild(b);
});
function openBookModal(s) {
    editingId = s ? s.id : null;
    draft = { color: s ? colorOf(s) : PRESETS[Math.floor(Math.random() * PRESETS.length)], cover: s && s.cover ? s.cover : "" };
    $("bookModalTitle").textContent = s ? "Defteri düzenle" : "Defter ekle";
    $("bookNameInput").value = s ? s.name : "";
    renderDraft(); openModal("bookModal");
    setTimeout(() => $("bookNameInput").focus(), 100);
}
$("addBookBtn").addEventListener("click", () => openBookModal(null));
$("bookEdit").addEventListener("click", () => { const s = currentBook(); if (s) openBookModal(s); });
$("bookCancel").addEventListener("click", () => closeModal("bookModal"));
$("bookNameInput").addEventListener("input", renderDraft);
$("bookNameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("bookSave").click(); });
$("pickImgBtn").addEventListener("click", () => $("fileInp").click());

function fileToCover(file) {   // seçilen görseli kapak oranına kırpıp küçültür (hesap yedeğine sığsın diye)
    return new Promise((res, rej) => {
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => {
            const W = 360, H = 561, c = document.createElement("canvas"); c.width = W; c.height = H;
            const g = c.getContext("2d"), r = Math.max(W / img.naturalWidth, H / img.naturalHeight);
            const w = img.naturalWidth * r, h = img.naturalHeight * r;
            g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
            g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
            URL.revokeObjectURL(url);
            let q = .82, d = c.toDataURL("image/jpeg", q);
            while (d.length > 150000 && q > .45) { q -= .1; d = c.toDataURL("image/jpeg", q); }
            res(d);
        };
        img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("görsel")); };
        img.src = url;
    });
}
$("fileInp").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    try { draft.cover = await fileToCover(f); renderDraft(); }
    catch (_) { alert("Bu görsel açılamadı. Başka bir görsel (JPG veya PNG) seçin."); }
});
$("bookSave").addEventListener("click", async () => {
    const name = $("bookNameInput").value.trim();
    if (!name) { $("bookNameInput").focus(); return; }
    try {
        if (editingId != null) {
            const s = allSubjects.find(x => x.id === editingId);
            if (!s) return;
            s.name = name; s.color = draft.color; s.cover = draft.cover;
            await saveToDB(subjectStoreName, s);
        } else {
            await saveToDB(subjectStoreName, { name, color: draft.color, cover: draft.cover, createdAt: new Date().toISOString() });
        }
        closeModal("bookModal");
        await loadData();
        if (editingId == null) rail.scrollTo({ left: 0 });
    } catch (err) { console.error(err); alert("Defter kaydedilirken bir hata oluştu."); }
});
$("bookDel").addEventListener("click", () => {
    const s = currentBook(); if (!s) return;
    const n = allNotes.filter(x => x.subjectId === s.id).length;
    askConfirm("Defteri sil", "“" + s.name + "” defteri" + (n ? " ve içindeki " + n + " konu" : "") + " silinecek. Bu işlem geri alınamaz.", async () => {
        for (const note of allNotes.filter(x => x.subjectId === s.id)) await deleteFromDB(noteStoreName, note.id);
        await deleteFromDB(subjectStoreName, s.id);
        activeBookId = null;
        history.back();
        await loadData();
    });
});

/* ---------- Konu ekle ---------- */
$("addTopicBtn").addEventListener("click", () => { $("topicInput").value = ""; openModal("topicModal"); setTimeout(() => $("topicInput").focus(), 100); });
$("topicCancel").addEventListener("click", () => closeModal("topicModal"));
$("topicInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("topicCreate").click(); });
$("topicCreate").addEventListener("click", async () => {
    const title = $("topicInput").value.trim();
    if (!title || activeBookId == null) return;
    const obj = { subjectId: activeBookId, title, content: "", pages: [], updatedAt: new Date().toISOString() };
    try {
        obj.id = await saveToDB(noteStoreName, obj);
        closeModal("topicModal");
        await loadData();
    } catch (err) { console.error(err); alert("Konu oluşturulurken hata oluştu."); }
});

/* ---------- Yazma ve otomatik kaydetme ---------- */
const paper = $("paper"), saveStatus = $("saveStatus"), saveText = $("saveText");
async function persistNote() {
    if (!activeNote || !dirty) return;
    const n = activeNote;
    ensurePages(n);
    const now = new Date().toISOString();
    n.pages[activePage] = { content: paper.innerHTML, updatedAt: now };
    n.content = ""; n.updatedAt = now; dirty = false;
    try { await saveToDB(noteStoreName, n); saveStatus.classList.remove("saving"); saveText.textContent = "Kaydedildi"; }
    catch (err) { console.error(err); dirty = true; saveText.textContent = "Hata! Kaydedilemedi"; }
}
async function flushSave() { clearTimeout(saveTimeout); await persistNote(); await loadData(); }
paper.addEventListener("input", () => {
    if (!activeNote) return;
    dirty = true; saveStatus.classList.add("saving"); saveText.textContent = "Kaydediliyor...";
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(persistNote, 800);
});
paper.addEventListener("keydown", (e) => { if (e.key === "Tab") { e.preventDefault(); document.execCommand("insertHTML", false, "&#009"); } });
document.addEventListener("visibilitychange", () => { if (document.hidden) { clearTimeout(saveTimeout); persistNote(); } });
window.addEventListener("pagehide", () => { clearTimeout(saveTimeout); persistNote(); });

// Hesap yedeği (modül) için küçük arayüz: kancasız ham yazma ve yeniden yükleme
window.__nbApi = {
    getAll: getAllFromDB,
    putRaw: (store, data) => new Promise((res, rej) => { const r = db.transaction([store], "readwrite").objectStore(store).put(data); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }),
    reload: () => loadData()
};

/* ---------- Sesle yazma (Türkçe) ---------- */
(() => {
    const micBtn = $("micBtn");
    const hint = document.createElement("div"); hint.className = "mic-hint"; document.body.appendChild(hint);
    const showHint = (t, ms) => {
        hint.textContent = t; hint.style.display = "block"; clearTimeout(showHint.t);
        if (ms) showHint.t = setTimeout(() => hint.style.display = "none", ms);
    };
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { micBtn.addEventListener("click", () => showHint("Bu tarayıcı sesle yazmayı desteklemiyor. Chrome veya Safari deneyin.", 4000)); return; }

    let rec = null, listening = false, savedRange = null;
    const commands = [
        [/\s*\b(yeni satır|alt satır)\b\s*/gi, "\n"], [/\s*\bsoru işareti\b/gi, "?"], [/\s*\bünlem işareti\b/gi, "!"],
        [/\s*\bvirgül\b/gi, ","], [/\s*\bnokta\b/gi, "."], [/\s*\biki nokta\b/gi, ":"]
    ];
    const clean = (t) => { commands.forEach(([re, r]) => t = t.replace(re, r)); return t; };
    const saveSel = () => { const s = window.getSelection(); if (s.rangeCount && paper.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange(); };
    document.addEventListener("selectionchange", saveSel);
    const insertText = (text) => {
        paper.focus();
        const s = window.getSelection();
        if (savedRange) { s.removeAllRanges(); s.addRange(savedRange); }
        else { const r = document.createRange(); r.selectNodeContents(paper); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
        document.execCommand("insertText", false, text);   // 'input' olayı tetiklenir, otomatik kaydedilir
        saveSel();
    };
    const setUI = () => micBtn.classList.toggle("listening", listening);
    const start = () => {
        if (!activeNote) { showHint("Önce bir konu açın.", 2500); return; }
        rec = new SR(); rec.lang = "tr-TR";
        rec.continuous = false;   // Android'de true iken metin tekrarlanıyor; bitince otomatik yeniden başlatıyoruz
        rec.interimResults = true;
        let seen = new Set();
        rec.onstart = () => { seen = new Set(); };
        rec.onresult = (e) => {
            let interim = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
                const r = e.results[i];
                if (r.isFinal) {
                    if (seen.has(i)) continue; seen.add(i);
                    let t = clean(r[0].transcript.trim()); if (!t) continue;
                    const before = paper.textContent.slice(-1);
                    const needSpace = before && !/[\s\n]/.test(before) && !/^[.,?!:\n]/.test(t);
                    insertText((needSpace ? " " : "") + t);
                } else interim += r[0].transcript;
            }
            showHint(interim ? "🎙 " + interim : "🎙 Dinliyorum...");
        };
        rec.onerror = (e) => {
            if (e.error === "not-allowed" || e.error === "service-not-allowed") { listening = false; setUI(); showHint("Mikrofon izni verilmedi. Tarayıcı ayarlarından izin verin.", 5000); }
        };
        rec.onend = () => { if (listening) { try { rec.start(); } catch (_) {} } else setUI(); };
        listening = true; setUI(); showHint("🎙 Dinliyorum... Konuşabilirsiniz.");
        try { rec.start(); } catch (_) {}
    };
    const stop = () => { listening = false; if (rec) rec.stop(); setUI(); hint.style.display = "none"; };
    micBtn.addEventListener("mousedown", (e) => e.preventDefault());   // imleç yerini kaybetmesin
    micBtn.addEventListener("click", () => listening ? stop() : start());
    window.__micStop = () => { if (listening) stop(); };
})();

document.addEventListener("DOMContentLoaded", initDB);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getDatabase, ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

/* Hesap yedeği: veriler giriş yapmış öğrencinin hesabında saklanır.
   Tarayıcı verileri temizlense bile giriş yapıp sayfayı açınca geri gelir.
   Giriş yoksa sayfa eskisi gibi yalnızca bu cihazda çalışır (hiçbir şey bozulmaz).
   Not: Bu sayfa, öğrenci uygulamasıyla AYNI alan adında (mektepiq1.github.io) olmalıdır. */
const config = {
  apiKey: "AIzaSyAtqtkB4mYY7t1HCM3umVLxRC2un30_-fQ",
  authDomain: "ogrenciveyonetim.firebaseapp.com",
  databaseURL: "https://ogrenciveyonetim-default-rtdb.firebaseio.com",
  projectId: "ogrenciveyonetim",
  appId: "1:660345359561:web:5c74d90d8624c8e4c75118"
};
const MAX = 400000;                        // bir kaydın en büyük boyutu (kurallarla aynı)
const app = initializeApp(config), db = getDatabase(app), auth = getAuth(app);
let uid = null;
const zaman = new Map();
const yol = k => `userData/${uid}/${ARAC}/${k}`;

const chip = (() => {
  const e = document.createElement('div');
  e.setAttribute('role', 'status');
  e.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:99999;max-width:260px;padding:6px 10px;border-radius:10px;font:12px/1.35 system-ui,sans-serif;background:rgba(30,43,92,.92);color:#fff;display:none;cursor:pointer';
  e.addEventListener('click', () => { e.style.display = 'none'; });
  document.body.appendChild(e);
  let t;
  return (m, ms = 3500) => { e.textContent = m; e.style.display = 'block'; clearTimeout(t); t = setTimeout(() => { e.style.display = 'none'; }, ms); };
})();

const girisBekle = () => new Promise(res => { const off = onAuthStateChanged(auth, u => { off(); res(u); }); });
const planla = (k, is) => { clearTimeout(zaman.get(k)); zaman.set(k, setTimeout(() => { zaman.delete(k); is().catch(() => chip('Yedeklenemedi. İnternet bağlantınızı kontrol edin.')); }, 2500)); };
const yaz = async (k, metin) => {
  if (metin.length > MAX) return chip('Bir kayıt çok büyük olduğu için hesabınıza yedeklenemedi.', 6000);
  await set(ref(db, yol(k)), metin);
};
const topluYaz = async eksik => {            // {anahtar: metin} → en çok ~1,5 MB'lık parçalarla
  let parca = {}, boyut = 0, buyuk = false;
  const gonder = async () => { if (Object.keys(parca).length) await update(ref(db), parca); parca = {}; boyut = 0; };
  for (const [k, m] of Object.entries(eksik)) {
    if (m.length > MAX) { buyuk = true; continue; }
    if (boyut + m.length > 1500000) await gonder();
    parca[yol(k)] = m; boyut += m.length;
  }
  await gonder();
  if (buyuk) chip('Bazı kayıtlar çok büyük olduğu için yedeklenemedi.', 6000);
};
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}   // tarayıcı yer açarken defteri silmesin
const ARAC = 'defter';
const anahtar = (depo, id) => (depo === 'subjects' ? 's' : 'n') + id;

window.__senkron = {                                  // sayfa her kaydettiğinde / sildiğinde çağrılır
  put(depo, id, veri) { if (!uid) return; const k = anahtar(depo, id); planla(k, () => yaz(k, JSON.stringify({ ...veri, id }))); },
  del(depo, id) { if (!uid) return; const k = anahtar(depo, id); planla(k, () => remove(ref(db, yol(k)))); }
};

(async () => {
  await window.__nbReady;                             // sayfanın IndexedDB'si hazır
  const u = await girisBekle();
  if (!u) return chip('Giriş yapılmadığı için defteriniz yalnızca bu cihazda tutuluyor. Yedeklenmesi için öğrenci uygulamasından giriş yapın.', 8000);
  uid = u.uid;
  const uzak = (await get(ref(db, `userData/${uid}/${ARAC}`))).val() || {};
  const [dersler, notlar] = await Promise.all([window.__nbApi.getAll('subjects'), window.__nbApi.getAll('notes')]);

  if (!dersler.length && !notlar.length) {            // cihaz boş (veri temizlenmiş / yeni cihaz): hesaptan geri yükle
    const liste = Object.entries(uzak).filter(([k, v]) => /^[sn]\d+$/.test(k) && typeof v === 'string');
    if (!liste.length) return;
    for (const [k, v] of liste) {
      let nesne; try { nesne = JSON.parse(v); } catch { continue; }
      if (nesne && nesne.id != null) await window.__nbApi.putRaw(k[0] === 's' ? 'subjects' : 'notes', nesne);
    }
    await window.__nbApi.reload();
    chip('Defteriniz hesabınızdan geri yüklendi.', 5000);
    return;
  }
  const eksik = {};                                   // cihazda var, hesapta yok: yedekle
  dersler.forEach(d => { const k = anahtar('subjects', d.id); if (uzak[k] === undefined) eksik[k] = JSON.stringify(d); });
  notlar.forEach(n => { const k = anahtar('notes', n.id); if (uzak[k] === undefined) eksik[k] = JSON.stringify(n); });
  if (Object.keys(eksik).length) await topluYaz(eksik);
})().catch(() => {});
</script>
