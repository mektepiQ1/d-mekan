<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c3e66">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-CGjHwtksZCfgq/y9NSkiVvLFutl7SQiIRcxFQb17T4Q=' https://www.gstatic.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://*.firebaseio.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Öğrenci Paneli | Öğrenci Bahçesi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
<style>
:root{--navy:#2c3e66;--navy-d:#1a2744;--text:#2d3748;--muted:#718096;--line:#e2e8f0;--soft:#f7fafc;--danger:#c53030;--grad:linear-gradient(135deg,var(--navy),var(--navy-d))}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#f5f7fa,#c3cfe2) fixed;min-height:100vh;min-height:100dvh;color:var(--text);overflow-wrap:anywhere;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.main{max-width:1280px;margin:0 auto;padding:32px 24px}
.main.narrow{max-width:900px;padding-top:calc(24px + env(safe-area-inset-top))}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:2em;color:var(--navy);margin-bottom:8px}
.header p{color:var(--muted)}
.card{background:rgba(255,255,255,.98);border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08);margin-bottom:32px}
.card h2{margin-bottom:24px;font-size:1.5em;border-left:3px solid var(--navy);padding-left:16px}
.form-card{max-width:480px;margin:0 auto 32px;text-align:center}
.form-card h2{border:0;padding:0;color:var(--navy);margin-bottom:8px}
.form-card .sub-t{color:var(--muted);font-size:14px;margin-bottom:24px}
.fg{margin-bottom:20px;text-align:left}
label{display:block;margin-bottom:8px;color:#4a5568;font-weight:500;font-size:14px}
input,select{width:100%;padding:12px 16px;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px}
input:focus,select:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(44,62,102,.1);background:#fff}
button{width:100%;padding:12px 28px;background:var(--grad);color:#fff;border:0;border-radius:12px;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
button:hover{opacity:.95}
button.gray{background:var(--line);color:#4a5568;margin-top:12px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.alert{padding:14px 18px;border-radius:12px;margin-bottom:24px;font-size:14px;font-weight:500;text-align:left}
.er{background:#fff5f5;color:var(--danger);border:1px solid #feb2b2}
.empty{text-align:center;padding:48px 24px;color:#a0aec0;background:var(--soft);border-radius:16px}
.wel{background:var(--grad);color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.out{width:auto;padding:10px 20px;background:#edf2f7;color:#4a5568;border:1px solid var(--line);font-size:14px;font-weight:600}
.class-card{background:var(--grad);color:#fff;padding:24px;border-radius:20px;margin-bottom:24px;text-align:center}
.class-card h3{font-size:22px;margin-bottom:8px}
.class-card p{opacity:.85;font-size:13px}
.lbl{color:#4a5568;font-weight:600;margin:24px 0 16px}
.slesson{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--soft);padding:16px 20px;margin:10px 0;border-radius:14px;border-left:4px solid var(--navy);font-weight:600}
.btn{width:auto;padding:8px 18px;color:var(--navy);background:#fff;border:1.5px solid var(--navy);border-radius:20px;font-size:13px;font-weight:600}
.btn:hover{background:var(--navy);color:#fff;opacity:1}
.lk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
.dr{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.dr .dr{background:var(--soft);border-radius:12px;margin:10px 0 0}
.dr summary{display:flex;align-items:center;gap:10px;min-height:52px;padding:12px 16px;font-weight:600;color:var(--navy);cursor:pointer;list-style:none}
.dr summary::-webkit-details-marker{display:none}
.dr summary span{flex:1}
.dr summary small{background:var(--line);color:var(--muted);font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px}
.dr summary::after{content:'';flex:none;width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
.dr[open]>summary::after{transform:rotate(-135deg)}
.dr .db{padding:0 16px 16px}
.dr .class-card{padding:16px;margin-bottom:0}
.dr .slesson{background:#fff;margin:8px 0 0;padding:12px 16px}
.warn{background:#fff5f5;color:var(--danger);padding:18px;border-radius:14px;text-align:center;border:1px solid #feb2b2}
button,.sm{min-height:44px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px}
input,select{min-height:48px}.ah{min-height:52px}
@media(min-width:769px) and (max-width:1100px){.main{padding:28px 20px}.card{padding:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.out,button{display:none!important}body{background:#fff}}
@media(max-width:768px){.main.narrow{padding:16px 12px}.card{padding:20px}.slesson{flex-direction:column;align-items:flex-start}.slesson .btn{width:100%}.top{flex-direction:column;align-items:stretch}.out{width:100%}}
@media(max-width:400px){.card{padding:16px;border-radius:16px}}
</style>
</head>
<body>
<main class="main narrow">
  <div class="header">
    <h1>Öğrenci Bahçesi</h1>
    <p>Dersler, Defter ve Online Sınavlar</p>
  </div>
  <div id="app"><div class="card"><div class="empty" role="status">Yükleniyor…</div></div></div>
</main>

<script type="module">
'use strict';

import { ref, get, set } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { db, auth, USER_RE, ukey, errText } from "./firebase.js";
if (window.top !== window.self) { document.body.textContent = ''; throw new Error('Çerçeve içinde çalışamaz'); }

const DB = {
  async all(store) {
    const snap = await get(ref(db, store));
    if (!snap.exists()) return [];
    const val = snap.val();
    if (Array.isArray(val)) return val.filter(Boolean);
    return Object.entries(val).map(([k, v]) => ({ ...v, _fbKey: k }));
  },
  async get(store, id) { const snap = await get(ref(db, `${store}/${id}`)); return snap.exists() ? snap.val() : null; },
  async put(store, item) { await set(ref(db, `${store}/${item._fbKey}`), item); return item; }
};

const U = {
  esc: s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';'),
  now: () => new Date().toISOString(),
  okUrl(u) { try { return /^https?:$/.test(new URL(u).protocol); } catch { return false; } },
  fd(iso, withTime = true) {
    const d = new Date(iso), p = n => String(n).padStart(2, '0');
    const date = `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
    return withTime ? `${date} ${p(d.getHours())}:${p(d.getMinutes())}` : date;
  },
  matchClass(classes, exam, edu) {
    const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i').trim();
    const has = (name, term) => !!term &&
      new RegExp('(^|[^a-z0-9])' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])').test(name);
    const e = norm(exam), l = norm(edu);
    let best, top = 0;
    for (const c of [...classes].sort((x, y) => x.id - y.id)) {
      const n = norm(c.class_name), score = (has(n, e) ? 2 : 0) + (has(n, l) ? 1 : 0);
      if (score > top) { best = c; top = score; }
    }
    return best;
  }
};

const a11y = () => document.querySelectorAll('.fg').forEach((g, i) => { const l = g.querySelector('label'), c = g.querySelector('input,select'); if (l && c) { c.id = c.id || 'f' + i; l.htmlFor = c.id; } });

(() => {
  const { esc, fd, matchClass, okUrl } = U;
  const app = document.getElementById('app');
  const LINKS = [
    ['Ders Programım', 'https://mektepiq1.github.io/d-mekan/dersprogram.html'],
    ['Defterim', 'https://mektepiq1.github.io/cay/cizgilideff.html']
  ];
  // Bağlantılar DOM'a (href) yazılmaz; yalnızca bellekte tutulur, tıklanınca açılır.
  const urls = new Map();
  let error = '', lastUser = '', orphan = false;

  const errorHtml = () => {
    const e = error; error = '';
    return e ? `<div class="alert er">${esc(e)}</div>` : '';
  };

  const loginView = () => `
    <div class="card form-card">
      <h2>Hoş Geldiniz</h2>
      <p class="sub-t">Sisteme erişmek için giriş yapın</p>
      ${errorHtml()}
      <form data-f="login">
        <div class="fg"><label>Kullanıcı Adı</label>
          <input name="un" required autocomplete="username" value="${esc(lastUser)}"></div>
        <div class="fg"><label>Şifre</label>
          <input name="pw" type="password" required autocomplete="current-password"></div>
        <button>Giriş Yap</button>
      </form>
    </div>`;

  const welcome = user => `
    <div class="top">
      <div class="wel">Hoş Geldin, ${esc(user.username)}!</div>
      <button class="out" data-a="logout">Çıkış Yap</button>
    </div>`;

  const optionTags = list => list.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');

  const profileView = (user, opts) => `
    <div class="card">${welcome(user)}
      <div class="card form-card" style="box-shadow:none;border:1px solid var(--line)">
        <h2>Profilinizi Tamamlayın</h2>
        ${errorHtml()}` +
        (opts.exam.length && opts.edu.length ? `
        <form data-f="profile">
          <div class="fg"><label>Sınav Seçiniz:</label>
            <select name="exam" required><option value="">-- Seçiniz --</option>${optionTags(opts.exam)}</select></div>
          <div class="fg"><label>Öğrenim Durumunuz:</label>
            <select name="education_status" required><option value="">-- Seçiniz --</option>${optionTags(opts.edu)}</select></div>
          <button>Kaydet ve Devam Et</button>
        </form>` : `<div class="warn"><p>Seçenekler henüz eklenmemiş.</p></div>`) + `
      </div>
    </div>`;

  // Çekmece: native <details>; JS gerektirmez. Dış çekmeceler name ile tek-açık çalışır.
  const drawer = (title, body, { open = false, meta = '', name = '' } = {}) =>
    `<details class="dr"${name ? ` name="${name}"` : ''}${open ? ' open' : ''}>
      <summary><span>${title}</span>${meta ? `<small>${esc(meta)}</small>` : ''}</summary>
      <div class="db">${body}</div></details>`;

  const openBtn = (key, label = 'Aç') => `<button type="button" class="btn lk" data-o="${key}">${label}</button>`;

  const panelView = (user, cls, lessons) => {
    urls.clear();
    LINKS.forEach(([, u], i) => urls.set('p' + i, u));
    lessons.forEach((l, i) => { if (okUrl(l.link_url)) urls.set('l' + i, l.link_url); });

    const classBody = cls
      ? drawer('Sınıfım', `<div class="class-card"><h3>${esc(cls.class_name)}</h3><p>Kayıt: ${fd(cls.created_at, false)}</p></div>`, { open: true })
        + drawer('Derslerim', lessons.length
          ? lessons.map((l, i) => `<div class="slesson"><span>${esc(l.lesson_name)}</span>${urls.has('l' + i) ? openBtn('l' + i, 'İncele') : ''}</div>`).join('')
          : '<div class="empty"><p>Ders eklenmemiş.</p></div>', { open: true, meta: String(lessons.length) })
      : '<div class="warn"><p>Sınıfınız henüz atanmadı.</p></div>';

    return `<div class="card">${welcome(user)}
      ${drawer('Sınıfım ve Derslerim', classBody, { open: true, name: 'acc' })}
      ${LINKS.map(([t], i) => drawer(t, openBtn('p' + i), { name: 'acc' })).join('')}
    </div>`;
  };

  async function currentUser() {
    const a = auth.currentUser;
    const u = a && await DB.get('users', a.uid);
    return u ? { ...u, _fbKey: a.uid } : undefined;
  }

  async function render() {
    try { await renderInner(); }
    catch (e) { app.innerHTML = `<div class="card"><div class="alert er" role="alert">${esc(errText(e))}</div></div>`; }
    a11y();
  }

  async function renderInner() {
    if (!auth.currentUser) return void (app.innerHTML = loginView());
    const user = await currentUser();
    if (!user) {
      orphan = true; await signOut(auth);
      error = 'Hesabınız bulunamadı veya devre dışı. Lütfen yöneticinize başvurun.';
      return void (app.innerHTML = loginView());
    }
    if (!user.exam || !user.education_status) {
      const opts = (await DB.all('options')).sort((a, b) => a.id - b.id);
      const by = type => opts.filter(o => o.type === type).map(o => o.label);
      return void (app.innerHTML = profileView(user, { exam: by('exam'), edu: by('edu') }));
    }
    const [classes, lessons] = await Promise.all([DB.all('classes'), DB.all('lessons')]);
    const cls = classes.find(c => c.id === user.class_id);
    app.innerHTML = panelView(user, cls, cls ? lessons.filter(l => l.class_id === cls.id).sort((a, b) => b.id - a.id) : []);
  }

  const forms = {
    async login(d) {
      const un = d.get('un').trim().toLowerCase();
      lastUser = d.get('un').trim();
      try {
        if (!USER_RE.test(un)) throw new Error('bad');
        const s = await get(ref(db, `usernames/${ukey(un)}`));
        if (!s.exists()) throw new Error('none');
        await signInWithEmailAndPassword(auth, s.val().email, d.get('pw'));
        lastUser = '';
      } catch (e) {
        error = e && e.code === 'auth/too-many-requests' ? errText(e) : 'Kullanıcı adı veya şifre hatalı.';
      }
    },
    async profile(d) {
      const user = await currentUser();
      const exam = d.get('exam'), edu = d.get('education_status');
      if (!user || !exam || !edu) return;
      const match = matchClass(await DB.all('classes'), exam, edu);
      await DB.put('users', { ...user, exam, education_status: edu, class_id: match ? match.id : user.class_id });
    }
  };

  app.addEventListener('submit', async e => {
    e.preventDefault();
    try { await forms[e.target.dataset.f]?.(new FormData(e.target)); } catch (err) { error = errText(err); }
    render();
  });

  app.addEventListener('click', async e => {
    const o = e.target.closest('[data-o]');
    if (o) {
      const u = urls.get(o.dataset.o);
      if (u && okUrl(u)) window.open(u, '_blank', 'noopener,noreferrer');
      return;
    }
    if (e.target.closest('[data-a]')?.dataset.a === 'logout') await signOut(auth);
  });

  // Bağlantı butonlarında sağ tık / sürükleme / kopyalama / seçme kapalı.
  const onLk = e => { const t = e.target.nodeType === 1 ? e.target : e.target.parentElement; return !!t?.closest('.lk'); };
  ['contextmenu', 'dragstart', 'copy', 'cut', 'selectstart'].forEach(t =>
    app.addEventListener(t, e => { if (onLk(e)) e.preventDefault(); }));

  onAuthStateChanged(auth, () => { if (orphan) { orphan = false; return; } render(); });
})();

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
