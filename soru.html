<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Bahçesi | Sınav Modu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background: linear-gradient(145deg, #f0f4fc 0%, #e9eefa 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        @media (min-width: 768px) { body { padding: 20px; } }
        .main-container { max-width: 1100px; margin: 0 auto; width: 100%; }
        .header { text-align: center; margin-bottom: 24px; padding: 0 8px; }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e2b5c 0%, #2d3a6e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @media (min-width: 768px) { .header h1 { font-size: 2.2rem; } }
        .header p { color: #6c757d; font-size: 0.9rem; }
        .accordion { width: 100%; }
        .accordion-item {
            margin-bottom: 20px;
            border-radius: 0 !important;
            overflow: hidden;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            width: 100%;
        }
        .accordion-button {
            font-size: 1rem;
            padding: 14px 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e2b5c 0%, #2d3a6e 100%);
            color: white;
            border: none;
            width: 100%;
            border-radius: 0 !important;
            flex-wrap: wrap;
            row-gap: 6px;
            text-align: left;
        }
        @media (min-width: 768px) { .accordion-button { padding: 18px 24px; } }
        .accordion-button:not(.collapsed) { background: linear-gradient(135deg, #1e2b5c 0%, #2d3a6e 100%); color: white; }
        .accordion-button:focus { box-shadow: none; }
        .accordion-button::after { filter: brightness(0) invert(1); margin-left: auto; }
        .accordion-body { background: #f8fafd; padding: 12px; width: 100%; }
        @media (min-width: 768px) { .accordion-body { padding: 20px; } }

        .konu-arama-kapsayici {
            padding: 12px;
            background: #e9eefa;
            margin-bottom: 16px;
            border-radius: 12px;
        }
        @media (min-width: 768px) { .konu-arama-kapsayici { padding: 15px 20px; margin-bottom: 20px; } }
        .konu-arama-kapsayici .form-control { font-size: 16px; min-height: 44px; }

        .test-accordion-item {
            margin-bottom: 16px;
            border-radius: 0 !important;
            overflow: hidden;
            border: 1px solid #eef2f9;
            background: white;
            width: 100%;
        }
        .test-accordion-button {
            font-size: 0.9rem;
            padding: 12px 14px;
            font-weight: 600;
            background: #ffffff;
            color: #1e2b5c;
            border: none;
            width: 100%;
            border-radius: 0 !important;
        }
        @media (min-width: 768px) { .test-accordion-button { padding: 14px 20px; } }
        .test-accordion-button:not(.collapsed) { background: #e9eefa; color: #1e2b5c; }
        .test-accordion-button:focus { box-shadow: none; }
        .test-accordion-button::after { filter: none; }
        .test-accordion-body { background: white; padding: 0 !important; width: 100%; }

        .soru-karti {
            background: #f8fafd;
            padding: 14px;
            border-bottom: 1px solid #eef2f9;
            width: 100%;
            display: block;
        }
        @media (min-width: 768px) { .soru-karti { padding: 20px; } }
        .soru-numarasi {
            display: inline-block;
            background: #1e2b5c;
            color: white;
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .soru-metni {
            font-weight: 600;
            color: #1e2b5c;
            margin-bottom: 16px;
            font-size: 1rem;
            line-height: 1.5;
            padding: 12px;
            background: white;
            border: 1px solid #eef2f9;
            width: 100%;
            overflow-wrap: anywhere;
        }
        .cevap-option {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            min-height: 48px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #eef2f9;
            cursor: pointer;
            width: 100%;
        }
        .cevap-option:hover { background: #f0f4fc; border-color: #1e2b5c; }
        .cevap-option input { margin-right: 14px; width: 20px; height: 20px; flex-shrink: 0; cursor: pointer; accent-color: #1e2b5c; }
        .cevap-option label { margin: 0; cursor: pointer; font-size: 0.9rem; color: #2c3e5c; flex: 1; overflow-wrap: anywhere; padding: 6px 0; }
        .sinav-bitir-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #198754 0%, #157347 100%);
            border: none;
            color: white;
            transition: all 0.2s;
        }
        .test-badge, .konu-badge {
            background: rgba(0,0,0,0.1);
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 0.7rem;
            margin-left: 12px;
            white-space: nowrap;
        }
        .modal-sonuc .modal-content { border-radius: 28px; border: none; overflow: hidden; }
        .modal-header { background: linear-gradient(135deg, #1e2b5c 0%, #2d3a6e 100%); color: white; padding: 20px 24px; }
        .modal-header .btn-close { filter: brightness(0) invert(1); }
        .modal-body { padding: 24px 16px; }
        @media (min-width: 576px) { .modal-body { padding: 30px 24px; } }
        .sonuc-detay { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 20px; }
        @media (min-width: 576px) { .sonuc-detay { gap: 20px; } }
        .sonuc-item { min-width: 100px; flex: 1 1 40%; padding: 16px 12px; border-radius: 20px; text-align: center; }
        @media (min-width: 576px) { .sonuc-item { flex: 1 1 0; padding: 20px 16px; } }
        .sonuc-item.dogru { background: #d4edda; color: #155724; }
        .sonuc-item.yanlis { background: #f8d7da; color: #721c24; }
        .sonuc-item.bos { background: #fff3cd; color: #856404; }
        .sonuc-item.basari { background: linear-gradient(135deg, #1e2b5c 0%, #2d3a6e 100%); color: white; }
        .sonuc-item .sayi { display: block; font-size: 2rem; font-weight: 800; }
        .btn-tekrar-dene { background: #1e2b5c; color: white; border: none; padding: 12px 32px; border-radius: 40px; font-weight: 600; }
        .bos-mesaj { text-align: center; padding: 60px 20px; background: white; border-radius: 24px; }
        .bos-mesaj i { font-size: 3rem; color: #cbd5e1; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="header">
        <h1><i class="fas fa-graduation-cap"></i> Öğrenci Bahçesi Sınav Modu</h1>
        <p>📅 KPSS Lise Soru Bankası</p>
    </div>

    <div id="sinavIcerik">
        <div class="bos-mesaj">
            <div class="spinner-border" style="color:#1e2b5c" role="status"></div>
            <p class="mt-3 mb-0">Sorular yükleniyor...</p>
        </div>
    </div>
</div>

<!-- SONUÇ MODAL -->
<div class="modal fade" id="sonucModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-sonuc">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-chart-simple me-2"></i>Sınav Sonucu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer justify-content-center pb-4">
                <button type="button" class="btn-tekrar-dene" data-bs-dismiss="modal"><i class="fas fa-redo-alt"></i> Tamam</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAAvvNSnaFNaDfh2nujq7ppbtw-y079ugE",
        authDomain: "kpisesorubanka.firebaseapp.com",
        projectId: "kpisesorubanka",
        storageBucket: "kpisesorubanka.firebasestorage.app",
        messagingSenderId: "1046349867430",
        appId: "1:1046349867430:web:dd053d150f0b0617244767",
        measurementId: "G-2SM053RDD2",
        // Konsolda Realtime Database > Data sekmesinde görünen adresle aynı olmalı
        databaseURL: "https://kpisesorubanka-default-rtdb.firebaseio.com"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const zaman = x => x.olusturma || 0;

    let konular = [], testler = [], sorular = [];

    async function veriCek() {
        const [k, t, s] = await Promise.all(
            ['konular', 'testler', 'sorular'].map(ad => get(ref(db, ad)))
        );
        const liste = snap => Object.entries(snap.val() || {}).map(([id, v]) => ({ id, ...v }));
        konular = liste(k).sort((a, b) => zaman(a) - zaman(b));
        testler = liste(t).sort((a, b) => zaman(a) - zaman(b));
        sorular = liste(s).sort((a, b) => (a.sira || 0) - (b.sira || 0));
    }

    function sinavlariYukle() {
        const container = document.getElementById('sinavIcerik');

        const gecerliKonular = konular.filter(k =>
            testler.filter(t => t.konu_id == k.id).some(t => sorular.some(s => s.test_id == t.id))
        );

        if (gecerliKonular.length === 0) {
            container.innerHTML = `
                <div class="bos-mesaj">
                    <i class="fas fa-inbox"></i>
                    <p>Henüz hiç soru eklenmemiş.</p>
                    <small class="text-muted">Önce soruadmin.html panelinden konu, test ve soru ekleyin.</small>
                </div>`;
            return;
        }

        let html = '<div class="accordion" id="konuAccordion">';
        gecerliKonular.forEach((konu, idx) => {
            const konuTestleri = testler.filter(t => t.konu_id == konu.id && sorular.some(s => s.test_id == t.id));
            html += `
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button ${idx !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#collapseKonu${konu.id}">
                        <i class="fas fa-book me-2"></i> ${esc(konu.konu_adi)}
                        <span class="konu-badge">${konuTestleri.length} test</span>
                    </button>
                </h2>
                <div id="collapseKonu${konu.id}" class="accordion-collapse collapse ${idx === 0 ? 'show' : ''}" data-bs-parent="#konuAccordion">
                    <div class="accordion-body">
                        <div class="konu-arama-kapsayici">
                            <input type="text" class="form-control konu-arama" data-konu-id="${konu.id}" placeholder="🔍 Bu konu altındaki sorular içinde ara...">
                        </div>
                        <div class="accordion" id="testAccordion_${konu.id}">`;

            konuTestleri.forEach((test, tIdx) => {
                const testSorulari = sorular.filter(s => s.test_id == test.id);
                html += `
                <div class="test-accordion-item test-kapsayici-${konu.id}">
                    <h2 class="accordion-header">
                        <button class="accordion-button test-accordion-button ${tIdx !== 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTest${test.id}">
                            <i class="fas fa-file-alt me-2"></i> ${esc(test.test_adi)}
                            <span class="test-badge">${testSorulari.length} soru</span>
                        </button>
                    </h2>
                    <div id="collapseTest${test.id}" class="accordion-collapse collapse ${tIdx === 0 ? 'show' : ''}" data-bs-parent="#testAccordion_${konu.id}">
                        <div class="test-accordion-body">
                            <form class="test-formu" data-test-id="${test.id}" data-test-adi="${esc(test.test_adi)}">
                                <div class="sorular-alani">`;

                testSorulari.forEach((soru, sIdx) => {
                    const icerik = (soru.soru_metni + ' ' + soru.cevap_a + ' ' + soru.cevap_b + ' ' + soru.cevap_c + ' ' + soru.cevap_d + ' ' + soru.cevap_e).toLowerCase();
                    html += `
                    <div class="soru-karti" data-icerik="${esc(icerik)}">
                        <div class="soru-numarasi">Soru ${sIdx + 1}</div>
                        <div class="soru-metni">${esc(soru.soru_metni).replace(/\n/g, '<br>')}</div>
                        ${['a','b','c','d','e'].map(h => `
                        <div class="cevap-option"><input type="radio" name="cevap_${soru.id}" value="${h.toUpperCase()}" id="s_${soru.id}_${h}"><label for="s_${soru.id}_${h}"><strong>${h.toUpperCase()})</strong> ${esc(soru['cevap_' + h])}</label></div>`).join('')}
                    </div>`;
                });

                html += `</div>
                                <button type="submit" class="sinav-bitir-btn">
                                    <i class="fas fa-flag-checkered"></i> Bu Testi Bitir
                                </button>
                            </form>
                        </div>
                    </div>
                </div>`;
            });

            html += `</div></div></div></div>`;
        });
        html += `</div>`;
        container.innerHTML = html;

        // Test bitirme
        container.querySelectorAll('.test-formu').forEach(form => {
            form.addEventListener('submit', e => testiBitir(e, form.dataset.testId, form.dataset.testAdi));
        });

        // Konu bazlı arama
        container.querySelectorAll('.konu-arama').forEach(input => {
            input.addEventListener('input', function () {
                const konuId = this.getAttribute('data-konu-id');
                const aramaMetni = this.value.toLowerCase().trim();
                document.querySelectorAll(`.test-kapsayici-${konuId}`).forEach(testKapsayici => {
                    let eslesme = false;
                    testKapsayici.querySelectorAll('.soru-karti').forEach(kart => {
                        const var_ = kart.getAttribute('data-icerik').includes(aramaMetni);
                        kart.style.display = var_ ? 'block' : 'none';
                        if (var_) eslesme = true;
                    });
                    testKapsayici.style.display = eslesme ? 'block' : 'none';
                });
            });
        });
    }

    function testiBitir(e, testId, testAdi) {
        e.preventDefault();
        const testSorulari = sorular.filter(s => s.test_id == testId);
        const toplamSoru = testSorulari.length;
        let dogru = 0, yanlis = 0, bos = 0;

        const formData = new FormData(e.target);
        testSorulari.forEach(soru => {
            const kullaniciCevap = formData.get(`cevap_${soru.id}`);
            if (!kullaniciCevap) bos++;
            else if (kullaniciCevap === soru.dogru_cevap) dogru++;
            else yanlis++;
        });

        const yuzde = toplamSoru > 0 ? Math.round((dogru / toplamSoru) * 100 * 10) / 10 : 0;
        const renk = yuzde >= 70 ? '#198754' : (yuzde >= 50 ? '#fd7e14' : '#dc3545');
        const icon = yuzde >= 70 ? 'fa-trophy' : (yuzde >= 50 ? 'fa-thumbs-up' : 'fa-book-open');

        document.getElementById('modalBody').innerHTML = `
            <h4 class="text-center mb-4"><i class="fas ${icon}" style="color: ${renk};"></i> ${esc(testAdi)}</h4>
            <div class="sonuc-detay">
                <div class="sonuc-item dogru"><i class="fas fa-check-circle fa-2x"></i><span class="sayi">${dogru}</span><span class="label">Doğru</span></div>
                <div class="sonuc-item yanlis"><i class="fas fa-times-circle fa-2x"></i><span class="sayi">${yanlis}</span><span class="label">Yanlış</span></div>
                <div class="sonuc-item bos"><i class="fas fa-minus-circle fa-2x"></i><span class="sayi">${bos}</span><span class="label">Boş</span></div>
                <div class="sonuc-item basari"><i class="fas fa-percent fa-2x"></i><span class="sayi">${yuzde}%</span><span class="label">Başarı</span></div>
            </div>
            <div class="text-center mt-3"><small class="text-muted">Toplam ${toplamSoru} soru üzerinden değerlendirilmiştir.</small></div>
        `;
        new bootstrap.Modal(document.getElementById('sonucModal')).show();
    }

    (async () => {
        try {
            await veriCek();
            sinavlariYukle();
        } catch (err) {
            console.error(err);
            document.getElementById('sinavIcerik').innerHTML = `
                <div class="bos-mesaj">
                    <i class="fas fa-triangle-exclamation"></i>
                    <p>Sorular yüklenemedi.</p>
                    <small class="text-muted">İnternet bağlantınızı kontrol edip sayfayı yenileyin.</small>
                </div>`;
        }
    })();
</script>
</body>
</html>
