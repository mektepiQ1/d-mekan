    <style>
:root{--navy-950:#071633;--navy-900:#0a1f44;--navy-800:#10295a;--navy-700:#1b3a73;--navy-600:#2a4d8f;--navy-300:#9fb3d6;--navy-200:#c9d5ea;--navy-100:#e6ecf7;--navy-50:#f4f7fc;--radius:12px;--shadow:0 2px 10px rgba(10,31,68,.08);--t:.28s}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:0;background:var(--navy-50);color:var(--navy-900);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
main.wrap{padding-top:22px;padding-bottom:60px}
.topbar{background:linear-gradient(135deg,var(--navy-950),var(--navy-800));color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(7,22,51,.25)}
.bar{display:flex;align-items:center;min-height:58px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:18px}
.brand svg{width:28px;height:28px;flex:none}
.page-title{font-size:24px;margin:0 0 14px;font-weight:700}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ara-input,.konu-arama-kapsayici .form-control{width:100%;padding:11px 12px;min-height:44px;border:1px solid var(--navy-300);border-radius:10px;background:#fff;color:var(--navy-900);font:inherit;font-size:16px;outline:none;box-shadow:none;transition:border-color .2s,box-shadow .2s}
.ara-input{flex:1;min-width:180px;width:auto}
.ara-input:focus,.konu-arama-kapsayici .form-control:focus{border-color:var(--navy-600);box-shadow:0 0 0 3px rgba(42,77,143,.18)}
.hepsi-btn{padding:11px 16px;border-radius:10px;border:1px solid var(--navy-300);background:#fff;color:var(--navy-800);font:inherit;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.hepsi-btn:hover{background:var(--navy-100)}
.stats{font-size:13px;color:var(--navy-600);margin:0 2px 12px;min-height:20px}

/* Akordeon: konu.html ile aynı görünüm */
.accordion{--bs-accordion-border-width:0;--bs-accordion-bg:transparent;width:100%}
.accordion-item{background:#fff;border:1px solid var(--navy-200)!important;border-radius:var(--radius)!important;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);width:100%}
.accordion-button{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;padding:14px 16px;background:transparent!important;color:var(--navy-900)!important;box-shadow:none!important;border:0;border-radius:0!important;text-align:left;width:100%}
.accordion-button:hover{background:var(--navy-50)!important}
.accordion-button:focus-visible{outline:2px solid var(--navy-600);outline-offset:-2px}
.accordion-button::after{content:"";background-image:none!important;flex:none;width:9px;height:9px;margin:0 4px 3px auto;border-right:2px solid var(--navy-600);border-bottom:2px solid var(--navy-600);transform:rotate(45deg)!important;transition:transform var(--t)}
.accordion-button:not(.collapsed)::after{transform:rotate(225deg)!important}
.accordion-body{background:#fff;padding:12px;border-top:1px solid var(--navy-100);width:100%}
.konu-arama-kapsayici{padding:0 0 12px;background:transparent;margin:0}
.test-accordion-item{background:var(--navy-50);border:1px solid var(--navy-200)!important;border-radius:10px!important;margin-bottom:8px;overflow:hidden;box-shadow:none;width:100%}
.test-accordion-button{font-size:15px;padding:12px 14px;min-height:44px}
.test-accordion-button:hover{background:var(--navy-100)!important}
.test-accordion-button:not(.collapsed){background:var(--navy-100)!important}
.test-collapse{display:none}
.test-collapse.tam-acik{display:block!important;position:fixed;inset:0;z-index:1040;background:#fff;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:tamGir .18s ease-out}
@keyframes tamGir{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.tam-ust{display:none}
.tam-acik .tam-ust{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2;background:var(--navy-900);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tam-baslik{flex:1;min-width:0;font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tam-kapat{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:8px 14px;border-radius:10px;min-height:42px;cursor:pointer}
.tam-kapat:active{background:rgba(255,255,255,.3)}

/* ---- Kalem (çizim) ---- */
.tam-kalem{flex:none;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tam-kalem.aktif{background:#fff;color:var(--navy-900)}
.kalem-panel{display:none;position:absolute;top:calc(100% + 6px);right:8px;z-index:5;background:#fff;color:var(--navy-900);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);width:min(290px,calc(100vw - 16px))}
.kalem-panel.acik{display:block}
.kalem-satir{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.kalem-satir:last-child{margin-bottom:0}
.kalem-renk{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer;padding:0}

.kalem-kalin{width:40px;height:40px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.kalem-kalin i{display:block;background:var(--navy-900);border-radius:99px;width:22px}
.kalem-kalin.secili{background:var(--navy-100);border-color:var(--navy-900)}
.kalem-btn{flex:1;min-height:40px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--navy-900)}
.kalem-btn.secili{background:var(--navy-900);color:#fff;border-color:var(--navy-900)}
.kalem-panel{max-height:calc(100vh - 90px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.kalem-araclar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.kalem-arac{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:4px 2px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:var(--navy-900);font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.kalem-arac svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kalem-arac.secili{background:var(--navy-100);border-color:var(--navy-900);box-shadow:inset 0 0 0 1px var(--navy-900)}
.kalem-btn:disabled{opacity:.4;cursor:default}
.kalem-panel.acik{display:block}
.kalem-panel.soluk{opacity:.22;pointer-events:none}
.kalem-izgara+.kalem-izgara{margin-top:4px;padding-top:4px;border-top:1px solid var(--navy-100)}
.kalem-ik{position:relative;height:42px;min-width:0;padding:0;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--navy-900);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.kalem-ik svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kalem-ik.secili{background:var(--navy-900);color:#fff}
.kalem-ik.anahtar svg .dolgu{fill:currentColor;fill-opacity:.12}
.kalem-ik.anahtar.secili{background:var(--navy-100);color:var(--navy-900);border-color:var(--navy-900)}
.kalem-ik.anahtar.secili svg .dolgu{fill-opacity:.8}
.kalem-ik:disabled{opacity:.28;cursor:default}
.kalem-ik.onay{background:#dc3545;color:#fff}
.kalem-ik.bitir{background:#198754;color:#fff}
.kalem-pop[hidden]{display:none}
.kalem-pop .kalem-satir{justify-content:space-between;margin-bottom:8px}
.kalem-pop .kalem-satir:last-child{margin-bottom:0}
.kalem-pop p{margin:0;font-size:13px;color:#475569;line-height:1.5}
.kalem-panel{display:none;position:absolute;top:calc(100% + 6px);right:8px;left:auto;bottom:auto;margin:0;width:216px;max-width:calc(100vw - 16px);max-height:none;overflow:visible;z-index:1050;background:#fff;border-radius:14px;padding:8px;box-shadow:0 8px 24px rgba(7,22,51,.28);transition:opacity .15s}
.kalem-izgara{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.kalem-blok{margin-top:6px;padding-top:6px;border-top:1px solid var(--navy-100)}
.kalem-panel .kalem-satir{display:flex;justify-content:space-between;gap:0;flex-wrap:nowrap;margin-bottom:0;padding-left:2px;padding-right:2px}
.kalem-panel .kalem-renk{width:26px;height:26px;border-width:2px}
.kalem-panel .kalem-ik{height:40px}
.kalem-ik i{display:block;width:20px;background:currentColor;border-radius:99px}
.kalem-ik.yazi{font:inherit;font-size:12px;font-weight:700;height:34px}
.kalem-ik.genis{grid-column:span 3;gap:8px;font:inherit;font-size:14px;font-weight:700}
.kalem-etiket{font-size:11.5px;font-weight:700;color:var(--navy-600);margin:0 2px 5px;letter-spacing:.2px}
.kalem-panel .kalem-pop{margin:6px 0 0;padding:8px 2px 0;border:0;border-top:1px solid var(--navy-100)}
.tam-kalem:disabled{opacity:.4}
.tam-geri{margin-left:auto;margin-right:-2px}
.tam-kalem svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tam-acik .soru-karti{padding-bottom:calc(14px + var(--cozum,0px))}
.baslik-satir{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.baslik-satir .page-title{margin:0;min-width:0}
.yt-btn{flex:none;display:inline-flex;align-items:center;gap:8px;background:#e62117;color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 1px 4px rgba(230,33,23,.35)}
.yt-btn:active{filter:brightness(.92)}

.yt-pencere{position:fixed;z-index:1070;left:8px;top:72px;width:320px;background:#0f172a;color:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}
.yt-pencere[hidden]{display:none}
.yt-ust{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--navy-900);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}

.yt-baslik{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;white-space:nowrap}

.yt-ik{flex:none;width:32px;height:32px;padding:0;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}

.yt-giris{display:flex;gap:6px;padding:8px;background:#1e293b}
.yt-giris input{flex:1;min-width:0;height:36px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;padding:0 10px;font:inherit;font-size:16px}

.yt-giris button{flex:none;height:36px;border-radius:8px;border:0;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:#fff;background:#334155;padding:0 10px;display:inline-flex;align-items:center}
.yt-giris .yt-oynat{background:#e62117}
.yt-giris button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.yt-sahne{position:relative}
.yt-video{position:relative;width:100%;height:180px;background:#000;overflow:hidden}
.yt-cizim{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair}
.yt-cizim[hidden]{display:none}
.yt-kalem{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#1e293b;flex-wrap:wrap}
.yt-kalem[hidden]{display:none}
.yt-kalem button{flex:none;height:32px;min-width:32px;border-radius:8px;border:2px solid rgba(255,255,255,.35);background:#334155;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:0 8px;cursor:pointer}
.yt-kalem .renk{width:32px;padding:0;border-radius:50%}

.yt-ik.acik{background:#38bdf8;border-color:#38bdf8;color:#0f172a}
.yt-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.yt-bos{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;font-size:13px;color:#cbd5e1;line-height:1.45}

.yt-pencere .yt-baslik span{overflow:hidden;text-overflow:ellipsis}
.vd-panel{position:fixed;inset:0;z-index:1060;background:rgba(10,20,50,.55);display:flex;align-items:flex-end;justify-content:center}
.vd-panel[hidden]{display:none}

details[open]>summary>.vd-ok{transform:rotate(90deg)}
.vd-ic{padding:2px 8px 8px}
.vd-dal.vd-og>summary{background:#1e2b5c;color:#fff}

.vd-dal.vd-ders>summary{background:#eef1fb}
.vd-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid #dfe5f3;background:#fff;border-radius:10px;padding:11px 12px;min-height:46px;margin-bottom:6px;font:inherit;font-weight:700;color:#1e2b5c;cursor:pointer}

.vd-btn .vd-oynat{flex:none;width:30px;height:30px;border-radius:50%;background:#e62117;color:#fff;display:grid;place-items:center;font-size:11px}

.yt-alt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 2px 10px;background:#1e293b;font-size:12px}

.yt-tutac{flex:none;width:34px;height:30px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 4px 4px 0;cursor:nwse-resize;touch-action:none;color:#cbd5e1}
.yt-tutac svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.kalem-tuval{position:absolute;left:0;top:0;z-index:1;pointer-events:none;touch-action:auto}
.kalem-tuval.cizim{pointer-events:auto;touch-action:none;cursor:crosshair}
.test-accordion-body{position:relative}
.tam-acik .test-accordion-body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}
body.tam-kilit{overflow:hidden}
.test-accordion-body{background:#fff;padding:0!important;width:100%}
.konu-badge,.test-badge{font-size:12px;font-weight:700;background:var(--navy-100);color:var(--navy-800);padding:2px 9px;border-radius:999px;white-space:nowrap;margin-left:0}
.accordion-button .emo{flex:none;font-size:18px;line-height:1}

        .sonuc-ust { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .halka { width: 132px; height: 132px; flex: 0 0 132px; border-radius: 50%; display: grid; place-items: center; }

        .sonuc-kutu { padding: 10px 12px; border-radius: 16px; text-align: center; background: #fff; border: 1px solid #eef2f9; }
        .sonuc-kutu .sayi { display: block; font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
        .sonuc-kutu .etiket { font-size: .8rem; }
        .sonuc-kutu.k-dogru { background: #d4edda; color: #155724; border-color: #c3e6cb; }
        .sonuc-kutu.k-yanlis { background: #f8d7da; color: #721c24; border-color: #f1b0b7; }
        .sonuc-kutu.k-bos { background: #fff3cd; color: #856404; border-color: #ffe69c; }
        .sonuc-mesaj { text-align: center; color: #6c757d; font-size: .9rem; margin-bottom: 16px; }
        .sonuc-filtre { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; }
        .sonuc-filtre button { border: 1px solid #dbe2f0; background: #fff; color: #0a1f44; border-radius: 30px; padding: 6px 14px; font-size: .85rem; font-weight: 600; min-height: 38px; }
        .sonuc-filtre button.aktif { background: #0a1f44; color: #fff; border-color: #0a1f44; }
        .sonuc-filtre button:disabled { opacity: .45; }
        .sonuc-soru { background: #fff; border: 1px solid #e6ebf5; border-left: 5px solid #cbd5e1; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
        .sonuc-soru.d-dogru { border-left-color: #198754; }
        .sonuc-soru.d-yanlis { border-left-color: #dc3545; }
        .sonuc-soru.d-bos { border-left-color: #f2c200; }
        .sonuc-soru-ust { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .sonuc-soru-ust .soru-numarasi { margin-bottom: 0; }
        .durum-rozet { font-size: .8rem; font-weight: 700; padding: 4px 12px; border-radius: 30px; }
        .durum-rozet.r-dogru { background: #d4edda; color: #155724; }
        .durum-rozet.r-yanlis { background: #f8d7da; color: #721c24; }
        .durum-rozet.r-bos { background: #fff3cd; color: #856404; }
        .sonuc-soru-metni { font-weight: 600; color: #0a1f44; line-height: 1.5; margin-bottom: 10px; overflow-wrap: anywhere; }
        .sonuc-sik { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 8px 12px; margin-bottom: 6px; border: 1px solid #eef2f9; border-radius: 10px; background: #fff; font-size: .9rem; color: #2c3e5c; overflow-wrap: anywhere; }
        .sonuc-sik .sik-metin { flex: 1 1 140px; min-width: 0; }
        .sonuc-sik.sk-dogru { background: #d4edda; border-color: #b7e1c1; color: #155724; }
        .sonuc-sik.sk-yanlis { background: #f8d7da; border-color: #f1b0b7; color: #721c24; }
        .sik-etiket { font-size: .72rem; font-weight: 700; white-space: nowrap; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,.7); }
        .cevap-ozet { margin-top: 8px; font-size: .85rem; color: #6c757d; }
        .cevap-ozet b { color: #0a1f44; }

.neler-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.32);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}

.neler-sek button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font:inherit;font-size:14px;font-weight:600;color:var(--navy-700);cursor:pointer}

.neler-deger p{margin:0 0 6px}.neler-deger p:last-child{margin:0}
.neler-baslik{font-size:.95rem;font-weight:700;color:#1e2b5c;margin:18px 0 8px}
.neler-grafik{display:flex;align-items:flex-end;gap:3px;height:110px;background:#fff;border:1px solid var(--navy-200);border-radius:12px;padding:10px 8px 6px}
.neler-grafik .kol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}

.neler-grafik .yigin i{display:block}
.neler-grafik small{font-size:10px;color:var(--navy-600);margin-top:3px;line-height:1}
.neler-konu{background:#fff;border:1px solid var(--navy-200);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.neler-konu .ust{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:600}
.neler-konu .alt{font-size:.78rem;color:var(--navy-600);margin-top:2px}
.neler-cubuk{height:8px;border-radius:6px;background:#f8d7da;overflow:hidden;margin-top:6px}
.neler-cubuk i{display:block;height:100%;background:#198754}
.neler-son{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--navy-200);border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:.88rem}
.neler-son .ad{font-weight:600;overflow-wrap:anywhere}.neler-son .tarih{font-size:.75rem;color:var(--navy-600)}
.neler-son .rk{white-space:nowrap;font-weight:700;font-size:.82rem}
.neler-bos{text-align:center;padding:36px 12px;color:var(--navy-600)}
.neler-bos i{font-size:2.6rem;color:var(--navy-200);margin-bottom:10px}
.neler-temizle{display:block;margin:18px auto 0;background:none;border:0;color:#9b2c3a;font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer}

/* ---- Koyu tema ---- */
.tema-btn{margin-left:auto;flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.32);color:#fff;border-radius:10px;cursor:pointer}
.bar{gap:8px}.brand{min-width:0}.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.neler-btn{padding:8px 10px}
.tema-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tema-btn .gunes{display:none}
html[data-tema="dark"] .tema-btn .ay{display:none}
html[data-tema="dark"] .tema-btn .gunes{display:block}
html[data-tema="dark"]{color-scheme:dark;
 --navy-900:#e6ecf7;--navy-800:#c9d5ea;--navy-700:#b9c8e6;--navy-600:#9fb3d6;--navy-300:#3d5080;--navy-200:#2a3a5c;--navy-100:#1a2540;--navy-50:#0b1220;

html[data-tema="dark"] .sonuc-kutu.k-yanlis,html[data-tema="dark"] .sonuc-item.yanlis,html[data-tema="dark"] .durum-rozet.r-yanlis{background:#3d1a20;color:#f5b3bb;border-color:#7a2a35}
html[data-tema="dark"] .sonuc-kutu.k-bos,html[data-tema="dark"] .sonuc-item.bos,html[data-tema="dark"] .durum-rozet.r-bos{background:#3b3114;color:#f3dc8a;border-color:#7a6320}

html[data-tema="dark"] .kalem-btn.secili,html[data-tema="dark"] .kalem-ik.secili,html[data-tema="dark"] .tam-ust{background:var(--d-mavi);color:#fff}

<body>
<header class="topbar">
  <div class="wrap bar">
    <span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 7-8 7z"/><path d="M12 14c0-3-2.5-5-7-5 0 4 2.5 5 7 5z"/></svg><span>Öğrenci Bahçesi</span></span>
    <button id="tema" class="tema-btn" type="button" aria-label="Koyu tema" title="Koyu / açık tema"><svg class="ay" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="gunes" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

  </div>
</header>
<main class="wrap">

    // import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app-check.js";
    // initializeAppCheck(app, { provider: new ReCaptchaV3Provider('BURAYA_SITE_KEY'), isTokenAutoRefreshEnabled: true });

    const db = getDatabase(app);

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const $ = id => document.getElementById(id);
    const zaman = x => x.olusturma || 0;

    // ---------- localStorage (kota/erişim hatalarına karşı korumalı) ----------
    // Önbellek anahtarı veritabanına özel: aynı alan adındaki farklı sınıf sayfaları birbirinin önbelleğini ezmesin
    const LS = 'sb2_' + String(firebaseConfig.projectId || '').replace(/[^\w-]/g, '') + '_';
    function lsOku(anahtar) {
        try {
            const ham = localStorage.getItem(LS + anahtar);
            return ham ? JSON.parse(ham) : null;
        } catch (err) { return null; }
    }
    function lsYaz(anahtar, deger) {
        let metin;
        try { metin = JSON.stringify(deger); } catch (err) { return false; }
        try {
            localStorage.setItem(LS + anahtar, metin);
            return true;
        } catch (err) {
            // Kota doluysa soru önbelleklerini temizleyip bir kez daha dene
            try {
                Object.keys(localStorage)
                    .filter(a => a.startsWith(LS + 't_'))
                    .forEach(a => localStorage.removeItem(a));
                localStorage.setItem(LS + anahtar, metin);
                return true;
            } catch (err2) { return false; }
        }
    }

    // ---------- Önbellek: IndexedDB (büyük kapasite); olmazsa localStorage'a düşer ----------
    // Eski localStorage önbellekleri okunmaya devam eder (yeniden indirme gerekmez); sürüm kontrolü çağıranda yapılır.
    const IDB_AD = 'sb2-onbellek', IDB_DEPO = 'kv';
    let idbSoz = null;
    const idbAc = () => idbSoz || (idbSoz = new Promise((res, rej) => {
        if (!('indexedDB' in window)) return rej(new Error('idb yok'));
        const r = indexedDB.open(IDB_AD, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(IDB_DEPO);
        r.onsuccess = () => res(r.result);
        r.onerror = r.onblocked = () => { idbSoz = null; rej(r.error || new Error('idb')); };
    }));
    const idbIs = (mod, fn) => idbAc().then(d => new Promise((res, rej) => {
        const t = d.transaction(IDB_DEPO, mod), q = fn(t.objectStore(IDB_DEPO));
        t.oncomplete = () => res(q && q.result);
        t.onerror = t.onabort = () => rej(t.error || new Error('idb'));
    }));
    async function depoOku(anahtar) {
        try { const v = await idbIs('readonly', s => s.get(LS + anahtar)); if (v != null) return v; } catch (err) {}
        return lsOku(anahtar);
    }
    async function depoYaz(anahtar, deger) {
        try {
            await idbIs('readwrite', s => s.put(deger, LS + anahtar));
            try { localStorage.removeItem(LS + anahtar); } catch (err) {}   // eski kopya yer kaplamasın
            return true;
        } catch (err) { return lsYaz(anahtar, deger); }
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (err) {}

    // ---------- Bellekteki durum ----------
    let surum = 0;                       // meta/guncelleme değeri
    let konular = [], testler = [];
    let testlerByKonu = new Map();       // konuId -> [test]
    let testById = new Map();            // testId -> test
    const sorularByTest = new Map();     // testId -> [soru] (sira'ya göre)
    const aramaIndeks = new Map();       // testId -> [{id, metin}]
    const yukleniyor = new Map();        // testId -> Promise (aynı anda tekrar indirmeyi önler)
    const kartEl = new Map();            // soruId -> DOM elemanı
    const aramaDurumu = new Map();       // konuId -> son arama metni

            <span>Sorular yükleniyor...</span>

    function hataMetni(err) {
        const kod = String((err && (err.code || err.message)) || '');
        if (/permission/i.test(kod)) return 'Verilere erişim izni verilmedi. Lütfen daha sonra tekrar deneyin.';
        if (/network|offline|unavailable|baglanti|timeout/i.test(kod)) return 'İnternet bağlantısı kurulamadı. Bağlantınızı kontrol edip tekrar deneyin.';
        return 'Beklenmeyen bir sorun oluştu. Lütfen tekrar deneyin.';
    }

    // ---------- Konular ve testler (önbellekli) ----------
    const liste = snap => Object.entries(snap.val() || {}).map(([id, v]) => ({ id, ...v }));

    // Firebase get() internet yokken beklemede kalabilir; süre aşımı ile önbelleğe düşülür
    const sure = (p, ms = 7000) => Promise.race([p, new Promise((_, j) => setTimeout(() => j(new Error('zaman')), ms))]);

    const katalogGecerli = o => o && Array.isArray(o.konular) && Array.isArray(o.testler);

    // Önbellekten anında yükler (ağ beklemez). Önbellek yoksa false döner.
    async function katalogOnbellektenYukle() {
        const o = await depoOku('katalog');
        if (!katalogGecerli(o)) return false;
        surum = o.v || 0; konular = o.konular; testler = o.testler;
        return true;
    }

    // Ağdan sürümü kontrol eder; değiştiyse indirir. true = katalog değişti, false = aynı/çevrimdışı.
    async function katalogGuncelle() {
        if (!navigator.onLine) return false;
        let uzak = 0;
        try {
            const s = await sure(get(ref(db, 'sb/meta/guncelleme')));
            uzak = Number(s.val()) || 0;
        } catch (err) { console.error(err); return false; }
        if (uzak > 0 && uzak === surum) return false;
        try {
            const [k, t] = await sure(Promise.all([get(ref(db, 'sb/konular')), get(ref(db, 'sb/testler'))]), 20000);
            konular = liste(k).sort((a, b) => zaman(a) - zaman(b));
            testler = liste(t).sort((a, b) => zaman(a) - zaman(b));
            surum = uzak;
            depoYaz('katalog', { v: surum, konular, testler });
            return true;
        } catch (err) { console.error(err); return false; }
    }

    // Map ile gruplama (iç içe filter/some yok)
    function indeksle() {
        testlerByKonu = new Map();
        testById = new Map();
        testler.forEach(t => {
            testById.set(t.id, t);
            if (!testlerByKonu.has(t.konu_id)) testlerByKonu.set(t.konu_id, []);
            testlerByKonu.get(t.konu_id).push(t);
        });
    }
    // soru_sayisi kaydı yoksa (taşıma öncesi) test gösterilir; 0 ise gizlenir
    const gorunur = t => !Number.isFinite(t.soru_sayisi) || t.soru_sayisi > 0;
    const testSurumu = t => t.guncelleme || surum;

    // ---------- Bir testin soruları (lazy load + önbellek) ----------
    function aramaIndeksiKur(testId, sorular) {
        aramaIndeks.set(testId, sorular.map(s => ({
            id: s.id,
            metin: [s.soru_metni, s.cevap_a, s.cevap_b, s.cevap_c, s.cevap_d, s.cevap_e].join(' ').toLowerCase()
        })));
    }

    function testSorulariniAl(test) {
        const id = test.id;
        if (sorularByTest.has(id)) return Promise.resolve(sorularByTest.get(id));
        if (yukleniyor.has(id)) return yukleniyor.get(id);

        const p = (async () => {
            const v = testSurumu(test);
            const onb = await depoOku('t_' + id);
            let sorular;
            const var_ = onb && Array.isArray(onb.sorular);
            if (var_ && (!navigator.onLine || (v > 0 && onb.v === v))) {
                sorular = onb.sorular;
            } else {
                try {
                    const snap = await sure(get(ref(db, 'sb/sorular/' + id)), 20000);
                    sorular = liste(snap).sort((a, b) => ((a.sira || 0) - (b.sira || 0)) || (zaman(a) - zaman(b)));
                    depoYaz('t_' + id, { v, sorular });
                } catch (e) {
                    if (!var_) throw e;           // bağlantı yok: eldeki kopya
                    sorular = onb.sorular;
                }
            }
            sorularByTest.set(id, sorular);
            aramaIndeksiKur(id, sorular);
            return sorular;
        })();

        yukleniyor.set(id, p);
        const temizle = () => yukleniyor.delete(id);
        p.then(temizle, temizle);
        return p;
    }

    // Soru metnini okunaklı paragraflara böler (Türkçe, matematik, coğrafya, tarih, vatandaşlık...):
    //  1) "(Cevap: X)" ifadesi gizlenir.
    //  2) Metinde boş satır varsa aynen paragraflara ayrılır.
    //  3) Boş satır yoksa: I. II. III. öncülleri ayrı satıra alınır, son cümle soru kökü ise ayrı kalın paragraf olur.
    function soruMetniHtml(ham) {
        let t = String(ham ?? '').replace(/\r\n?/g, '\n')
            .replace(/\s*\(?\s*Cevap\s*:\s*[A-Ea-e]\s*\)?\s*$/i, '').trim();
        if (!/\n\s*\n/.test(t)) {
            // Öncüller (I. II. III. ...) her biri yeni satırda
            if (/(^|\s)I\.\s/.test(t) && /\sII\.\s/.test(t))
                t = t.replace(/\s+((?:VIII|VII|VI|IV|V|III|II|I)\.\s+(?=\S))/g, '\n$1');
            // Son cümle soru kökü mü?
            const KOK = /(\?|hangisi|hangileri|aşağıdaki|yukarıdaki|kaçtır|nedir|söylenemez|çıkarılamaz|söylenebilir)/i;
            const re = /[.!?…:][”"»’')]?\s+/g;
            let m, kes = -1;
            while ((m = re.exec(t))) {
                const onceki = t[m.index - 1] || '';
                const sonraki = t[m.index + m[0].length] || '';
                if (/[a-zçğıöşüâîû0-9”"»)’']/.test(onceki) && /[A-ZÇĞİÖŞÜ0-9"“(]/.test(sonraki)) kes = m.index + m[0].length;
            }
            if (kes > 0) {
                const bas = t.slice(0, kes).trimEnd(), kok = t.slice(kes);
                if (/[?.:]$/.test(kok) && KOK.test(kok) && !/^(I|II|III|IV|V)\.\s/.test(kok)) t = bas + '\n\n' + kok;
            }
        }
        const par = t.split(/\n\s*\n/);
        return par.map((p, i) =>
            `<p class="sm-p${i === par.length - 1 && par.length > 1 ? ' sm-kok' : ''}">${esc(p.trim()).replace(/\n/g, '<br>')}</p>`).join('');
    }

        const q = String(ham || '').toLowerCase().trim();
        aramaDurumu.set(konuId, q);
        const konuTestleri = (testlerByKonu.get(konuId) || []).filter(gorunur);

        konuTestleri.forEach(t => {
            const item = $('testItem_' + t.id);

                return;
            }
            if (!idx) {            // henüz yüklenmemiş test: aramaya dahil değil
                acilmamis++;
                item.style.display = 'none';
                return;
            }
            let eslesme = false;
            idx.forEach(x => {
                const var_ = x.metin.includes(q);
                const el = kartEl.get(x.id);
                if (el) el.style.display = var_ ? 'block' : 'none';
                if (var_) eslesme = true;

    async function konuTestleriniYukle(konuId, btn) {

        btn.disabled = true;
        btn.textContent = 'Yükleniyor...';

            for (let i = 0; i < bekleyen.length; i += 4) {
                await Promise.all(bekleyen.slice(i, i + 4).map(t => testSorulariniAl(t)));
            }
            bekleyen.forEach(t => sorulariCiz(t));

            btn.disabled = false;

    // ---------- Olaylar (tek seferlik, delegasyonla) ----------

    // ---------- Kalem (çizim, şekil, taşıma) ----------
    // Çözüm alanı: soruların altındaki boşluk (0 = kapalı)
    const COZUM_VH = [0, 22, 45, 80];
    let cozumSeviye = lsOku('cozum');
    if (![0, 1, 2, 3].includes(cozumSeviye)) cozumSeviye = 2;
    const cozumUygula = () => document.documentElement.style.setProperty('--cozum', COZUM_VH[cozumSeviye] + 'vh');
    cozumUygula();
    const ARAC_IKON = {
        serbest: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
        cizgi: '<path d="M5 19L19 5"/>',
        kare: '<rect x="5" y="5" width="14" height="14"/>',
        dikdortgen: '<rect x="2.5" y="7" width="19" height="10"/>',
        daire: '<circle cx="12" cy="12" r="8"/>',
        ucgen: '<path d="M12 4L21 20H3z"/>',
        tasi: '<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',
        silgi: '<path d="M20 20H9l-5-5a1.5 1.5 0 010-2.1L13 4.9a1.5 1.5 0 012.1 0l5 5a1.5 1.5 0 010 2.1L12 20"/><path d="M8 11l6 6"/>'
    };
    const kalemDurum = { renk: '#e11d48', kalin: 3, silgi: false, arac: 'serbest', dolgu: false };
    const cizimler = new Map();          // tid -> { cizgiler: [], tuval, gecmis: [], sec }
    const SEKILLER = ['cizgi', 'kare', 'dikdortgen', 'daire', 'ucgen'];

    function gecmisEkle(k) { k.gecmis.push(JSON.stringify(k.cizgiler)); if (k.gecmis.length > 40) k.gecmis.shift(); k.ileri.length = 0; if (k.guncelle) k.guncelle(); }
    function sinir(z) {
        if (!z.tip || z.tip === 'serbest') {
            let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
            z.p.forEach(([x, y]) => { l = Math.min(l, x); t = Math.min(t, y); r = Math.max(r, x); b = Math.max(b, y); });
            return { l, t, r, b };
        }
        return { l: Math.min(z.x1, z.x2), t: Math.min(z.y1, z.y2), r: Math.max(z.x1, z.x2), b: Math.max(z.y1, z.y2) };
    }
    function tutamaclar(z) {
        if (!z.tip || z.tip === 'serbest') return [];
        if (z.tip === 'cizgi') return [[z.x1, z.y1], [z.x2, z.y2]];
        const b = sinir(z);
        return [[b.l, b.t], [b.r, b.t], [b.r, b.b], [b.l, b.b]];
    }
    function sekilYol(c, z) {
        const b = sinir(z);
        c.beginPath();
        if (z.tip === 'cizgi') { c.moveTo(z.x1, z.y1); c.lineTo(z.x2, z.y2); }
        else if (z.tip === 'kare' || z.tip === 'dikdortgen') c.rect(b.l, b.t, b.r - b.l, b.b - b.t);
        else if (z.tip === 'daire') c.ellipse((b.l + b.r) / 2, (b.t + b.b) / 2, Math.max(.1, (b.r - b.l) / 2), Math.max(.1, (b.b - b.t) / 2), 0, 0, Math.PI * 2);
        else if (z.tip === 'ucgen') { c.moveTo((b.l + b.r) / 2, b.t); c.lineTo(b.r, b.b); c.lineTo(b.l, b.b); c.closePath(); }
    }
    function sekilSon(z, pt) {          // sürüklenen köşeyi kurallara göre ayarla
        let x = pt[0], y = pt[1];
        if (z.tip === 'cizgi') { if (Math.abs(y - z.y1) < 6) y = z.y1; if (Math.abs(x - z.x1) < 6) x = z.x1; }   // yatay/dikey yapışma
        if (z.tip === 'kare' || z.tip === 'daire') {
            const dx = x - z.x1, dy = y - z.y1, m = Math.max(Math.abs(dx), Math.abs(dy));
            x = z.x1 + (dx < 0 ? -m : m); y = z.y1 + (dy < 0 ? -m : m);
        }
        z.x2 = x; z.y2 = y;
    }
    const segMesafe = (px, py, ax, ay, bx, by) => {
        const dx = bx - ax, dy = by - ay, u = dx || dy ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy))) : 0;
        return Math.hypot(px - (ax + u * dx), py - (ay + u * dy));
    };
    function nesneVurdu(z, [px, py]) {
        const tol = Math.max(12, (z.kalin || 3) / 2 + 8);
        if (!z.tip || z.tip === 'serbest') {
            if (z.silgi) return false;
            const p = z.p;
            if (p.length === 1) return Math.hypot(px - p[0][0], py - p[0][1]) <= tol;
            for (let i = 1; i < p.length; i++) if (segMesafe(px, py, p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]) <= tol) return true;
            return false;
        }
        if (z.tip === 'cizgi') return segMesafe(px, py, z.x1, z.y1, z.x2, z.y2) <= tol;
        const b = sinir(z);
        if (z.tip === 'daire') {
            const rx = (b.r - b.l) / 2 + tol, ry = (b.b - b.t) / 2 + tol;
            return ((px - (b.l + b.r) / 2) / rx) ** 2 + ((py - (b.t + b.b) / 2) / ry) ** 2 <= 1;
        }
        if (z.tip === 'ucgen') {
            const A = [(b.l + b.r) / 2, b.t - tol], B = [b.r + tol, b.b + tol], C = [b.l - tol, b.b + tol];
            const f = (p1, p2, p3) => (p1[0] - p3[0]) * (p2[1] - p3[1]) - (p2[0] - p3[0]) * (p1[1] - p3[1]);
            const P = [px, py], d1 = f(P, A, B), d2 = f(P, B, C), d3 = f(P, C, A);
            return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
        }
        return px >= b.l - tol && px <= b.r + tol && py >= b.t - tol && py <= b.b + tol;
    }
    function nesneBul(k, pt) {
        for (let i = k.cizgiler.length - 1; i >= 0; i--) if (nesneVurdu(k.cizgiler[i], pt)) return k.cizgiler[i];
        return null;
    }
    function nesneTasi(z, dx, dy) {
        if (!z.tip || z.tip === 'serbest') z.p.forEach(q => { q[0] += dx; q[1] += dy; });
        else { z.x1 += dx; z.x2 += dx; z.y1 += dy; z.y2 += dy; }
    }
    function panelEsitle(el) {
        const k = cizimler.get(el.dataset.testId), q = el.querySelectorAll.bind(el);
        q('[data-arac]').forEach(b => b.classList.toggle('secili', !kalemDurum.silgi && b.dataset.arac === kalemDurum.arac));
        q('[data-renk]').forEach(b => b.classList.toggle('secili', b.dataset.renk === kalemDurum.renk));
        q('[data-kalin]').forEach(b => b.classList.toggle('secili', +b.dataset.kalin === kalemDurum.kalin));
        q('[data-silgi]').forEach(b => b.classList.toggle('secili', kalemDurum.silgi));

        // Kalem butonu, seçili aracın simgesini gösterir

    function kalemTuvali(el) {
        const tid = el.dataset.testId;
        let k = cizimler.get(tid);
        if (k) return k;
        const govde = el.querySelector('.test-accordion-body');
        const tuval = document.createElement('canvas');
        tuval.className = 'kalem-tuval';
        govde.appendChild(tuval);
        k = { cizgiler: [], tuval, govde, aktif: null, gecmis: [], ileri: [], sec: null, islem: null, el };
        cizimler.set(tid, k);
        k.guncelle = () => panelEsitle(el);
        const boyutla = () => {
            const w = govde.clientWidth, h = govde.scrollHeight;
            if (!w || !h) return;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);
            while (w * dpr * h * dpr > 16e6 && dpr > 0.5) dpr -= 0.25;
            k.dpr = dpr;
            tuval.style.width = w + 'px'; tuval.style.height = h + 'px';
            tuval.width = Math.round(w * dpr); tuval.height = Math.round(h * dpr);
            kalemCiz(k);
        };
        k.boyutla = boyutla;
        new ResizeObserver(boyutla).observe(govde);
        boyutla();

        const nokta = e => { const r = tuval.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
        const panelEl = el.querySelector('[data-kalem-panel]');
        const soluk = v => panelEl.classList.toggle('soluk', v);   // çizerken panel soluklaşır
        const aktifIptal = () => {
            if (k.aktif) { const i = k.cizgiler.indexOf(k.aktif); if (i > -1) { k.cizgiler.splice(i, 1); k.gecmis.pop(); } k.aktif = null; }
            k.islem = null;
        };
        // 1 parmak = çiz/taşı, 2 parmak = kaydır (kalem/mouse her zaman çizer)
        const kaydirici = el;
        const dokunuslar = new Map();   // pointerId -> son Y
        const ortY = () => { let t = 0; dokunuslar.forEach(v => t += v); return t / dokunuslar.size; };
        tuval.addEventListener('pointerdown', e => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            e.preventDefault();
            tuval.setPointerCapture(e.pointerId);
            soluk(true);
            if (e.pointerType === 'touch') {
                dokunuslar.set(e.pointerId, e.clientY);
                if (dokunuslar.size >= 2) {            // ikinci parmak: işlemi iptal et, kaydırmaya geç
                    aktifIptal(); kalemCiz(k); k.guncelle();
                    k.sonY = ortY();
                    return;
                }
            }
            const pt = nokta(e);
            const arac = kalemDurum.silgi ? 'serbest' : kalemDurum.arac;
            if (arac === 'tasi') {
                if (k.sec) {
                    const hi = tutamaclar(k.sec).findIndex(([x, y]) => Math.hypot(x - pt[0], y - pt[1]) <= 22);
                    if (hi > -1) { k.islem = { tur: 'boyut', h: hi, bas: pt, gecmis: false }; return; }
                }
                const z = nesneBul(k, pt);
                k.sec = z;
                k.islem = z ? { tur: 'tasi', son: pt, bas: pt, gecmis: false } : null;
                k.guncelle(); kalemCiz(k);
                return;
            }
            gecmisEkle(k);
            if (arac === 'serbest') {
                k.aktif = { tip: 'serbest', renk: kalemDurum.renk, kalin: kalemDurum.silgi ? kalemDurum.kalin * 4 : kalemDurum.kalin, silgi: kalemDurum.silgi, p: [pt] };
            } else {
                k.aktif = { tip: arac, sekil: true, renk: kalemDurum.renk, kalin: kalemDurum.kalin, dolgu: kalemDurum.dolgu, x1: pt[0], y1: pt[1], x2: pt[0], y2: pt[1] };
            }
            k.sec = null; k.guncelle();
            k.cizgiler.push(k.aktif);
            kalemCiz(k);
        });
        tuval.addEventListener('pointermove', e => {
            if (dokunuslar.has(e.pointerId)) dokunuslar.set(e.pointerId, e.clientY);
            if (dokunuslar.size >= 2) {
                e.preventDefault();
                const y = ortY();
                kaydirici.scrollTop -= (y - k.sonY);
                k.sonY = y;
                return;
            }
            if (k.islem && k.sec) {
                e.preventDefault();
                const pt = nokta(e), i = k.islem, z = k.sec;
                if (!i.gecmis) {
                    if (Math.hypot(pt[0] - i.bas[0], pt[1] - i.bas[1]) < 3) return;   // sadece dokunma: geçmişe yazma
                    gecmisEkle(k); i.gecmis = true;
                }
                if (i.tur === 'tasi') { nesneTasi(z, pt[0] - i.son[0], pt[1] - i.son[1]); i.son = pt; }
                else if (z.tip === 'cizgi') { if (i.h === 0) { z.x1 = pt[0]; z.y1 = pt[1]; } else { z.x2 = pt[0]; z.y2 = pt[1]; } }
                else {
                    const b = sinir(z), kose = [[b.l, b.t], [b.r, b.t], [b.r, b.b], [b.l, b.b]], an = kose[(i.h + 2) % 4];
                    z.x1 = an[0]; z.y1 = an[1]; sekilSon(z, pt);
                }
                kalemCiz(k);
                return;
            }
            if (!k.aktif) return;
            e.preventDefault();
            if (k.aktif.sekil) { sekilSon(k.aktif, nokta(e)); }
            else (e.getCoalescedEvents ? e.getCoalescedEvents() : [e]).forEach(ev => k.aktif.p.push(nokta(ev)));
            kalemCiz(k);
        });
        const bitir = e => {
            dokunuslar.delete(e.pointerId);
            if (!dokunuslar.size) soluk(false);
            if (!dokunuslar.size && k.aktif && k.aktif.sekil) {
                const z = k.aktif, b = sinir(z);
                if (Math.hypot(b.r - b.l, b.b - b.t) < 6) aktifIptal();          // sadece dokunma: şekil oluşturma
                else { k.sec = z; kalemDurum.arac = 'tasi'; if (navigator.vibrate) navigator.vibrate(12); }                    // çizilen şekil seçilir, hemen taşınabilir
                k.aktif = null; k.guncelle(); kalemCiz(k);
            }
            if (dokunuslar.size === 1) { k.aktif = null; k.islem = null; }  // 2 parmaktan 1'e inince yanlışlıkla çizmeye başlama
            if (!dokunuslar.size) { k.aktif = null; k.islem = null; }
        };
        tuval.addEventListener('pointerup', bitir);
        tuval.addEventListener('pointercancel', bitir);
        return k;
    }
    function kalemCiz(k) {
        const c = k.tuval.getContext('2d');
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.clearRect(0, 0, k.tuval.width, k.tuval.height);
        c.setTransform(k.dpr, 0, 0, k.dpr, 0, 0);
        c.lineCap = 'round'; c.lineJoin = 'round';
        k.cizgiler.forEach(z => {
            c.globalCompositeOperation = z.silgi ? 'destination-out' : 'source-over';
            c.strokeStyle = z.silgi ? '#000' : z.renk;
            c.fillStyle = c.strokeStyle;
            c.lineWidth = z.renk.length > 7 && !z.silgi ? z.kalin * 3 : z.kalin;
            if (z.sekil) {
                sekilYol(c, z);
                if (z.dolgu && z.tip !== 'cizgi') { c.fillStyle = z.renk.length > 7 ? z.renk : z.renk + '33'; c.fill(); }
                c.lineJoin = (z.tip === 'kare' || z.tip === 'dikdortgen' || z.tip === 'ucgen') ? 'miter' : 'round';
                c.stroke(); c.lineJoin = 'round';
                return;
            }
            const p = z.p;
            if (p.length === 1) { c.beginPath(); c.arc(p[0][0], p[0][1], c.lineWidth / 2, 0, 7); c.fill(); return; }
            c.beginPath(); c.moveTo(p[0][0], p[0][1]);
            for (let i = 1; i < p.length - 1; i++) {
                c.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
            }
            c.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
            c.stroke();
        });
        c.globalCompositeOperation = 'source-over';
        if (k.sec) {                                      // seçim çerçevesi ve tutamaçlar
            const z = k.sec, b = sinir(z), m = (z.kalin || 3) / 2 + 5;
            c.save();
            c.strokeStyle = '#2563eb'; c.lineWidth = 1.5; c.setLineDash([6, 4]);
            if (z.tip !== 'cizgi') c.strokeRect(b.l - m, b.t - m, b.r - b.l + 2 * m, b.b - b.t + 2 * m);
            c.setLineDash([]); c.lineWidth = 2;
            tutamaclar(z).forEach(([x, y]) => { c.beginPath(); c.arc(x, y, 8, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill(); c.stroke(); });
            c.restore();
        }
    }
    function kalemModu(el, acik) {

        } else if (q('[data-renk]')) {

            kalemModu(el, true); panelEsitle(el);

        } else if (q('[data-nesne-sil]')) {

        } else if (q('[data-ileri]')) {
            if (k.ileri.length) { k.gecmis.push(JSON.stringify(k.cizgiler)); k.cizgiler = JSON.parse(k.ileri.pop()); k.sec = null; kalemCiz(k); panelEsitle(el); }
        } else if (q('[data-temizle]')) {

    // ---------- Neler Yaptım (günlük / haftalık / aylık özet) ----------
    // Sonuçlar bu cihazda, giriş yapan kullanıcıya özel saklanır.
    const GECMIS_MAX = 2000, GUN = 864e5;
    const gecmisAnahtar = () => 'gecmis_' + ((auth.currentUser && auth.currentUser.uid) || 'misafir');
    const gecmisOku = () => { const v = lsOku(gecmisAnahtar()); return Array.isArray(v) ? v : []; };
    function gecmisKaydet(testId, testAdi, detay) {
        const test = testById.get(testId) || {};
        const konu = konular.find(k => k.id === test.konu_id) || {};
        const say = d => detay.filter(x => x.durum === d).length;
        const l = gecmisOku();
        l.push({ t: Date.now(), test: String(testAdi || ''), konu: konu.konu_adi || 'Diğer', d: say('dogru'), y: say('yanlis'), b: say('bos') });
        lsYaz(gecmisAnahtar(), l.slice(-GECMIS_MAX));

    const gunBasi = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
    const topla = a => a.reduce((s, x) => ({ d: s.d + x.d, y: s.y + x.y, b: s.b + x.b, n: s.n + 1 }), { d: 0, y: 0, b: 0, n: 0 });
    const oran = (t) => { const T = t.d + t.y + t.b; return T ? Math.round(t.d / T * 1000) / 10 : 0; };
    const tarihYaz = ts => new Date(ts).toLocaleString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    let nelerDonem = 'hafta';

    function degerlendirme(t, onceki, konular2, gunSayisi) {
        const T = t.d + t.y + t.b, yuzde = oran(t), bosOran = T ? t.b / T * 100 : 0;
        const p = [];
        if (yuzde >= 70) p.push('Harika gidiyorsun! Başarı oranın yüksek.');
        else if (yuzde >= 50) p.push('İyi gidiyorsun; yanlışlarına göz atarak daha da yükselebilirsin.');
        else p.push('Bu dönemde başarı oranın düşük. Konu tekrarı yapıp yanlışlarını incelemende fayda var.');
        if (bosOran >= 20) p.push('Soruların %' + Math.round(bosOran) + '’ini boş bırakmışsın. Emin olmadığın sorularda da elemeyle işaretlemeyi dene.');
        if (onceki && onceki.n) {
            const fark = Math.round((yuzde - oran(onceki)) * 10) / 10;
            if (fark >= 5) p.push('Bir önceki döneme göre %' + fark + ' yükseldin, devam!');
            else if (fark <= -5) p.push('Bir önceki döneme göre %' + Math.abs(fark) + ' düştün; biraz tekrar iyi gelir.');
        }
        const zayif = konular2.filter(k => k.d + k.y + k.b >= 5).sort((a, b) => oran(a) - oran(b))[0];
        if (zayif && oran(zayif) < 60) p.push('En çok çalışman gereken konu: <b>' + esc(zayif.ad) + '</b> (%' + oran(zayif) + ').');
        const guclu = konular2.filter(k => k.d + k.y + k.b >= 5).sort((a, b) => oran(b) - oran(a))[0];
        if (guclu && oran(guclu) >= 70 && guclu !== zayif) p.push('En güçlü olduğun konu: <b>' + esc(guclu.ad) + '</b> (%' + oran(guclu) + ').');
        if (gunSayisi > 1) p.push('Bu dönemde <b>' + gunSayisi + '</b> farklı gün çalıştın.');
        return p.map(x => '<p>' + x + '</p>').join('');
    }

    function nelerCiz() {
        const bugun = gunBasi(Date.now());
        const gun = { bugun: 1, hafta: 7, ay: 30 }[nelerDonem];
        const bas = gun ? bugun - (gun - 1) * GUN : 0;
        const hepsi = gecmisOku();
        const l = hepsi.filter(x => x.t >= bas);
        const onceki = gun ? hepsi.filter(x => x.t >= bas - gun * GUN && x.t < bas) : null;
        const alan = $('nelerIcerik');
        if (!l.length) {
            alan.innerHTML = `<div class="neler-bos"><i class="fas fa-seedling"></i><p class="mb-0">${hepsi.length ? 'Bu dönemde henüz test çözmedin.' : 'Henüz çözdüğün bir test yok. Bir testi bitirdiğinde sonuçların burada görünecek.'}</p></div>`;
            return;
        }
        const t = topla(l), T = t.d + t.y + t.b, yuzde = oran(t);
        const pd = t.d / T * 100, py = pd + t.y / T * 100;
        const halka = `conic-gradient(#198754 0 ${pd}%, #dc3545 ${pd}% ${py}%, #f2c200 ${py}% 100%)`;
        const gunler = new Set(l.map(x => gunBasi(x.t))).size;

        // konu bazında
        const km = new Map();
        l.forEach(x => { const k = km.get(x.konu) || { ad: x.konu, d: 0, y: 0, b: 0 }; k.d += x.d; k.y += x.y; k.b += x.b; km.set(x.konu, k); });
        const konular2 = [...km.values()].sort((a, b) => (b.d + b.y + b.b) - (a.d + a.y + a.b));

        // gün grafiği
        let grafik = '';
        if (gun > 1) {
            const kolonlar = [];
            for (let i = gun - 1; i >= 0; i--) {
                const g = bugun - i * GUN;
                const t2 = topla(l.filter(x => gunBasi(x.t) === g));
                kolonlar.push({ g, d: t2.d, y: t2.y, b: t2.b });
            }
            const maks = Math.max(1, ...kolonlar.map(k => k.d + k.y + k.b));
            const gad = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
            grafik = `<div class="neler-baslik">Günlük soru sayısı</div><div class="neler-grafik">` + kolonlar.map((k, i) => {
                const n = k.d + k.y + k.b, h = n / maks * 78;
                const etiket = gun <= 7 ? gad[new Date(k.g).getDay()] : (i % 5 === 0 ? new Date(k.g).getDate() : '');
                return `<div class="kol" title="${new Date(k.g).toLocaleDateString('tr-TR')} · ${n} soru (D:${k.d} Y:${k.y} B:${k.b})">
                    <div class="yigin" style="height:${h}px"><i style="height:${n ? k.d / n * 100 : 0}%;background:#198754"></i><i style="height:${n ? k.y / n * 100 : 0}%;background:#dc3545"></i><i style="height:${n ? k.b / n * 100 : 0}%;background:#f2c200"></i></div>
                    <small>${etiket}</small></div>`;
            }).join('') + `</div>`;
        }

        const konuHtml = konular2.map(k => {
            const n = k.d + k.y + k.b;
            return `<div class="neler-konu"><div class="ust"><span>${esc(k.ad)}</span><span>%${oran(k)}</span></div>
                <div class="neler-cubuk"><i style="width:${oran(k)}%"></i></div>
                <div class="alt">${n} soru · ${k.d} doğru · ${k.y} yanlış · ${k.b} boş</div></div>`;
        }).join('');

        const sonHtml = l.slice().reverse().slice(0, 8).map(x =>
            `<div class="neler-son"><div><div class="ad">${esc(x.test)}</div><div class="tarih">${esc(x.konu)} · ${tarihYaz(x.t)}</div></div>
             <div class="rk"><span style="color:#198754">${x.d}D</span> <span style="color:#dc3545">${x.y}Y</span> <span style="color:#b38600">${x.b}B</span></div></div>`).join('');

        alan.innerHTML = `
            <div class="sonuc-ust">
                <div class="halka" style="background:${halka}" role="img" aria-label="Başarı yüzde ${yuzde}"><div class="halka-ic"><b>${yuzde}%</b><small>Başarı</small></div></div>
                <div class="sonuc-kutular">
                    <div class="sonuc-kutu"><span class="sayi">${t.n}</span><span class="etiket">Çözülen test</span></div>
                    <div class="sonuc-kutu"><span class="sayi">${T}</span><span class="etiket">Toplam soru</span></div>
                    <div class="sonuc-kutu k-dogru"><span class="sayi">${t.d}</span><span class="etiket"><i class="fas fa-check-circle"></i> Doğru</span></div>
                    <div class="sonuc-kutu k-yanlis"><span class="sayi">${t.y}</span><span class="etiket"><i class="fas fa-times-circle"></i> Yanlış</span></div>
                    <div class="sonuc-kutu k-bos" style="grid-column:1 / -1"><span class="sayi">${t.b}</span><span class="etiket"><i class="fas fa-minus-circle"></i> Boş</span></div>
                </div>
            </div>
            <div class="neler-deger">${degerlendirme(t, onceki, konular2, gunler)}</div>
            ${grafik}
            <div class="neler-baslik">Konulara göre</div>${konuHtml}
            <div class="neler-baslik">Son çözdüklerin</div>${sonHtml}
            <button type="button" class="neler-temizle" data-temizle>Geçmişi temizle</button>`;
    }

    $('neler').addEventListener('click', () => {
        nelerCiz();
        bootstrap.Modal.getOrCreateInstance($('nelerModal')).show();
    });
    $('nelerSek').addEventListener('click', e => {
        const b = e.target.closest('[data-donem]');
        if (!b) return;
        nelerDonem = b.dataset.donem;
        $('nelerSek').querySelectorAll('button').forEach(x => x.classList.toggle('aktif', x === b));
        nelerCiz();
    });
    $('nelerIcerik').addEventListener('click', e => {
        if (!e.target.closest('[data-temizle]')) return;
        if (confirm('Tüm çözüm geçmişin silinsin mi?')) { lsYaz(gecmisAnahtar(), []); nelerCiz(); }
    });

    // ---------- YouTube penceresi (taşınabilir, boyutlandırılabilir) ----------
    const ytEl = $('ytPencere'), ytVideo = $('ytVideo');
    const YT_MIN = 220;
    let ytDurum = lsOku('yt') || {};
    let ytW = +ytDurum.w || 320;
    let ytH = +ytDurum.h || Math.round(ytW * 9 / 16);
    const ytMaks = () => Math.min(window.innerWidth - 8, 900);
    function ytKaydet() {
        const r = ytEl.getBoundingClientRect();
        lsYaz('yt', { son: ytDurum.son || '', w: ytW, h: ytH, d: ytDoldur ? 1 : 0, x: Math.round(r.left), y: Math.round(r.top) });
    }
    function ytSinirla() {                                   // pencere her zaman ekranın içinde kalsın
        ytW = Math.max(YT_MIN, Math.min(ytW, ytMaks()));
        ytEl.style.width = ytW + 'px';
        ytH = Math.max(120, Math.min(ytH, window.innerHeight - 170));
        ytVideo.style.height = ytH + 'px';
        ytCerceve();
        ytVideo.style.height = ytH + 'px';
        cizimYenile();
        const w = ytEl.offsetWidth, h = ytEl.offsetHeight;
        let x = parseFloat(ytEl.style.left), y = parseFloat(ytEl.style.top);
        if (isNaN(x)) x = window.innerWidth - w - 8;
        if (isNaN(y)) y = 72;
        ytEl.style.left = Math.max(0, Math.min(x, window.innerWidth - w)) + 'px';
        ytEl.style.top = Math.max(0, Math.min(y, Math.max(0, window.innerHeight - h))) + 'px';
    }
    // Doldur: video 16:9 olduğu için kutuyu kaplayacak şekilde büyütülüp ortalanır, siyah kenar kalmaz (taşan kısım kırpılır).
    // Sığdır: videonun tamamı görünür, gerekirse siyah kenar olur.
    let ytDoldur = ytDurum.d !== 0;
    function ytCerceve() {
        const f = ytVideo.querySelector('iframe');
        if (!f) return;
        const W = ytEl.clientWidth, H = ytH;
        if (ytDoldur && W && H) {
            const iw = Math.ceil(Math.max(W, H * 16 / 9)), ih = Math.ceil(iw * 9 / 16);
            Object.assign(f.style, { inset: 'auto', left: '50%', top: '50%', width: iw + 'px', height: ih + 'px', transform: 'translate(-50%,-50%)' });
        } else {
            Object.assign(f.style, { inset: '0', left: '', top: '', width: '100%', height: '100%', transform: '' });
        }
        const b = $('ytDoldurBtn');
        if (b) b.textContent = ytDoldur ? 'Sığdır' : 'Doldur';
    }
    function ytBos(mesaj, hata) {
        ytVideo.innerHTML = `<div class="yt-bos${hata ? ' hata' : ''}">${esc(mesaj)}</div>`;
    }
    function ytYukle(v) {
        const q = new URLSearchParams({ rel: '0', playsinline: '1', autoplay: '1', enablejsapi: '1' });
        if (v.bas) q.set('start', v.bas);
        let url;
        if (v.vid) { if (v.liste) q.set('list', v.liste); url = 'https://www.youtube-nocookie.com/embed/' + v.vid + '?' + q; }
        else if (v.liste) { q.set('list', v.liste); url = 'https://www.youtube-nocookie.com/embed/videoseries?' + q; }
        else { ytBos('Bu video oynatılamıyor.', true); return; }
        ytVideo.innerHTML = '';
        const f = document.createElement('iframe');
        f.src = url;
        f.title = 'Video oynatıcı';
        f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        f.allowFullscreen = true;
        f.referrerPolicy = 'strict-origin-when-cross-origin';
        ytVideo.appendChild(f);
        ytCerceve();
    }
    function ytAc(v) {
        kalemKapat(true);
        $('ytBaslikMetin').textContent = v.baslik || 'Video';
        if (ytEl.hidden) {
            ytEl.hidden = false;
            if (ytDurum.x != null) { ytEl.style.left = ytDurum.x + 'px'; ytEl.style.top = ytDurum.y + 'px'; }
            ytEl.style.width = ytW + 'px';
        }
        ytYukle(v);
        ytSinirla();
    }
    function ytKapat() {
        kalemKapat(true);
        ytKaydet();
        ytEl.hidden = true;
        ytVideo.innerHTML = '';                              // video durur
    }
    ytEl.addEventListener('click', e => {
        const b = e.target.closest('[data-yt],[data-renk]');
        if (!b) return;
        const a = b.dataset.yt;
        if (b.dataset.renk) { kRenk = b.dataset.renk; ytEl.querySelectorAll('.renk').forEach(x => x.classList.toggle('sec', x === b)); return; }
        if (a === 'kapat') ytKapat();
        else if (a === 'kalem') kalemAc();
        else if (a === 'doldur') { ytDoldur = !ytDoldur; ytCerceve(); ytKaydet(); }
        else if (a === 'bitti') kalemKapat(true);
        else if (a === 'geri') { kCizgiler.pop(); cizimYenile(); }
        else if (a === 'temizle') { kCizgiler = []; cizimYenile(); }
        else if (a === 'kalin') { kKalin = kKalin === 3 ? 7 : 3; $('ytKalin').textContent = kKalin === 3 ? 'İnce' : 'Kalın'; }
        else if (a === 'buyut' || a === 'kucult') { const k = a === 'buyut' ? 1.2 : 1 / 1.2; ytW *= k; ytH *= k; ytSinirla(); ytKaydet(); }
    });

    // Başlıktan tutup taşı
    (function () {
        const ust = $('ytUst');
        let bas = null;
        ust.addEventListener('pointerdown', e => {
            if (e.target.closest('button')) return;
            const r = ytEl.getBoundingClientRect();
            bas = { dx: e.clientX - r.left, dy: e.clientY - r.top };
            ust.setPointerCapture(e.pointerId);
            ytEl.classList.add('surukle');
        });
        ust.addEventListener('pointermove', e => {
            if (!bas) return;
            ytEl.style.left = (e.clientX - bas.dx) + 'px';
            ytEl.style.top = (e.clientY - bas.dy) + 'px';
            ytSinirla();
        });
        const son = () => { if (!bas) return; bas = null; ytEl.classList.remove('surukle'); ytKaydet(); };
        ust.addEventListener('pointerup', son);
        ust.addEventListener('pointercancel', son);
    })();
    // Sağ alt köşeden sürükleyerek boyutlandır
    (function () {
        const tutac = $('ytTutac');
        let bas = null;
        tutac.addEventListener('pointerdown', e => {
            bas = { x: e.clientX, y: e.clientY, w: ytEl.offsetWidth, h: ytVideo.offsetHeight };
            tutac.setPointerCapture(e.pointerId);
            ytEl.classList.add('surukle');
            e.preventDefault();
        });
        tutac.addEventListener('pointermove', e => {
            if (!bas) return;
            ytW = bas.w + (e.clientX - bas.x);
            ytH = bas.h + (e.clientY - bas.y);
            ytSinirla();
        });
        const son = () => { if (!bas) return; bas = null; ytEl.classList.remove('surukle'); ytKaydet(); };
        tutac.addEventListener('pointerup', son);
        tutac.addEventListener('pointercancel', son);
    })();
    // ---------- Kalem: videoyu durdurur, üzerine çizim yapılır ----------
    const cizimEl = $('ytCizim'), cizimCtx = cizimEl.getContext('2d');
    let kCizgiler = [], kAktif = null, kRenk = '#ef4444', kKalin = 3;
    function cizimYenile() {
        if (cizimEl.hidden) return;
        const r = ytVideo.getBoundingClientRect(), d = window.devicePixelRatio || 1;
        if (!r.width) return;
        cizimEl.width = Math.round(r.width * d); cizimEl.height = Math.round(r.height * d);
        cizimCtx.setTransform(d, 0, 0, d, 0, 0);
        cizimCtx.lineCap = cizimCtx.lineJoin = 'round';
        kCizgiler.forEach(c => {
            cizimCtx.strokeStyle = c.r; cizimCtx.lineWidth = c.k;
            cizimCtx.beginPath();
            c.n.forEach((n, i) => { const x = n[0] * r.width, y = n[1] * r.height; i ? cizimCtx.lineTo(x, y) : cizimCtx.moveTo(x, y); });
            if (c.n.length === 1) cizimCtx.lineTo(c.n[0][0] * r.width + .1, c.n[0][1] * r.height);
            cizimCtx.stroke();
        });
    }
    function kalemAc() {
        if (!cizimEl.hidden) { kalemKapat(false); return; }
        const f = ytVideo.querySelector('iframe');          // videoyu durdur
        try { f && f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }), '*'); } catch (err) {}
        cizimEl.hidden = false; $('ytKalem').hidden = false; $('ytKalemBtn').classList.add('acik');
        ytSinirla(); cizimYenile();
    }
    function kalemKapat(temizle) {
        cizimEl.hidden = true; $('ytKalem').hidden = true; $('ytKalemBtn').classList.remove('acik');
        if (temizle) { kCizgiler = []; kAktif = null; }
        ytSinirla();
    }
    const kNokta = e => { const r = cizimEl.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
    cizimEl.addEventListener('pointerdown', e => {
        cizimEl.setPointerCapture(e.pointerId);
        kAktif = { r: kRenk, k: kKalin, n: [kNokta(e)] };
        kCizgiler.push(kAktif); cizimYenile(); e.preventDefault();
    });
    cizimEl.addEventListener('pointermove', e => { if (!kAktif) return; kAktif.n.push(kNokta(e)); cizimYenile(); });
    const kBitir = () => { kAktif = null; };
    cizimEl.addEventListener('pointerup', kBitir);
    cizimEl.addEventListener('pointercancel', kBitir);

    window.addEventListener('resize', () => { if (!ytEl.hidden) ytSinirla(); });

    // ---------- Video çekmeceleri: (ders ›) öğretmen › konu › video düğmeleri ----------
    // Öğrenci bağlantıyı görmez; yalnızca çekmeceleri ve video adlarını görür.
    let vdListe = [], vdMap = new Map();
    const vdAcik = new Set();
    async function vdYukle() {
        let v = null;
        if (navigator.onLine) {
            try { v = liste(await sure(get(ref(db, 'sb/videolar')), 8000)); depoYaz('videolar', v); } catch (err) { console.error(err); }
        }
        if (!v) { const o = await depoOku('videolar'); v = Array.isArray(o) ? o : null; }
        if (!v) throw new Error('video yok');
        const dersId = new URLSearchParams(location.search).get('ders');
        vdListe = v.filter(x => !dersId || String(x.ders_id) === dersId).sort((a, b) => ((a.sira || 0) - (b.sira || 0)) || (zaman(a) - zaman(b)));
        vdMap = new Map(vdListe.map(x => [x.id, x]));
    }
    const vdGrupla = (arr, f) => { const m = new Map(); arr.forEach(x => { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; };
    function vdOgretmenler(arr, onek) {
        let h = '';
        vdGrupla(arr, x => x.ogretmen || '—').forEach((ov, og) => {
            const k1 = onek + '|' + og;
            h += `<details class="vd-dal vd-og" data-k="${esc(k1)}"${vdAcik.has(k1) ? ' open' : ''}><summary><i class="fas fa-chevron-right vd-ok"></i><span class="vd-ad">${esc(og)}</span><span class="vd-say">${ov.length}</span></summary><div class="vd-ic">`;
            vdGrupla(ov, x => x.konu || '—').forEach((kv, kn) => {
                const k2 = k1 + '|' + kn;
                h += `<details class="vd-dal" data-k="${esc(k2)}"${vdAcik.has(k2) ? ' open' : ''}><summary><i class="fas fa-chevron-right vd-ok"></i><span class="vd-ad">${esc(kn)}</span><span class="vd-say">${kv.length}</span></summary><div class="vd-ic">`;
                kv.forEach(x => { h += `<button type="button" class="vd-btn" data-vid="${esc(x.id)}"><span class="vd-oynat"><i class="fas fa-play"></i></span><span>${esc(x.baslik)}</span></button>`; });
                h += '</div></details>';
            });
            h += '</div></details>';
        });
        return h;
    }
    function vdCiz() {
        const g = $('vdGovde');
        if (!vdListe.length) { g.innerHTML = '<div class="vd-bos"><i class="fab fa-youtube fa-2x mb-2 d-block"></i>Henüz video eklenmemiş.</div>'; return; }
        if (new URLSearchParams(location.search).get('ders')) { g.innerHTML = vdOgretmenler(vdListe, 'o'); return; }
        let h = '';
        vdGrupla(vdListe, x => x.ders_adi || 'Diğer').forEach((dv, ders) => {
            const k = 'd:' + ders;
            h += `<details class="vd-dal vd-ders" data-k="${esc(k)}"${vdAcik.has(k) ? ' open' : ''}><summary><i class="fas fa-chevron-right vd-ok"></i><span class="vd-ad">${esc(ders)}</span><span class="vd-say">${dv.length}</span></summary><div class="vd-ic">${vdOgretmenler(dv, k)}</div></details>`;
        });
        g.innerHTML = h;
    }
    async function vdAc() {
        $('vdPanel').hidden = false;
        $('vdGovde').innerHTML = SPINNER_KUCUK.replace('Sorular yükleniyor...', 'Videolar yükleniyor...');
        try { await vdYukle(); vdCiz(); }
        catch (err) { $('vdGovde').innerHTML = '<div class="vd-bos">Videolar yüklenemedi. İnternet bağlantını kontrol edip tekrar dene.</div>'; }
    }
    $('yt').addEventListener('click', vdAc);
    $('vdKapat').addEventListener('click', () => { $('vdPanel').hidden = true; });
    $('vdPanel').addEventListener('click', e => { if (e.target === $('vdPanel')) $('vdPanel').hidden = true; });
    $('vdGovde').addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.k; if (k) e.target.open ? vdAcik.add(k) : vdAcik.delete(k); }, true);
    $('vdGovde').addEventListener('click', e => {
        const b = e.target.closest('[data-vid]');
        const v = b && vdMap.get(b.dataset.vid);
        if (!v) return;
        $('vdPanel').hidden = true;
        ytAc(v);
    });

    // ---------- Koyu / açık tema ----------
    $('tema').addEventListener('click', () => {
        const koyu = document.documentElement.dataset.tema !== 'dark';
        if (koyu) document.documentElement.dataset.tema = 'dark'; else delete document.documentElement.dataset.tema;
        try { localStorage.setItem('og-tema', koyu ? 'dark' : 'light'); } catch (err) {}
    });

    baslat();
</script>
</body>
</html>
