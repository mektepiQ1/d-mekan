*,*::before,*::after{box-sizing:border-box}

/* Akordeon: konu.html ile aynı görünüm */

.accordion-button:hover{background:var(--navy-50)!important}
.accordion-button:focus-visible{outline:2px solid var(--navy-600);outline-offset:-2px}
.accordion-button::after{content:"";background-image:none!important;flex:none;width:9px;height:9px;margin:0 4px 3px auto;border-right:2px solid var(--navy-600);border-bottom:2px solid var(--navy-600);transform:rotate(45deg)!important;transition:transform var(--t)}
.accordion-button:not(.collapsed)::after{transform:rotate(225deg)!important}
.accordion-body{background:#fff;padding:12px;border-top:1px solid var(--navy-100);width:100%}
.konu-arama-kapsayici{padding:0 0 12px;background:transparent;margin:0}

.tam-ust{display:none}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAtqtkB4mYY7t1HCM3umVLxRC2un30_-fQ",
        authDomain: "ogrenciveyonetim.firebaseapp.com",
        projectId: "ogrenciveyonetim",
        storageBucket: "ogrenciveyonetim.firebasestorage.app",
        messagingSenderId: "660345359561",
        appId: "1:660345359561:web:5c74d90d8624c8e4c75118",
        measurementId: "G-C7TN0GBJL3",
        databaseURL: "https://ogrenciveyonetim-default-rtdb.firebaseio.com"
    };
    const app = initializeApp(firebaseConfig);

    /* ====================================================================
       APP CHECK (reCAPTCHA v3) - İSTEĞE BAĞLI, ŞİMDİLİK KAPALI
       Etkinleştirmek için:
         1) Firebase Konsolu > Build > App Check > Apps > Web uygulamanı kaydet,
            sağlayıcı olarak "reCAPTCHA v3" seç, verilen SITE KEY'i aşağıya yaz.
         2) Aşağıdaki iki satırın yorumunu kaldır (initializeApp'ten SONRA,
            getDatabase'den ÖNCE kalmalı).
         3) Siteyi yayınla, birkaç gün App Check > APIs > Realtime Database
            ekranında "doğrulanmış istek" oranını izle.
         4) Oran ~%100 olunca aynı ekrandan "Enforce" (Zorunlu kıl) de.
         Yerel geliştirmede (localhost): tarayıcı konsolunda
         self.FIREBASE_APPCHECK_DEBUG_TOKEN = true; yazıp çıkan jetonu
         Konsol > App Check > Apps > Debug tokens bölümüne ekle.
       ==================================================================== */
    // import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app-check.js";
    // initializeAppCheck(app, { provider: new ReCaptchaV3Provider('BURAYA_SITE_KEY'), isTokenAutoRefreshEnabled: true });

    const db = getDatabase(app);
    const auth = getAuth(app);
    const girisBekle = () => new Promise(res => { const off = onAuthStateChanged(auth, x => { off(); res(x); }); });

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const $ = id => document.getElementById(id);
    const zaman = x => x.olusturma || 0;

    // ---------- localStorage (kota/erişim hatalarına karşı korumalı) ----------
    // Önbellek anahtarı veritabanına özel: aynı alan adındaki farklı sınıf sayfaları birbirinin önbelleğini ezmesin
    const LS = 'sb2_' + String(firebaseConfig.projectId || '').replace(/[^\w-]/g, '') + '_';
    function lsOku(anahtar) {
        try {
            const ham = localStorage.getItem(LS + anahtar);
            return ham ? JSON.parse(ham) : null;
        } catch (err) { return null; }
    }
    function lsYaz(anahtar, deger) {
        let metin;
        try { metin = JSON.stringify(deger); } catch (err) { return false; }
        try {
            localStorage.setItem(LS + anahtar, metin);
            return true;
        } catch (err) {
            // Kota doluysa soru önbelleklerini temizleyip bir kez daha dene
            try {
                Object.keys(localStorage)
                    .filter(a => a.startsWith(LS + 't_'))
                    .forEach(a => localStorage.removeItem(a));
                localStorage.setItem(LS + anahtar, metin);
                return true;
            } catch (err2) { return false; }
        }
    }

    // ---------- Önbellek: IndexedDB (büyük kapasite); olmazsa localStorage'a düşer ----------
    // Eski localStorage önbellekleri okunmaya devam eder (yeniden indirme gerekmez); sürüm kontrolü çağıranda yapılır.
    const IDB_AD = 'sb2-onbellek', IDB_DEPO = 'kv';
    let idbSoz = null;
    const idbAc = () => idbSoz || (idbSoz = new Promise((res, rej) => {
        if (!('indexedDB' in window)) return rej(new Error('idb yok'));
        const r = indexedDB.open(IDB_AD, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(IDB_DEPO);
        r.onsuccess = () => res(r.result);
        r.onerror = r.onblocked = () => { idbSoz = null; rej(r.error || new Error('idb')); };
    }));
    const idbIs = (mod, fn) => idbAc().then(d => new Promise((res, rej) => {
        const t = d.transaction(IDB_DEPO, mod), q = fn(t.objectStore(IDB_DEPO));
        t.oncomplete = () => res(q && q.result);
        t.onerror = t.onabort = () => rej(t.error || new Error('idb'));
    }));
    async function depoOku(anahtar) {
        try { const v = await idbIs('readonly', s => s.get(LS + anahtar)); if (v != null) return v; } catch (err) {}
        return lsOku(anahtar);
    }
    async function depoYaz(anahtar, deger) {
        try {
            await idbIs('readwrite', s => s.put(deger, LS + anahtar));
            try { localStorage.removeItem(LS + anahtar); } catch (err) {}   // eski kopya yer kaplamasın
            return true;
        } catch (err) { return lsYaz(anahtar, deger); }
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (err) {}

    // ---------- Bellekteki durum ----------
    let surum = 0;                       // meta/guncelleme değeri
    let konular = [], testler = [];
    let testlerByKonu = new Map();       // konuId -> [test]
    let testById = new Map();            // testId -> test
    const sorularByTest = new Map();     // testId -> [soru] (sira'ya göre)
    const aramaIndeks = new Map();       // testId -> [{id, metin}]
    const yukleniyor = new Map();        // testId -> Promise (aynı anda tekrar indirmeyi önler)
    const kartEl = new Map();            // soruId -> DOM elemanı
    const aramaDurumu = new Map();       // konuId -> son arama metni
    const aramaZamanlayici = new Map();  // konuId -> debounce zamanlayıcısı

    const SPINNER_BUYUK = `
        <div class="bos-mesaj">
            <div class="spinner-border" style="color:#1e2b5c" role="status"></div>
            <p class="mt-3 mb-0">Sorular yükleniyor...</p>
        </div>`;
    const SPINNER_KUCUK = `
        <div class="text-center p-4 text-muted">
            <div class="spinner-border spinner-border-sm me-2" style="color:#1e2b5c" role="status"></div>
            <span>Sorular yükleniyor...</span>
        </div>`;

    function hataMetni(err) {
        const kod = String((err && (err.code || err.message)) || '');
        if (/permission/i.test(kod)) return 'Verilere erişim izni verilmedi. Lütfen daha sonra tekrar deneyin.';
        if (/network|offline|unavailable|baglanti|timeout/i.test(kod)) return 'İnternet bağlantısı kurulamadı. Bağlantınızı kontrol edip tekrar deneyin.';
        return 'Beklenmeyen bir sorun oluştu. Lütfen tekrar deneyin.';
    }

    // ---------- Konular ve testler (önbellekli) ----------
    const liste = snap => Object.entries(snap.val() || {}).map(([id, v]) => ({ id, ...v }));

    // Firebase get() internet yokken beklemede kalabilir; süre aşımı ile önbelleğe düşülür
    const sure = (p, ms = 7000) => Promise.race([p, new Promise((_, j) => setTimeout(() => j(new Error('zaman')), ms))]);

    const katalogGecerli = o => o && Array.isArray(o.konular) && Array.isArray(o.testler);

    // Önbellekten anında yükler (ağ beklemez). Önbellek yoksa false döner.
    async function katalogOnbellektenYukle() {
        const o = await depoOku('katalog');
        if (!katalogGecerli(o)) return false;
        surum = o.v || 0; konular = o.konular; testler = o.testler;
        return true;
    }

    // Ağdan sürümü kontrol eder; değiştiyse indirir. true = katalog değişti, false = aynı/çevrimdışı.
    async function katalogGuncelle() {
        if (!navigator.onLine) return false;
        let uzak = 0;
        try {
            const s = await sure(get(ref(db, 'sb/meta/guncelleme')));
            uzak = Number(s.val()) || 0;
        } catch (err) { console.error(err); return false; }
        if (uzak > 0 && uzak === surum) return false;
        try {
            const [k, t] = await sure(Promise.all([get(ref(db, 'sb/konular')), get(ref(db, 'sb/testler'))]), 20000);
            konular = liste(k).sort((a, b) => zaman(a) - zaman(b));
            testler = liste(t).sort((a, b) => zaman(a) - zaman(b));
            surum = uzak;
            depoYaz('katalog', { v: surum, konular, testler });
            return true;
        } catch (err) { console.error(err); return false; }
    }

    // Map ile gruplama (iç içe filter/some yok)
    function indeksle() {
        testlerByKonu = new Map();
        testById = new Map();
        testler.forEach(t => {
            testById.set(t.id, t);
            if (!testlerByKonu.has(t.konu_id)) testlerByKonu.set(t.konu_id, []);
            testlerByKonu.get(t.konu_id).push(t);
        });
    }
    // soru_sayisi kaydı yoksa (taşıma öncesi) test gösterilir; 0 ise gizlenir
    const gorunur = t => !Number.isFinite(t.soru_sayisi) || t.soru_sayisi > 0;
    const testSurumu = t => t.guncelleme || surum;

    // ---------- Bir testin soruları (lazy load + önbellek) ----------
    function aramaIndeksiKur(testId, sorular) {
        aramaIndeks.set(testId, sorular.map(s => ({
            id: s.id,
            metin: [s.soru_metni, s.cevap_a, s.cevap_b, s.cevap_c, s.cevap_d, s.cevap_e].join(' ').toLowerCase()
        })));
    }

    function testSorulariniAl(test) {
        const id = test.id;
        if (sorularByTest.has(id)) return Promise.resolve(sorularByTest.get(id));
        if (yukleniyor.has(id)) return yukleniyor.get(id);

        const p = (async () => {
            const v = testSurumu(test);
            const onb = await depoOku('t_' + id);
            let sorular;
            const var_ = onb && Array.isArray(onb.sorular);
            if (var_ && (!navigator.onLine || (v > 0 && onb.v === v))) {
                sorular = onb.sorular;
            } else {
                try {
                    const snap = await sure(get(ref(db, 'sb/sorular/' + id)), 20000);
                    sorular = liste(snap).sort((a, b) => ((a.sira || 0) - (b.sira || 0)) || (zaman(a) - zaman(b)));
                    depoYaz('t_' + id, { v, sorular });
                } catch (e) {
                    if (!var_) throw e;           // bağlantı yok: eldeki kopya
                    sorular = onb.sorular;
                }
            }
            sorularByTest.set(id, sorular);
            aramaIndeksiKur(id, sorular);
            return sorular;
        })();

        yukleniyor.set(id, p);
        const temizle = () => yukleniyor.delete(id);
        p.then(temizle, temizle);
        return p;
    }

    // ---------- Çizim ----------
    function bosMesaj(ikon, baslik, altYazi = '') {
        return `
            <div class="bos-mesaj">
                <i class="fas ${ikon}"></i>
                <p>${baslik}</p>
                ${altYazi ? `<small class="text-muted">${altYazi}</small>` : ''}
            </div>`;
    }

    let hepsiAcik = false;
    function katalogCiz(bilgiHtml = '') {
        const container = $('sinavIcerik');

        const gecerli = [];
        konular.forEach(k => {
            const tl = (testlerByKonu.get(k.id) || []).filter(gorunur);
            if (tl.length) gecerli.push({ konu: k, testler: tl });
        });

        if (gecerli.length === 0) {
            container.innerHTML = bilgiHtml + bosMesaj('fa-inbox', 'Henüz hiç soru eklenmemiş.');
            $('istatistik').textContent = ''; $('hepsi').hidden = true;
            return;
        }

        let html = bilgiHtml + '<div class="accordion" id="konuAccordion">';
        gecerli.forEach(({ konu, testler: konuTestleri }, idx) => {
            const kid = esc(konu.id);
            html += `
            <div class="accordion-item" data-kid="${kid}">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseKonu${kid}">
                        <span class="emo">📖</span><span>${esc(konu.konu_adi)}</span>
                        <span class="konu-badge">${konuTestleri.length} test</span>
                    </button>
                </h2>
                <div id="collapseKonu${kid}" class="accordion-collapse collapse">
                    <div class="accordion-body">
                        <div class="konu-arama-kapsayici">
                            <input type="text" class="form-control konu-arama" data-konu-id="${kid}" placeholder="🔍 Bu konu altındaki sorular içinde ara...">
                            <div class="mt-2" id="aramaBilgi_${kid}"></div>
                        </div>
                        <div class="accordion" id="testAccordion_${kid}">`;

            konuTestleri.forEach(test => {
                const tid = esc(test.id);
                const sayiMetni = Number.isFinite(test.soru_sayisi) ? `${test.soru_sayisi} soru` : 'soru';
                html += `
                <div class="test-accordion-item" id="testItem_${tid}" data-tid="${tid}">
                    <h2 class="accordion-header">
                        <button class="accordion-button test-accordion-button collapsed" type="button" data-test-ac="${tid}">
                            <span class="emo">📝</span><span>${esc(test.test_adi)}</span>
                            <span class="test-badge">${sayiMetni}</span>
                        </button>
                    </h2>
                    <div id="collapseTest${tid}" class="test-collapse" data-test-id="${tid}" role="dialog" aria-label="${esc(test.test_adi)}">
                        <div class="tam-ust">
                            <button type="button" class="tam-kapat" data-test-kapat><i class="fas fa-xmark"></i> Kapat</button>
                            <div class="tam-baslik">${esc(test.test_adi)}</div>
                        </div>
                        <div class="test-accordion-body">
                            <form class="test-formu" data-test-id="${tid}" data-test-adi="${esc(test.test_adi)}">
                                <div class="sorular-alani" id="sorularAlani_${tid}">
                                    <div class="p-3 text-muted small">Soruları görmek için testi açın.</div>
                                </div>
                                <button type="submit" class="sinav-bitir-btn" style="display:none">
                                    <i class="fas fa-flag-checkered"></i> Bu Testi Bitir
                                </button>
                            </form>
                        </div>
                    </div>
                </div>`;
            });

            html += `</div></div></div></div>`;
        });
        html += `</div>`;
        container.innerHTML = html;
        $('istatistik').textContent = `${gecerli.length} konu · ${gecerli.reduce((a, g) => a + g.testler.length, 0)} test`;
        $('hepsi').hidden = false; $('hepsi').textContent = 'Tümünü Aç'; hepsiAcik = false;
        if ($('ara').value.trim()) filtrele();
    }


    // Soru metnini okunaklı paragraflara böler (Türkçe, matematik, coğrafya, tarih, vatandaşlık...):
    //  1) "(Cevap: X)" ifadesi gizlenir.
    //  2) Metinde boş satır varsa aynen paragraflara ayrılır.
    //  3) Boş satır yoksa: I. II. III. öncülleri ayrı satıra alınır, son cümle soru kökü ise ayrı kalın paragraf olur.
    function soruMetniHtml(ham) {
        let t = String(ham ?? '').replace(/\r\n?/g, '\n')
            .replace(/\s*\(?\s*Cevap\s*:\s*[A-Ea-e]\s*\)?\s*$/i, '').trim();
        if (!/\n\s*\n/.test(t)) {
            // Öncüller (I. II. III. ...) her biri yeni satırda
            if (/(^|\s)I\.\s/.test(t) && /\sII\.\s/.test(t))
                t = t.replace(/\s+((?:VIII|VII|VI|IV|V|III|II|I)\.\s+(?=\S))/g, '\n$1');
            // Son cümle soru kökü mü?
            const KOK = /(\?|hangisi|hangileri|aşağıdaki|yukarıdaki|kaçtır|nedir|söylenemez|çıkarılamaz|söylenebilir)/i;
            const re = /[.!?…:][”"»’')]?\s+/g;
            let m, kes = -1;
            while ((m = re.exec(t))) {
                const onceki = t[m.index - 1] || '';
                const sonraki = t[m.index + m[0].length] || '';
                if (/[a-zçğıöşüâîû0-9”"»)’']/.test(onceki) && /[A-ZÇĞİÖŞÜ0-9"“(]/.test(sonraki)) kes = m.index + m[0].length;
            }
            if (kes > 0) {
                const bas = t.slice(0, kes).trimEnd(), kok = t.slice(kes);
                if (/[?.:]$/.test(kok) && KOK.test(kok) && !/^(I|II|III|IV|V)\.\s/.test(kok)) t = bas + '\n\n' + kok;
            }
        }
        const par = t.split(/\n\s*\n/);
        return par.map((p, i) =>
            `<p class="sm-p${i === par.length - 1 && par.length > 1 ? ' sm-kok' : ''}">${esc(p.trim()).replace(/\n/g, '<br>')}</p>`).join('');
    }

    function kartHtml(soru, sIdx) {
        const sid = esc(soru.id);
        return `
        <div class="soru-karti" data-sid="${sid}">
            <div class="soru-numarasi">Soru ${sIdx + 1}</div>
            <div class="soru-metni">${soruMetniHtml(soru.soru_metni)}</div>
            ${['a', 'b', 'c', 'd', 'e'].map(h => `
            <div class="cevap-option"><input type="radio" name="cevap_${sid}" value="${h.toUpperCase()}" id="s_${sid}_${h}"><label for="s_${sid}_${h}"><strong>${h.toUpperCase()})</strong> ${esc(soru['cevap_' + h])}</label></div>`).join('')}
        </div>`;
    }

    function sorulariCiz(test) {
        const sorular = sorularByTest.get(test.id) || [];
        const alan = $('sorularAlani_' + test.id);
        if (!alan) return;
        const form = alan.closest('form');
        const btn = form ? form.querySelector('.sinav-bitir-btn') : null;

        if (!sorular.length) {
            alan.innerHTML = '<div class="p-3 text-muted">Bu testte soru bulunamadı.</div>';
            if (btn) btn.style.display = 'none';
            return;
        }
        alan.innerHTML = sorular.map((s, i) => kartHtml(s, i)).join('');
        alan.querySelectorAll('.soru-karti').forEach(el => kartEl.set(el.dataset.sid, el));
        if (btn) btn.style.display = '';
    }

    function testHatasiCiz(testId, err) {
        const alan = $('sorularAlani_' + testId);
        if (!alan) return;
        alan.innerHTML = `
            <div class="text-center p-4">
                <p class="mb-2 text-danger"><i class="fas fa-triangle-exclamation me-1"></i> Sorular yüklenemedi.</p>
                <p class="small text-muted mb-3">${esc(hataMetni(err))}</p>
                <button type="button" class="btn-tekrar-dene" data-tekrar="test" data-test-id="${esc(testId)}"><i class="fas fa-redo-alt"></i> Tekrar dene</button>
            </div>`;
    }

    // Test akordeonu ilk kez açılınca soruları yükle
    async function testiAc(testId) {
        const test = testById.get(testId);
        if (!test) return;
        const alan = $('sorularAlani_' + testId);
        if (!alan) return;

        if (sorularByTest.has(testId)) {
            if (!alan.querySelector('.soru-karti') && (sorularByTest.get(testId) || []).length) sorulariCiz(test);
            return;
        }
        alan.innerHTML = SPINNER_KUCUK;
        try {
            await testSorulariniAl(test);
            sorulariCiz(test);
            const q = aramaDurumu.get(test.konu_id);
            if (q) aramaYap(test.konu_id, q);
        } catch (err) {
            console.error(err);
            testHatasiCiz(testId, err);
        }
    }

    // ---------- Arama (bellekteki diziden, debounce'lu) ----------
    function aramaYap(konuId, ham) {
        const q = String(ham || '').toLowerCase().trim();
        aramaDurumu.set(konuId, q);
        const konuTestleri = (testlerByKonu.get(konuId) || []).filter(gorunur);
        let acilmamis = 0;

        konuTestleri.forEach(t => {
            const item = $('testItem_' + t.id);
            if (!item) return;
            const idx = aramaIndeks.get(t.id);

            if (!q) {
                item.style.display = '';
                if (idx) idx.forEach(x => { const el = kartEl.get(x.id); if (el) el.style.display = ''; });
                return;
            }
            if (!idx) {            // henüz yüklenmemiş test: aramaya dahil değil
                acilmamis++;
                item.style.display = 'none';
                return;
            }
            let eslesme = false;
            idx.forEach(x => {
                const var_ = x.metin.includes(q);
                const el = kartEl.get(x.id);
                if (el) el.style.display = var_ ? 'block' : 'none';
                if (var_) eslesme = true;
            });
            item.style.display = eslesme ? '' : 'none';
        });

        const bilgi = $('aramaBilgi_' + konuId);
        if (bilgi) {
            bilgi.innerHTML = (q && acilmamis)
                ? `<small class="text-muted d-block mb-2">Arama yalnızca daha önce açılmış testlerde yapıldı.</small>
                   <button type="button" class="btn btn-sm btn-outline-primary" data-aramayukle="${esc(konuId)}">Diğer ${acilmamis} testi de yükle ve ara</button>`
                : '';
        }
    }

    async function konuTestleriniYukle(konuId, btn) {
        const bekleyen = (testlerByKonu.get(konuId) || []).filter(t => gorunur(t) && !sorularByTest.has(t.id));
        btn.disabled = true;
        btn.textContent = 'Yükleniyor...';
        try {
            // en fazla 4 istek aynı anda
            for (let i = 0; i < bekleyen.length; i += 4) {
                await Promise.all(bekleyen.slice(i, i + 4).map(t => testSorulariniAl(t)));
            }
            bekleyen.forEach(t => sorulariCiz(t));
            aramaYap(konuId, aramaDurumu.get(konuId) || '');
        } catch (err) {
            console.error(err);
            btn.disabled = false;
            btn.textContent = 'Yüklenemedi, tekrar dene';
        }
    }

    // ---------- Test bitirme ----------
    const HARFLER = ['A', 'B', 'C', 'D', 'E'];
    const DURUM = {
        dogru:  { ad: 'Doğru',  ikon: 'fa-check-circle' },
        yanlis: { ad: 'Yanlış', ikon: 'fa-times-circle' },
        bos:    { ad: 'Boş',    ikon: 'fa-minus-circle' }
    };

    function sonucSoruHtml(d) {
        const { soru, i, verilen, durum } = d;
        const dogruHarf = soru.dogru_cevap;
        const siklar = HARFLER.map(h => {
            const metin = String(soru['cevap_' + h.toLowerCase()] ?? '');
            if (!metin.trim() && h !== dogruHarf && h !== verilen) return '';
            const sinif = h === dogruHarf ? 'sk-dogru' : (h === verilen ? 'sk-yanlis' : '');
            let etiket = '';
            if (h === dogruHarf) etiket = h === verilen ? 'Senin cevabın · Doğru' : 'Doğru cevap';
            else if (h === verilen) etiket = 'Senin cevabın';
            return `<div class="sonuc-sik ${sinif}"><strong>${h})</strong><span class="sik-metin">${esc(metin)}</span>${etiket ? `<span class="sik-etiket">${etiket}</span>` : ''}</div>`;
        }).join('');
        const ozet = durum === 'bos'
            ? `Bu soruyu boş bıraktın · Doğru cevap: <b>${esc(dogruHarf)}</b>`
            : `Senin cevabın: <b>${esc(verilen)}</b> · Doğru cevap: <b>${esc(dogruHarf)}</b>`;
        return `
        <div class="sonuc-soru d-${durum}" data-durum="${durum}">
            <div class="sonuc-soru-ust">
                <span class="soru-numarasi">Soru ${i + 1}</span>
                <span class="durum-rozet r-${durum}"><i class="fas ${DURUM[durum].ikon}"></i> ${DURUM[durum].ad}</span>
            </div>
            <div class="sonuc-soru-metni">${soruMetniHtml(soru.soru_metni)}</div>
            ${siklar}
            <div class="cevap-ozet">${ozet}</div>
        </div>`;
    }

    function sonucHtml(testAdi, detay) {
        const toplam = detay.length;
        const say = d => detay.filter(x => x.durum === d).length;
        const dogru = say('dogru'), yanlis = say('yanlis'), bos = say('bos');
        const cozulen = dogru + yanlis;
        const yuzde = toplam > 0 ? Math.round((dogru / toplam) * 100 * 10) / 10 : 0;
        const renk = yuzde >= 70 ? '#198754' : (yuzde >= 50 ? '#fd7e14' : '#dc3545');
        const icon = yuzde >= 70 ? 'fa-trophy' : (yuzde >= 50 ? 'fa-thumbs-up' : 'fa-book-open');
        const mesaj = yuzde >= 70 ? 'Harika bir sonuç!' : (yuzde >= 50 ? 'İyi gidiyorsun, yanlışlarına bir göz at.' : 'Konuyu tekrar edip yanlışlarını incelemende fayda var.');

        const pd = dogru / toplam * 100, py = pd + yanlis / toplam * 100;
        const halka = `conic-gradient(#198754 0 ${pd}%, #dc3545 ${pd}% ${py}%, #f2c200 ${py}% 100%)`;
        const filtre = (anahtar, ad, n) =>
            `<button type="button" data-filtre="${anahtar}" class="${anahtar === 'hepsi' ? 'aktif' : ''}" aria-pressed="${anahtar === 'hepsi'}" ${n === 0 ? 'disabled' : ''}>${ad} (${n})</button>`;

        return `
            <h4 class="text-center mb-3"><i class="fas ${icon}" style="color: ${renk};"></i> ${esc(testAdi)}</h4>
            <div class="sonuc-ust">
                <div class="halka" style="background: ${halka}" role="img" aria-label="Başarı yüzde ${yuzde}">
                    <div class="halka-ic"><b>${yuzde}%</b><small>Başarı</small></div>
                </div>
                <div class="sonuc-kutular">
                    <div class="sonuc-kutu"><span class="sayi">${toplam}</span><span class="etiket">Toplam soru</span></div>
                    <div class="sonuc-kutu"><span class="sayi">${cozulen}</span><span class="etiket">Çözülen</span></div>
                    <div class="sonuc-kutu k-dogru"><span class="sayi">${dogru}</span><span class="etiket"><i class="fas fa-check-circle"></i> Doğru</span></div>
                    <div class="sonuc-kutu k-yanlis"><span class="sayi">${yanlis}</span><span class="etiket"><i class="fas fa-times-circle"></i> Yanlış</span></div>
                    <div class="sonuc-kutu k-bos" style="grid-column: 1 / -1"><span class="sayi">${bos}</span><span class="etiket"><i class="fas fa-minus-circle"></i> Boş</span></div>
                </div>
            </div>
            <p class="sonuc-mesaj">${mesaj}</p>
            <h6 class="text-center mb-2" style="color:#1e2b5c"><i class="fas fa-list-check me-1"></i> Cevap Anahtarı ve Cevapların</h6>
            <div class="sonuc-filtre" role="group" aria-label="Soruları filtrele">
                ${filtre('hepsi', 'Tümü', toplam)}${filtre('dogru', 'Doğru', dogru)}${filtre('yanlis', 'Yanlış', yanlis)}${filtre('bos', 'Boş', bos)}
            </div>
            <div id="sonucSorular">${detay.map(sonucSoruHtml).join('')}</div>`;
    }

    function testiBitir(e, testId, testAdi) {
        e.preventDefault();
        const testSorulari = sorularByTest.get(testId) || [];
        if (!testSorulari.length) return;
        const formData = new FormData(e.target);
        const detay = testSorulari.map((soru, i) => {
            const verilen = String(formData.get(`cevap_${soru.id}`) || '');
            const durum = !verilen ? 'bos' : (verilen === soru.dogru_cevap ? 'dogru' : 'yanlis');
            return { soru, i, verilen, durum };
        });
        $('modalBody').innerHTML = sonucHtml(testAdi, detay);
        $('modalBody').scrollTop = 0;
        bootstrap.Modal.getOrCreateInstance($('sonucModal')).show();
    }

    // Sonuç ekranındaki filtre düğmeleri
    $('modalBody').addEventListener('click', e => {
        const b = e.target.closest('[data-filtre]');
        if (!b || b.disabled) return;
        const f = b.dataset.filtre;
        $('modalBody').querySelectorAll('[data-filtre]').forEach(x => {
            const aktif = x === b;
            x.classList.toggle('aktif', aktif);
            x.setAttribute('aria-pressed', aktif);
        });
        $('modalBody').querySelectorAll('.sonuc-soru').forEach(el => {
            el.style.display = (f === 'hepsi' || el.dataset.durum === f) ? '' : 'none';
        });
    });

    // ---------- Olaylar (tek seferlik, delegasyonla) ----------
    const container = $('sinavIcerik');

    // ---------- Test tam ekran ----------
    let acikTest = null;
    function testEkraniAc(tid) {
        const el = document.getElementById('collapseTest' + tid);
        if (!el) return;
        if (acikTest) testEkraniKapat();
        acikTest = el;
        el.classList.add('tam-acik');
        el.scrollTop = 0;
        document.body.classList.add('tam-kilit');
        history.pushState({ testEkrani: tid }, '');   // telefonun geri tuşu da testi kapatır
        testiAc(tid);
    }
    function testEkraniKapat() {
        if (!acikTest) return;
        acikTest.classList.remove('tam-acik');
        acikTest = null;
        document.body.classList.remove('tam-kilit');
    }
    window.addEventListener('popstate', testEkraniKapat);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && acikTest && !document.querySelector('.modal.show')) history.back(); });
    container.addEventListener('click', e => {
        const ac = e.target.closest('[data-test-ac]');
        if (ac) { testEkraniAc(ac.dataset.testAc); return; }
        if (e.target.closest('[data-test-kapat]')) {
            if (history.state && history.state.testEkrani) history.back(); else testEkraniKapat();
        }
    });

    container.addEventListener('submit', e => {
        const form = e.target;
        if (form.classList && form.classList.contains('test-formu')) {
            testiBitir(e, form.dataset.testId, form.dataset.testAdi);
        }
    });

    container.addEventListener('input', e => {
        const inp = e.target.closest ? e.target.closest('.konu-arama') : null;
        if (!inp) return;
        const konuId = inp.dataset.konuId;
        clearTimeout(aramaZamanlayici.get(konuId));
        aramaZamanlayici.set(konuId, setTimeout(() => aramaYap(konuId, inp.value), 250));
    });

    container.addEventListener('click', e => {
        const tekrar = e.target.closest('[data-tekrar]');
        if (tekrar) {
            if (tekrar.dataset.tekrar === 'katalog') baslat();
            else if (tekrar.dataset.tekrar === 'test') testiAc(tekrar.dataset.testId);
            return;
        }
        const yukle = e.target.closest('[data-aramayukle]');
        if (yukle) konuTestleriniYukle(yukle.dataset.aramayukle, yukle);
    });

    // ---------- Başlangıç ----------
    async function baslat() {
        const onbellekVar = await katalogOnbellektenYukle();
        if (onbellekVar) {
            indeksle();
            katalogCiz('');                       // önbellek varsa bekletmeden hemen göster
        } else {
            container.innerHTML = SPINNER_BUYUK;
        }
        // Oturum kontrolü arka planda (kapi.js zaten kapıda kontrol ediyor)
        girisBekle().then(u => { if (!u) location.replace('ogrenci.html'); });
        try {
            const degisti = await katalogGuncelle();
            if (!onbellekVar && !konular.length && !testler.length && !degisti) throw new Error('baglanti');
            if (degisti || !onbellekVar) { indeksle(); katalogCiz(''); }
            if (navigator.onLine) hepsiniIndir();
        } catch (err) {
            console.error(err);
            if (onbellekVar) return;
            container.innerHTML = `
                <div class="bos-mesaj">
                    <i class="fas fa-triangle-exclamation"></i>
                    <p>Sorular yüklenemedi.</p>
                    <p class="small text-muted">${esc(hataMetni(err))}</p>
                    <button type="button" class="btn-tekrar-dene" data-tekrar="katalog"><i class="fas fa-redo-alt"></i> Tekrar dene</button>
                </div>`;
        }
    }
    // Üst arama: konu adı, test adı ve (cihaza inmiş) soru metinlerinde arar
    const trk = s => String(s || '').toLocaleLowerCase('tr');
    function filtrele() {
        const ham = $('ara').value.trim(), q = trk(ham), q2 = ham.toLowerCase();
        let nk = 0, nt = 0;
        document.querySelectorAll('#konuAccordion > .accordion-item').forEach(item => {
            const kid = item.dataset.kid, ad = (konular.find(k => k.id === kid) || {}).konu_adi;
            const konuEsles = !q || trk(ad).includes(q);
            let goster = 0;
            item.querySelectorAll('.test-accordion-item').forEach(ti => {
                const test = testById.get(ti.dataset.tid);
                const ok = konuEsles || trk(test && test.test_adi).includes(q) ||
                    (aramaIndeks.get(ti.dataset.tid) || []).some(x => x.metin.includes(q2));
                ti.hidden = !ok; if (ok) goster++;
            });
            item.hidden = !goster; if (goster) { nk++; nt += goster; }
        });
        $('istatistik').textContent = q ? (nk ? `${nk} konu · ${nt} test` : 'Sonuç bulunamadı.') : `${nk} konu · ${nt} test`;
    }
    let araZaman;
    $('ara').addEventListener('input', () => { clearTimeout(araZaman); araZaman = setTimeout(filtrele, 180); });
    $('hepsi').addEventListener('click', () => {
        hepsiAcik = !hepsiAcik;
        document.querySelectorAll('#konuAccordion > .accordion-item:not([hidden]) > .accordion-collapse').forEach(el => {
            const c = bootstrap.Collapse.getOrCreateInstance(el, { toggle: false });
            hepsiAcik ? c.show() : c.hide();
        });
        $('hepsi').textContent = hepsiAcik ? 'Tümünü Kapat' : 'Tümünü Aç';
    });

    // Tüm testlerin soruları arka planda cihaza indirilir; sonra internetsiz de açılır. Değişen testler yenilenir.
    async function hepsiniIndir() {
        const bekle = testler.filter(gorunur);
        let i = 0;
        const is = async () => { while (i < bekle.length) { try { await testSorulariniAl(bekle[i++]); } catch (e) {} } };
        await Promise.all([is(), is(), is()]);
    }
    baslat();
</script>
</body>
