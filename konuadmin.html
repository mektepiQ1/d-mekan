<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>Öğrenci Bahçesi — Yönetim Paneli</title>
<style>
/* Öğrenci Bahçesi — beyaz & lacivert tema */
:root{
  --navy-950:#071633; --navy-900:#0a1f44; --navy-800:#10295a; --navy-700:#1b3a73;
  --navy-600:#2a4d8f; --navy-300:#9fb3d6; --navy-200:#c9d5ea; --navy-100:#e6ecf7;
  --navy-50:#f4f7fc; --white:#fff; --danger:#b42318; --danger-bg:#fdecea;
  --radius:12px; --shadow:0 2px 10px rgba(10,31,68,.08); --t:.28s;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy-50);color:var(--navy-900);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
[hidden]{display:none!important}
a{color:var(--navy-600)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
main.wrap{padding-top:22px;padding-bottom:60px}

/* Üst çubuk */
.topbar{background:linear-gradient(135deg,var(--navy-950),var(--navy-800));color:#fff;
  position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(7,22,51,.25)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:58px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:18px}
.brand svg{width:28px;height:28px;flex:none}
.nav-link{color:var(--navy-200);text-decoration:none;font-size:14px;padding:7px 12px;border-radius:8px}
.nav-link:hover,.nav-link:focus-visible{background:rgba(255,255,255,.12);color:#fff}

.page-title{font-size:24px;margin:0 0 4px}
.lead{margin:0 0 18px;color:var(--navy-600);font-size:14px}
.muted{color:var(--navy-600);font-size:13px}

/* Kartlar & formlar */
.card{background:#fff;border:1px solid var(--navy-200);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{font-size:16px;margin:0 0 12px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--navy-800)}
input[type=text],input[type=search],textarea{width:100%;padding:11px 12px;border:1px solid var(--navy-300);
  border-radius:10px;background:#fff;color:var(--navy-900);font:inherit;font-size:16px;outline:none;
  transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--navy-600);box-shadow:0 0 0 3px rgba(42,77,143,.18)}
textarea{resize:vertical;min-height:150px;line-height:1.5}
.inline-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline-form .field{flex:1;min-width:200px;margin:0}
.form-actions{display:flex;gap:10px;flex-wrap:wrap}

/* Butonlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;
  border:1px solid transparent;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;
  transition:background .2s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--navy-600);outline-offset:2px}
.btn-primary{background:var(--navy-900);color:#fff}
.btn-primary:hover{background:var(--navy-700)}
.btn-ghost{background:#fff;color:var(--navy-800);border-color:var(--navy-300)}
.btn-ghost:hover{background:var(--navy-100)}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  border:1px solid transparent;background:transparent;color:var(--navy-700);font-size:14px;cursor:pointer;flex:none}
.icon-btn:hover:not(:disabled){background:var(--navy-100)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.danger:hover:not(:disabled){background:var(--danger-bg);color:var(--danger)}

/* Arama */
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.searchbar input{flex:1;min-width:180px}
.stats{font-size:13px;color:var(--navy-600);margin:0 2px 12px}

/* Akordeon (grid animasyonu: max-height yok, takılma yok) */
.acc{background:#fff;border:1px solid var(--navy-200);border-radius:var(--radius);margin-bottom:10px;
  overflow:hidden;box-shadow:var(--shadow)}
.acc.sub{background:var(--navy-50);border-radius:10px;margin-bottom:8px;box-shadow:none}
.acc-row{display:flex;align-items:stretch}
.acc-head{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;background:transparent;border:0;color:var(--navy-900);font:inherit;font-weight:600;
  text-align:left;cursor:pointer;transition:background .2s}
.acc-head:hover{background:var(--navy-50)}
.acc.sub .acc-head:hover{background:var(--navy-100)}
.acc-head:focus-visible{outline:2px solid var(--navy-600);outline-offset:-2px}
.acc-title{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:break-word}
.acc-meta{display:flex;align-items:center;gap:10px;flex:none}
.chev{width:9px;height:9px;border-right:2px solid var(--navy-600);border-bottom:2px solid var(--navy-600);
  transform:rotate(45deg);transition:transform var(--t);margin:0 4px 3px 0}
.acc.open>.acc-head .chev,.acc.open>.acc-row .acc-head .chev{transform:rotate(225deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t) ease}
.acc.open>.acc-body{grid-template-rows:1fr;border-top:1px solid var(--navy-100)}
.acc-inner{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s var(--t)}
.acc.open>.acc-body>.acc-inner{visibility:visible;transition-delay:0s}
.sub-list,.panel{padding:12px}
.badge{font-size:12px;font-weight:700;background:var(--navy-100);color:var(--navy-800);
  padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge.solid{background:var(--navy-900);color:#fff;border-radius:6px;white-space:normal;
  overflow-wrap:break-word;padding:3px 10px}

/* Not metni: güvenli (textContent), uzun metinde kendi içinde kayar */
.note{white-space:pre-wrap;overflow-wrap:break-word;max-height:min(60vh,520px);overflow:auto;
  padding:14px 16px;margin:0;background:#fff;border:1px solid var(--navy-100);border-radius:8px;
  line-height:1.75;font-size:15px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.note::-webkit-scrollbar{width:8px}
.note::-webkit-scrollbar-thumb{background:var(--navy-300);border-radius:4px}

.empty{text-align:center;color:var(--navy-600);padding:36px 12px}
.empty p{margin:0 0 14px}

/* Yönetim paneli */
.row-actions{display:flex;align-items:center;gap:2px;padding-right:6px;flex:none}
.acc-row .row-actions{padding-left:2px}
.page-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;
  border:1px solid var(--navy-200);border-radius:10px;padding:8px 8px 8px 12px;margin-bottom:8px}
.page-info{min-width:0;display:flex;flex-direction:column;overflow-wrap:break-word}
.subform{background:#fff;border:1px dashed var(--navy-300);border-radius:10px;padding:14px;margin-top:12px}
.subform-title{font-size:14px;margin:0 0 10px;color:var(--navy-800)}
.meter{height:8px;background:var(--navy-100);border-radius:99px;overflow:hidden;margin:8px 0}
.meter>i{display:block;height:100%;width:0;background:var(--navy-700);transition:width .3s}
.meter.warn>i{background:var(--danger)}
.backup-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* Bildirim */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--navy-900);color:#fff;
  padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:92vw;z-index:50;font-size:14px;box-shadow:0 6px 20px rgba(7,22,51,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--danger)}

@media (max-width:480px){
  .acc-head{padding:13px 12px}
  .btn{padding:11px 12px}
  .acc-meta .muted{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important}
}

/* ===== Duyarlı tasarım: telefon, tablet, bilgisayar ===== */
html{scroll-behavior:smooth}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.topbar{padding-top:env(safe-area-inset-top)}
#toast{bottom:max(22px,env(safe-area-inset-bottom))}
.note{max-height:min(60vh,520px);max-height:min(60dvh,520px)}

/* Dokunmatik ekranlarda büyük dokunma alanları */
@media (pointer:coarse){
  .btn{min-height:44px}
  .icon-btn{width:44px;height:44px;font-size:16px}
  .acc-head{min-height:52px}
  input[type=text],input[type=search]{min-height:46px}
}

/* Küçük telefon */
@media (max-width:420px){
  .page-title{font-size:21px}
  .card{padding:14px}
  .inline-form .btn{width:100%}
  .row-actions{flex-wrap:wrap;justify-content:flex-end;max-width:132px}
  .page-row{align-items:flex-start}
  .backup-actions .btn{flex:1}
}

/* Tablet */
@media (min-width:640px){
  .wrap{max-width:820px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
  .page-title{font-size:28px}
  .card{padding:22px}
  .acc-head{padding:16px 20px;font-size:17px}
  .acc.sub .acc-head{font-size:15px}
  .sub-list,.panel{padding:16px}
  .note{font-size:16px;padding:18px 20px}
}

/* Bilgisayar */
@media (min-width:1024px){
  .wrap{max-width:980px}
  main.wrap{padding-top:34px}
  .note{max-height:min(65vh,640px);font-size:16.5px}
}
@media (min-width:1400px){
  .wrap{max-width:1080px}
}

/* Yatay telefon */
@media (max-height:480px) and (orientation:landscape){
  .topbar{position:static}
  .note{max-height:70vh}
}
@media print{
  .topbar,.searchbar,#toast{display:none}
  .acc-body{grid-template-rows:1fr!important}
  .acc-inner{visibility:visible!important}
  .note{max-height:none;overflow:visible}
}


/* ===== Taşma / dolma önlemleri ===== */
html,body{max-width:100%}
h1,h2,h3,p,strong,span,label,a,button{overflow-wrap:break-word;word-break:normal}
.wrap,.card,.acc,.acc-inner,.panel,.sub-list,.page-row,.page-info,.field,.inline-form>*{min-width:0}
.acc-head{min-width:0}
.acc-title{flex:1 1 auto;min-width:0}
.acc-title>span{min-width:0;overflow-wrap:break-word}
.acc-title>span[aria-hidden]{flex:none}
.acc-meta{flex:0 0 auto}
.badge{max-width:100%}
.badge.solid{display:inline-block;max-width:100%;line-height:1.35;white-space:normal;overflow-wrap:break-word}
.btn{white-space:normal;text-align:center;max-width:100%;line-height:1.3}
.page-info strong{overflow-wrap:break-word}
.note{overflow-wrap:break-word;max-width:100%}
input[type=text],input[type=search],textarea{max-width:100%;min-width:0}
.acc{scroll-margin-top:76px}
.stats,.lead,.muted{overflow-wrap:break-word}

/* ===== Düzen onarımı: başlık sıkışmasını önle, butonlar ayrı satırda ===== */
.acc-title{align-items:flex-start}
.acc-title>span[aria-hidden]{margin-top:1px}
.acc-title>span:last-child{flex:1 1 auto;line-height:1.35}
.acc-head{align-items:center}

@media (max-width:639px){
  /* Konu başlığı tam genişlik, işlem butonları altında tek sırada */
  .acc-row{flex-direction:column}
  .acc-row .row-actions{max-width:none;flex-wrap:nowrap;justify-content:stretch;gap:4px;
    padding:6px 10px;background:var(--navy-50);border-top:1px solid var(--navy-100)}
  .acc-row .row-actions .icon-btn,
  .page-row .row-actions .icon-btn{flex:1 1 0;width:auto;max-width:none;height:42px;border-color:var(--navy-100);background:#fff}
  /* Sayfa satırı: ad üstte, butonlar altta */
  .page-row{flex-direction:column;align-items:stretch;padding:10px}
  .page-row .row-actions{max-width:none;flex-wrap:nowrap;gap:4px;padding:0;justify-content:stretch}
  .page-info{flex:none}
  .acc-meta{gap:8px}
}
@media (min-width:640px){
  .acc-row .row-actions{align-self:center;padding-right:10px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="konu.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 7-8 7z"/><path d="M12 14c0-3-2.5-5-7-5 0 4 2.5 5 7 5z"/></svg><span>Öğrenci Bahçesi</span></a>
    <nav><a class="nav-link" href="konu.html">📚 Ders Notları</a></nav>
  </div>
</header>
<main class="wrap">
  <h1 class="page-title">Yönetim Paneli</h1>
  <p class="lead">Konu ekle, konuların içine sayfa ekle, düzenle ve sırala.</p>

  <section class="card">
    <h2>Yeni ana konu</h2>
    <form id="konuForm" class="inline-form">
      <label class="field"><span>Konu adı (örn. Fizik)</span>
        <input id="konuAdi" type="text" maxlength="80" placeholder="Konu ismi giriniz…" required autocomplete="off"></label>
      <button class="btn btn-primary" type="submit">Konu Ekle</button>
    </form>
  </section>

  <section class="card">
    <h2>Konular ve sayfaları <span id="istatistik" class="muted"></span></h2>
    <div id="liste"></div>
    <p id="bos" class="empty" hidden>Henüz konu yok. Yukarıdan ilk konunu ekle.</p>
  </section>

  <section class="card">
    <h2>Yedekleme</h2>
    <p class="muted">Notlar bu tarayıcıda saklanır. Düzenli yedek almanı öneririm.</p>
    <div class="meter" id="depoBar"><i></i></div>
    <p class="muted" id="depoYazi"></p>
    <div class="backup-actions">
      <button id="disaAktar" class="btn btn-ghost" type="button">⬇ Yedeği İndir</button>
      <label class="btn btn-ghost" for="iceAktar">⬆ Yedeği Yükle</label>
      <input id="iceAktar" type="file" accept="application/json,.json" hidden>
    </div>
  </section>
</main>
<script>
/* Öğrenci Bahçesi — ortak yardımcılar (depolama, DOM, bildirim) */
(function (global) {
  'use strict';

  const KEY = 'dersKonulariYeni'; // eski verilerle uyumlu
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  const str = v => (v == null ? '' : String(v));
  const lc = s => str(s).toLocaleLowerCase('tr');

  /* Güvenli DOM üretici: metinler hep textContent ile yazılır (XSS yok) */
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid);
    return n;
  }

  /* Veriyi doğrula / eski formatı yeni formata taşı (id ekle) */
  function normalize(raw) {
    if (raw && !Array.isArray(raw) && Array.isArray(raw.konular)) raw = raw.konular;
    if (!Array.isArray(raw)) return { data: [], changed: raw != null };
    let changed = false;
    const seen = new Set();
    const newId = cur => {
      if (typeof cur === 'string' && cur && !seen.has(cur)) { seen.add(cur); return cur; }
      changed = true;
      let id; do { id = uid(); } while (seen.has(id));
      seen.add(id); return id;
    };
    const data = [];
    for (const k of raw) {
      if (!k || typeof k !== 'object') { changed = true; continue; }
      const sayfalar = [];
      for (const s of (Array.isArray(k.sayfalar) ? k.sayfalar : [])) {
        if (!s || typeof s !== 'object') { changed = true; continue; }
        sayfalar.push({
          id: newId(s.id),
          sayfaAdi: str(s.sayfaAdi).trim() || 'Adsız sayfa',
          icerik: str(s.icerik)
        });
      }
      data.push({ id: newId(k.id), konuAdi: str(k.konuAdi).trim() || 'Adsız konu', sayfalar });
    }
    return { data, changed };
  }

  function save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }

  function load() {
    let raw = null;
    try {
      const t = localStorage.getItem(KEY);
      if (t) {
        try { raw = JSON.parse(t); }
        catch (e) { try { localStorage.setItem(KEY + '_bozuk_yedek', t); } catch (_) {} }
      }
    } catch (e) { /* depolama kapalı olabilir */ }
    const { data, changed } = normalize(raw);
    if (changed && raw != null) save(data);
    return data;
  }

  function usage() {
    try { return (KEY.length + (localStorage.getItem(KEY) || '').length) * 2; }
    catch (e) { return 0; }
  }

  function fmtBytes(b) {
    return b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
  }

  function onChange(cb) {
    window.addEventListener('storage', e => { if (e.key === KEY || e.key === null) cb(); });
    window.addEventListener('pageshow', e => { if (e.persisted) cb(); }); // geri tuşu / bfcache
  }

  let tt;
  function toast(msg, type) {
    let t = document.getElementById('toast');
    if (!t) { t = el('div', { id: 'toast', role: 'status', 'aria-live': 'polite' }); document.body.append(t); }
    t.textContent = msg;
    t.className = 'show ' + (type || 'ok');
    clearTimeout(tt);
    tt = setTimeout(() => { t.className = ''; }, type === 'err' ? 4500 : 2500);
  }

  global.OB = { KEY, uid, el, lc, load, save, normalize, usage, fmtBytes, onChange, toast };
})(window);

</script>
<script>
/* Öğrenci Bahçesi — yönetim paneli */
(function () {
  'use strict';
  const { el, load, save, uid, lc, toast, normalize, usage, fmtBytes, onChange } = OB;
  const $ = id => document.getElementById(id);
  const listEl = $('liste');
  const LIMIT = 5 * 1024 * 1024; // tarayıcıların yaklaşık localStorage sınırı

  let konular = [];
  const openT = new Set();

  /* Her işlem güncel veriyi yeniden okuyup kaydeder: sekmeler arası çakışma olmaz */
  function commit(fn) {
    const data = load();
    if (fn(data) === false) return false;
    if (!save(data)) {
      toast('Kaydedilemedi! Depolama alanı dolmuş olabilir. Yedek alıp eski notları silmeyi dene.', 'err');
      return false;
    }
    konular = data;
    return true;
  }

  const iconBtn = (txt, label, action, disabled, cls) =>
    el('button', { class: 'icon-btn' + (cls ? ' ' + cls : ''), type: 'button', 'data-action': action,
      'aria-label': label, title: label, disabled: !!disabled }, txt);

  function pageRow(s, j, n) {
    return el('div', { class: 'page-row', 'data-page': s.id },
      el('div', { class: 'page-info' },
        el('strong', { text: '📄 ' + s.sayfaAdi }),
        el('span', { class: 'muted', text: s.icerik.length.toLocaleString('tr-TR') + ' karakter' })),
      el('div', { class: 'row-actions' },
        iconBtn('▲', 'Yukarı taşı', 'page-up', j === 0),
        iconBtn('▼', 'Aşağı taşı', 'page-down', j === n - 1),
        iconBtn('✎', 'Sayfayı düzenle', 'edit-page'),
        iconBtn('🗑', 'Sayfayı sil', 'delete-page', false, 'danger')));
  }

  function panel(k) {
    const n = k.sayfalar.length;
    return el('div', { class: 'panel' },
      n ? k.sayfalar.map((s, j) => pageRow(s, j, n))
        : el('p', { class: 'muted', text: 'Bu konuya henüz sayfa eklenmemiş.' }),
      el('form', { class: 'subform', 'data-form': 'page' },
        el('h3', { class: 'subform-title', text: '➕ Yeni sayfa ekle' }),
        el('label', { class: 'field' }, el('span', { text: 'Sayfa numarası / adı' }),
          el('input', { type: 'text', name: 'sayfaAdi', maxlength: '120', required: true,
            placeholder: 'Örn: Sayfa 1 veya Newton Yasaları', autocomplete: 'off' })),
        el('label', { class: 'field' }, el('span', { text: 'Ders notu metni' }),
          el('textarea', { name: 'icerik', required: true, placeholder: 'Notları buraya yapıştır…' })),
        el('div', { class: 'form-actions' },
          el('button', { class: 'btn btn-primary', type: 'submit', text: 'Sayfayı Kaydet' }),
          el('button', { class: 'btn btn-ghost', type: 'button', 'data-action': 'cancel-edit', hidden: true, text: 'Vazgeç' }))));
  }

  function fill(node) {
    const inner = node.querySelector(':scope > .acc-body > .acc-inner');
    const k = konular.find(x => x.id === node.dataset.id);
    if (!inner || !k) return;
    inner.replaceChildren(panel(k));
  }

  function topicNode(k, i) {
    const open = openT.has(k.id);
    const node = el('section', { class: 'acc' + (open ? ' open' : ''), 'data-id': k.id },
      el('div', { class: 'acc-row' },
        el('button', { class: 'acc-head', type: 'button', 'aria-expanded': String(open), 'data-action': 'toggle' },
          el('span', { class: 'acc-title' }, el('span', { 'aria-hidden': 'true', text: '📖' }), el('span', { text: k.konuAdi })),
          el('span', { class: 'acc-meta' },
            el('span', { class: 'badge', text: k.sayfalar.length + ' sayfa' }),
            el('span', { class: 'chev', 'aria-hidden': 'true' }))),
        el('div', { class: 'row-actions' },
          iconBtn('▲', 'Konuyu yukarı taşı', 'topic-up', i === 0),
          iconBtn('▼', 'Konuyu aşağı taşı', 'topic-down', i === konular.length - 1),
          iconBtn('✎', 'Konuyu yeniden adlandır', 'rename-topic'),
          iconBtn('🗑', 'Konuyu sil', 'delete-topic', false, 'danger'))),
      el('div', { class: 'acc-body' }, el('div', { class: 'acc-inner' })));
    if (open) fill(node);
    return node;
  }

  function meta() {
    const sp = konular.reduce((n, k) => n + k.sayfalar.length, 0);
    $('istatistik').textContent = '(' + konular.length + ' konu · ' + sp + ' sayfa)';
    const used = usage();
    const pct = Math.min(100, used / LIMIT * 100);
    $('depoBar').firstElementChild.style.width = pct.toFixed(1) + '%';
    $('depoBar').classList.toggle('warn', pct > 80);
    $('depoYazi').textContent = 'Kullanılan alan: ' + fmtBytes(used) + ' / yaklaşık 5 MB' +
      (pct > 80 ? ' — dolmak üzere, yedek alıp eski notları temizle.' : '');
  }

  function renderAll() {
    const frag = document.createDocumentFragment();
    konular.forEach((k, i) => frag.append(topicNode(k, i)));
    listEl.replaceChildren(frag);
    $('bos').hidden = konular.length > 0;
    meta();
  }

  function refreshTopic(id) {
    const i = konular.findIndex(k => k.id === id);
    const old = listEl.querySelector(':scope > .acc[data-id="' + CSS.escape(id) + '"]');
    if (i < 0 || !old) return renderAll();
    old.replaceWith(topicNode(konular[i], i));
    meta();
  }

  function resetForm(form) {
    form.reset();
    delete form.dataset.editing;
    form.querySelector('.subform-title').textContent = '➕ Yeni sayfa ekle';
    form.querySelector('.btn-primary').textContent = 'Sayfayı Kaydet';
    form.querySelector('[data-action="cancel-edit"]').hidden = true;
  }

  const move = (arr, id, dir) => {
    const i = arr.findIndex(x => x.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return false;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  };

  /* Tek tıklama dinleyicisi */
  listEl.addEventListener('click', e => {
    const b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    const node = b.closest('.acc');
    if (!node) return;
    const kid = node.dataset.id;
    const pid = b.closest('[data-page]') ? b.closest('[data-page]').dataset.page : null;
    const k = konular.find(x => x.id === kid);
    if (!k) return;

    switch (b.dataset.action) {
      case 'toggle': {
        const open = node.classList.toggle('open');
        b.setAttribute('aria-expanded', String(open));
        open ? openT.add(kid) : openT.delete(kid);
        if (open && !node.querySelector('.panel')) fill(node);
        break;
      }
      case 'topic-up': case 'topic-down':
        if (commit(d => move(d, kid, b.dataset.action === 'topic-up' ? -1 : 1))) renderAll();
        break;
      case 'rename-topic': {
        const raw = prompt('Yeni konu adı:', k.konuAdi);
        if (raw == null) return;
        const ad = raw.trim().replace(/\s+/g, ' ').slice(0, 80);
        if (!ad) return toast('Konu adı boş olamaz.', 'err');
        if (konular.some(x => x.id !== kid && lc(x.konuAdi) === lc(ad))) return toast('Bu isimde bir konu zaten var.', 'err');
        if (commit(d => { const t = d.find(x => x.id === kid); if (!t) return false; t.konuAdi = ad; })) {
          toast('Konu adı güncellendi.'); refreshTopic(kid);
        }
        break;
      }
      case 'delete-topic':
        if (!confirm('“' + k.konuAdi + '” konusu ve içindeki ' + k.sayfalar.length + ' sayfa silinsin mi?')) return;
        if (commit(d => { const i = d.findIndex(x => x.id === kid); if (i < 0) return false; d.splice(i, 1); })) {
          openT.delete(kid); renderAll(); toast('Konu silindi.');
        }
        break;
      case 'page-up': case 'page-down':
        if (commit(d => { const t = d.find(x => x.id === kid); return t ? move(t.sayfalar, pid, b.dataset.action === 'page-up' ? -1 : 1) : false; }))
          refreshTopic(kid);
        break;
      case 'delete-page': {
        const s = k.sayfalar.find(x => x.id === pid);
        if (!s || !confirm('“' + s.sayfaAdi + '” sayfası silinsin mi?')) return;
        if (commit(d => { const t = d.find(x => x.id === kid); if (!t) return false; t.sayfalar = t.sayfalar.filter(x => x.id !== pid); })) {
          refreshTopic(kid); toast('Sayfa silindi.');
        }
        break;
      }
      case 'edit-page': {
        const s = k.sayfalar.find(x => x.id === pid);
        const form = node.querySelector('form[data-form="page"]');
        if (!s || !form) return;
        form.dataset.editing = pid;
        form.elements.sayfaAdi.value = s.sayfaAdi;
        form.elements.icerik.value = s.icerik;
        form.querySelector('.subform-title').textContent = '✎ Sayfayı düzenle';
        form.querySelector('.btn-primary').textContent = 'Güncelle';
        form.querySelector('[data-action="cancel-edit"]').hidden = false;
        form.scrollIntoView({ behavior: 'smooth', block: 'center' });
        form.elements.sayfaAdi.focus({ preventScroll: true });
        break;
      }
      case 'cancel-edit':
        resetForm(b.closest('form'));
        break;
    }
  });

  /* Sayfa ekle / güncelle */
  listEl.addEventListener('submit', e => {
    const form = e.target.closest('form[data-form="page"]');
    if (!form) return;
    e.preventDefault();
    const kid = form.closest('.acc').dataset.id;
    const ad = form.elements.sayfaAdi.value.trim();
    const icerik = form.elements.icerik.value.trim();
    if (!ad || !icerik) return toast('Sayfa adı ve içerik boş olamaz.', 'err');
    const editId = form.dataset.editing || '';
    const ok = commit(d => {
      const k = d.find(x => x.id === kid);
      if (!k) return false;
      if (editId) {
        const s = k.sayfalar.find(x => x.id === editId);
        if (!s) return false;
        s.sayfaAdi = ad; s.icerik = icerik;
      } else {
        k.sayfalar.push({ id: uid(), sayfaAdi: ad, icerik });
      }
    });
    if (ok) { toast(editId ? 'Sayfa güncellendi.' : 'Sayfa eklendi.'); refreshTopic(kid); }
  });

  /* Yeni konu */
  $('konuForm').addEventListener('submit', e => {
    e.preventDefault();
    const inp = $('konuAdi');
    const ad = inp.value.trim().replace(/\s+/g, ' ');
    if (!ad) return;
    const id = uid();
    const ok = commit(d => {
      if (d.some(k => lc(k.konuAdi) === lc(ad))) { toast('Bu isimde bir konu zaten var.', 'err'); return false; }
      d.push({ id, konuAdi: ad, sayfalar: [] });
    });
    if (ok) { openT.add(id); inp.value = ''; renderAll(); toast('Konu eklendi.'); }
  });

  /* Yedek indir */
  $('disaAktar').addEventListener('click', () => {
    const json = JSON.stringify({ uygulama: 'Öğrenci Bahçesi', surum: 1, konular: load() }, null, 2);
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = el('a', { href: url, download: 'ogrenci-bahcesi-yedek-' + new Date().toISOString().slice(0, 10) + '.json' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('Yedek indirildi.');
  });

  /* Yedek yükle */
  $('iceAktar').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const raw = JSON.parse(await f.text());
      if (!Array.isArray(raw) && !(raw && Array.isArray(raw.konular))) throw new Error('format');
      const { data } = normalize(raw);
      if (!confirm(data.length + ' konu içe aktarılacak. Mevcut tüm notların yerine geçer. Devam edilsin mi?')) return;
      if (commit(d => { d.splice(0, d.length, ...data); })) { openT.clear(); renderAll(); toast('Yedek yüklendi.'); }
    } catch (err) {
      toast('Geçersiz yedek dosyası.', 'err');
    }
  });

  function yenile() { konular = load(); renderAll(); }

  /* konu.html'deki kalem simgesinden gelince ilgili sayfanın düzenleme formunu aç */
  function deepLink() {
    const m = /^#duzenle=([^/]+)\/(.+)$/.exec(location.hash);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    let kid, pid;
    try { kid = decodeURIComponent(m[1]); pid = decodeURIComponent(m[2]); } catch (_) { return; }
    const k = konular.find(x => x.id === kid);
    if (!k || !k.sayfalar.some(x => x.id === pid)) return toast('Bu sayfa bulunamadı. Silinmiş olabilir.', 'err');
    openT.add(kid);
    renderAll();
    const btn = listEl.querySelector('[data-page="' + CSS.escape(pid) + '"] [data-action="edit-page"]');
    if (btn) btn.click();
  }
  onChange(yenile);
  yenile();
  deepLink();
})();

</script>
</body>
</html>
