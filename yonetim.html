<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Paneli</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Yönetim Paneli</h2>
        <textarea id="metinInput" placeholder="Yayınlamak istediğiniz metni buraya yazın..."></textarea>
        <button id="kaydetBtn">Kaydet ve Yayınla</button>
        <div id="status"></div>
    </div>

    <!-- Firebase SDK'ları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAlHpu2YvnpwyBj6JNLMZszh47Nuh3fU4",
            authDomain: "test2-f67a3.firebaseapp.com",
            projectId: "test2-f67a3",
            storageBucket: "test2-f67a3.firebasestorage.app",
            messagingSenderId: "374933004868",
            appId: "1:374933004868:web:2b5f1d69c853aea3a3d211",
            measurementId: "G-DSQ2GW6KT5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const metinInput = document.getElementById("metinInput");
        const kaydetBtn = document.getElementById("kaydetBtn");
        const status = document.getElementById("status");

        // Sayfa açıldığında veritabanındaki mevcut metni inputa getir
        async function mevcutMetniGetir() {
            try {
                const docRef = doc(db, "icerik", "duyuru");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    metinInput.value = docSnap.data().metin || "";
                }
            } catch (error) {
                console.error("Veri çekilirken hata oluştu:", error);
            }
        }
        mevcutMetniGetir();

        // Kaydet butonuna basıldığında Firestore'a yaz
        kaydetBtn.addEventListener("click", async () => {
            const yeniMetin = metinInput.value;
            status.textContent = "Kaydediliyor...";
            
            try {
                await setDoc(doc(db, "icerik", "duyuru"), {
                    metin: yeniMetin,
                    guncellenmeTarihi: new Date()
                });
                status.textContent = "Başarıyla kaydedildi!";
                setTimeout(() => status.textContent = "", 3000);
            } catch (error) {
                console.error("Kayıt hatası: ", error);
                status.textContent = "Hata oluştu!";
            }
        });
    </script>
</body>
</html>
