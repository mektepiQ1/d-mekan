<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>Öğrenci Bahçesi — Konu anlatımı</title>
<style>
/* Öğrenci Bahçesi — beyaz & lacivert tema */
:root{
  --navy-950:#071633; --navy-900:#0a1f44; --navy-800:#10295a; --navy-700:#1b3a73;
  --navy-600:#2a4d8f; --navy-300:#9fb3d6; --navy-200:#c9d5ea; --navy-100:#e6ecf7;
  --navy-50:#f4f7fc; --white:#fff; --danger:#b42318; --danger-bg:#fdecea;
  --radius:12px; --shadow:0 2px 10px rgba(10,31,68,.08); --t:.28s;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy-50);color:var(--navy-900);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
[hidden]{display:none!important}
a{color:var(--navy-600)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
main.wrap{padding-top:22px;padding-bottom:60px}

/* Üst çubuk */
.topbar{background:linear-gradient(135deg,var(--navy-950),var(--navy-800));color:#fff;
  position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(7,22,51,.25)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:58px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:18px}
.brand svg{width:28px;height:28px;flex:none}
.nav-link{color:var(--navy-200);text-decoration:none;font-size:14px;padding:7px 12px;border-radius:8px}
.nav-link:hover,.nav-link:focus-visible{background:rgba(255,255,255,.12);color:#fff}

.page-title{font-size:24px;margin:0 0 4px}
.lead{margin:0 0 18px;color:var(--navy-600);font-size:14px}
.muted{color:var(--navy-600);font-size:13px}

/* Kartlar & formlar */
.card{background:#fff;border:1px solid var(--navy-200);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{font-size:16px;margin:0 0 12px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--navy-800)}
input[type=text],input[type=search],textarea{width:100%;padding:11px 12px;border:1px solid var(--navy-300);
  border-radius:10px;background:#fff;color:var(--navy-900);font:inherit;font-size:16px;outline:none;
  transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--navy-600);box-shadow:0 0 0 3px rgba(42,77,143,.18)}
textarea{resize:vertical;min-height:150px;line-height:1.5}
.inline-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline-form .field{flex:1;min-width:200px;margin:0}
.form-actions{display:flex;gap:10px;flex-wrap:wrap}

/* Butonlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;
  border:1px solid transparent;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;
  transition:background .2s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--navy-600);outline-offset:2px}
.btn-primary{background:var(--navy-900);color:#fff}
.btn-primary:hover{background:var(--navy-700)}
.btn-ghost{background:#fff;color:var(--navy-800);border-color:var(--navy-300)}
.btn-ghost:hover{background:var(--navy-100)}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  border:1px solid transparent;background:transparent;color:var(--navy-700);font-size:14px;cursor:pointer;flex:none}
.icon-btn:hover:not(:disabled){background:var(--navy-100)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.danger:hover:not(:disabled){background:var(--danger-bg);color:var(--danger)}

/* Arama */
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.searchbar input{flex:1;min-width:180px}
.stats{font-size:13px;color:var(--navy-600);margin:0 2px 12px}

/* Akordeon (grid animasyonu: max-height yok, takılma yok) */
.acc{background:#fff;border:1px solid var(--navy-200);border-radius:var(--radius);margin-bottom:10px;
  overflow:hidden;box-shadow:var(--shadow)}
.acc.sub{background:var(--navy-50);border-radius:10px;margin-bottom:8px;box-shadow:none}
.acc-row{display:flex;align-items:stretch}
.acc-head{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;background:transparent;border:0;color:var(--navy-900);font:inherit;font-weight:600;
  text-align:left;cursor:pointer;transition:background .2s}
.acc-head:hover{background:var(--navy-50)}
.acc.sub .acc-head:hover{background:var(--navy-100)}
.acc-head:focus-visible{outline:2px solid var(--navy-600);outline-offset:-2px}
.acc-title{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:break-word}
.acc-meta{display:flex;align-items:center;gap:10px;flex:none}
.chev{width:9px;height:9px;border-right:2px solid var(--navy-600);border-bottom:2px solid var(--navy-600);
  transform:rotate(45deg);transition:transform var(--t);margin:0 4px 3px 0}
.acc.open>.acc-head .chev,.acc.open>.acc-row .acc-head .chev{transform:rotate(225deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t) ease}
.acc.open>.acc-body{grid-template-rows:1fr;border-top:1px solid var(--navy-100)}
.acc-inner{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s var(--t)}
.acc.open>.acc-body>.acc-inner{visibility:visible;transition-delay:0s}
.sub-list,.panel{padding:12px}
.badge{font-size:12px;font-weight:700;background:var(--navy-100);color:var(--navy-800);
  padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge.solid{background:var(--navy-900);color:#fff;border-radius:6px;white-space:normal;
  overflow-wrap:break-word;padding:3px 10px}

/* Not metni: güvenli (textContent), uzun metinde kendi içinde kayar */
.note{white-space:pre-wrap;overflow-wrap:break-word;max-height:min(60vh,520px);overflow:auto;
  padding:14px 16px;margin:0;background:#fff;border:1px solid var(--navy-100);border-radius:8px;
  line-height:1.75;font-size:15px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.note::-webkit-scrollbar{width:8px}
.note::-webkit-scrollbar-thumb{background:var(--navy-300);border-radius:4px}

.empty{text-align:center;color:var(--navy-600);padding:36px 12px}
.empty p{margin:0 0 14px}

/* Yönetim paneli */
.row-actions{display:flex;align-items:center;gap:2px;padding-right:6px;flex:none}
.acc-row .row-actions{padding-left:2px}
.page-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;
  border:1px solid var(--navy-200);border-radius:10px;padding:8px 8px 8px 12px;margin-bottom:8px}
.page-info{min-width:0;display:flex;flex-direction:column;overflow-wrap:break-word}
.subform{background:#fff;border:1px dashed var(--navy-300);border-radius:10px;padding:14px;margin-top:12px}
.subform-title{font-size:14px;margin:0 0 10px;color:var(--navy-800)}
.meter{height:8px;background:var(--navy-100);border-radius:99px;overflow:hidden;margin:8px 0}
.meter>i{display:block;height:100%;width:0;background:var(--navy-700);transition:width .3s}
.meter.warn>i{background:var(--danger)}
.backup-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* Bildirim */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--navy-900);color:#fff;
  padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:92vw;z-index:50;font-size:14px;box-shadow:0 6px 20px rgba(7,22,51,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--danger)}

@media (max-width:480px){
  .acc-head{padding:13px 12px}
  .btn{padding:11px 12px}
  .acc-meta .muted{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important}
}

/* ===== Duyarlı tasarım: telefon, tablet, bilgisayar ===== */
html{scroll-behavior:smooth}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.topbar{padding-top:env(safe-area-inset-top)}
#toast{bottom:max(22px,env(safe-area-inset-bottom))}
.note{max-height:min(60vh,520px);max-height:min(60dvh,520px)}

/* Dokunmatik ekranlarda büyük dokunma alanları */
@media (pointer:coarse){
  .btn{min-height:44px}
  .icon-btn{width:44px;height:44px;font-size:16px}
  .acc-head{min-height:52px}
  input[type=text],input[type=search]{min-height:46px}
}

/* Küçük telefon */
@media (max-width:420px){
  .page-title{font-size:21px}
  .card{padding:14px}
  .inline-form .btn{width:100%}
  .row-actions{flex-wrap:wrap;justify-content:flex-end;max-width:132px}
  .page-row{align-items:flex-start}
  .backup-actions .btn{flex:1}
}

/* Tablet */
@media (min-width:640px){
  .wrap{max-width:820px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
  .page-title{font-size:28px}
  .card{padding:22px}
  .acc-head{padding:16px 20px;font-size:17px}
  .acc.sub .acc-head{font-size:15px}
  .sub-list,.panel{padding:16px}
  .note{font-size:16px;padding:18px 20px}
}

/* Bilgisayar */
@media (min-width:1024px){
  .wrap{max-width:980px}
  main.wrap{padding-top:34px}
  .note{max-height:min(65vh,640px);font-size:16.5px}
}
@media (min-width:1400px){
  .wrap{max-width:1080px}
}

/* Yatay telefon */
@media (max-height:480px) and (orientation:landscape){
  .topbar{position:static}
  .note{max-height:70vh}
}
@media print{
  .topbar,.searchbar,#toast{display:none}
  .acc-body{grid-template-rows:1fr!important}
  .acc-inner{visibility:visible!important}
  .note{max-height:none;overflow:visible}
}


/* ===== Sayfa satırı (tam ekran okuyucuyu açar) ===== */
.page-open{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:0 0 8px;
  padding:13px 14px;background:var(--navy-50);border:1px solid var(--navy-200);border-radius:10px;
  color:var(--navy-900);font:inherit;font-weight:600;text-align:left;cursor:pointer;transition:background .2s,transform .1s}
.page-open:hover{background:var(--navy-100)}
.page-open:active{transform:scale(.99)}
.page-open:focus-visible{outline:2px solid var(--navy-600);outline-offset:2px}
.page-open .chev{transform:rotate(-45deg);margin:0 4px 0 0}
@media (pointer:coarse){.page-open{min-height:52px}}

/* ===== Tam ekran okuyucu ===== */
body.reader-open{overflow:hidden}
.reader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#fff;
  height:100vh;height:100dvh;animation:readerIn .22s ease}
@keyframes readerIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.reader-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));
  background:linear-gradient(135deg,var(--navy-950),var(--navy-800));color:#fff;box-shadow:0 2px 8px rgba(7,22,51,.25)}
.reader-titles{min-width:0;display:flex;flex-direction:column}
.reader-topic{font-size:12px;color:var(--navy-200);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-title{margin:0;font-size:18px;line-height:1.3;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.reader-actions{display:flex;align-items:center;gap:8px;flex:none}
.reader-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 12px;
  border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;
  font:inherit;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;transition:background .2s}
.reader-btn:hover{background:rgba(255,255,255,.22)}
.reader-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.reader-btn svg{width:20px;height:20px;flex:none}
.reader-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:20px max(18px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.reader-body:focus{outline:none}
.reader-text{max-width:760px;margin:0 auto;white-space:pre-wrap;overflow-wrap:break-word;font-size:17px;line-height:1.8}
.reader-btn[aria-pressed="true"]{background:#fff;color:var(--navy-900);border-color:#fff}
.reader-tools{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));
  background:var(--navy-50);border-bottom:1px solid var(--navy-200)}
.tool-dot{width:36px;height:36px;padding:0;border-radius:50%;border:1px solid rgba(10,31,68,.25);background:var(--c);cursor:pointer}
.tool-dot[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--navy-700)}
.tool-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;
  border:1px solid var(--navy-300);background:#fff;color:var(--navy-800);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tool-btn svg{width:18px;height:18px;flex:none}
.tool-btn[aria-pressed="true"]{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.tool-dot:focus-visible,.tool-btn:focus-visible{outline:2px solid var(--navy-600);outline-offset:2px}
.tool-clear{margin-left:auto}
.tool-hint{flex:1 0 100%;margin:0;font-size:12px;color:var(--navy-600)}
.hl{color:inherit;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-sar{background:#ffd400}.hl-yesil{background:#4cd97b}.hl-pembe{background:#ff7eb6}
.hl-mavi{background:#5aa9ff}.hl-kirmizi{background:#ff6b6b}
.reader-body .reader-text{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.reader-body.marking{touch-action:none;cursor:crosshair}
.reader-body.marking .reader-text{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::highlight(on-sar){background:#ffd400}
::highlight(on-yesil){background:#4cd97b}
::highlight(on-pembe){background:#ff7eb6}
::highlight(on-mavi){background:#5aa9ff}
::highlight(on-kirmizi){background:#ff6b6b}
::highlight(on-sil){background:rgba(180,35,24,.22)}
.reader-btn:disabled{opacity:.4;cursor:default}
.hl[data-note]::after{content:"📝";font-size:.7em;margin-left:2px}
.reader-body:not(.marking) .hl{cursor:pointer}

/* Sadece işaretlileri göster */
.reader-text.summary{white-space:normal}
.sum-hint{margin:0;font-size:13px;color:var(--navy-600)}
.sum-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.sum-top .btn{flex:none}
.sum-actions{text-align:center}
.sum-empty{margin:24px 0;text-align:center;color:var(--navy-600)}
.sum-item{margin:0 0 12px;padding:12px 14px;border-radius:10px;border-left:6px solid;cursor:pointer}
.sum-sar{background:#ffeb70;border-color:#c9a800}
.sum-yesil{background:#a6ecbf;border-color:#2fa95a}
.sum-pembe{background:#ffc0dc;border-color:#d9548f}
.sum-mavi{background:#b3d6ff;border-color:#2f7fd9}
.sum-kirmizi{background:#ffb3b3;border-color:#d93a3a}
.sum-text{margin:0;white-space:pre-wrap;overflow-wrap:break-word}
.sum-note{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--navy-300);font-size:15px;color:var(--navy-700);white-space:pre-wrap;overflow-wrap:break-word}

/* Not penceresi */
.note-sheet{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;background:rgba(7,22,51,.45)}
.note-card{width:100%;max-width:760px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  box-shadow:0 -6px 24px rgba(7,22,51,.25)}
.note-quote{margin:0 0 10px;padding:8px 10px;font-size:14px;color:var(--navy-700);background:var(--navy-50);
  border-left:4px solid var(--navy-300);border-radius:6px;max-height:4.6em;overflow:hidden;overflow-wrap:break-word}
.note-card{max-height:100%;overflow-y:auto}
.note-card textarea{min-height:96px}
.note-card .form-actions{margin-top:10px}
@media (min-width:640px){.reader-title{font-size:20px}.reader-text{font-size:18px}}
@media (prefers-reduced-motion:reduce){.reader{animation:none}}

/* ===== Taşma / dolma önlemleri ===== */
html,body{max-width:100%}
h1,h2,h3,p,strong,span,label,a,button{overflow-wrap:break-word;word-break:normal}
.wrap,.card,.acc,.acc-inner,.panel,.sub-list,.page-row,.page-info,.field,.inline-form>*{min-width:0}
.acc-head{min-width:0}
.acc-title{flex:1 1 auto;min-width:0}
.acc-title>span{min-width:0;overflow-wrap:break-word}
.acc-title>span[aria-hidden]{flex:none}
.acc-meta{flex:0 0 auto}
.badge{max-width:100%}
.badge.solid{display:inline-block;max-width:100%;line-height:1.35;white-space:normal;overflow-wrap:break-word}
.btn{white-space:normal;text-align:center;max-width:100%;line-height:1.3}
.page-info strong{overflow-wrap:break-word}
.note{overflow-wrap:break-word;max-width:100%}
input[type=text],input[type=search],textarea{max-width:100%;min-width:0}
.acc{scroll-margin-top:76px}
.stats,.lead,.muted{overflow-wrap:break-word}

/* ===== Düzen onarımı: başlık sıkışmasını önle, butonlar ayrı satırda ===== */
.acc-title{align-items:flex-start}
.acc-title>span[aria-hidden]{margin-top:1px}
.acc-title>span:last-child{flex:1 1 auto;line-height:1.35}
.acc-head{align-items:center}

@media (max-width:639px){
  /* Konu başlığı tam genişlik, işlem butonları altında tek sırada */
  .acc-row{flex-direction:column}
  .acc-row .row-actions{max-width:none;flex-wrap:nowrap;justify-content:stretch;gap:4px;
    padding:6px 10px;background:var(--navy-50);border-top:1px solid var(--navy-100)}
  .acc-row .row-actions .icon-btn,
  .page-row .row-actions .icon-btn{flex:1 1 0;width:auto;max-width:none;height:42px;border-color:var(--navy-100);background:#fff}
  /* Sayfa satırı: ad üstte, butonlar altta */
  .page-row{flex-direction:column;align-items:stretch;padding:10px}
  .page-row .row-actions{max-width:none;flex-wrap:nowrap;gap:4px;padding:0;justify-content:stretch}
  .page-info{flex:none}
  .acc-meta{gap:8px}
}
@media (min-width:640px){
  .acc-row .row-actions{align-self:center;padding-right:10px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="konu.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 7-8 7z"/><path d="M12 14c0-3-2.5-5-7-5 0 4 2.5 5 7 5z"/></svg><span>Öğrenci Bahçesi</span></a>
  </div>
</header>
<main class="wrap">
  <h1 class="page-title">KONU ANLATIMI</h1>
  <p class="lead">Konuyu seç, sayfayı aç, çalışmaya başla.</p>
  <div class="searchbar">
    <input id="ara" type="search" placeholder="Konu, sayfa veya not içinde ara…" autocomplete="off" aria-label="Ara">
    <button id="hepsi" class="btn btn-ghost" type="button" hidden>Tümünü Aç</button>
  </div>
  <p id="istatistik" class="stats" aria-live="polite"></p>
  <div id="liste"></div>
  <noscript><p class="empty">Bu uygulama için JavaScript gerekli.</p></noscript>
</main>

<!-- Tam ekran okuyucu -->
<div id="okuyucu" class="reader" role="dialog" aria-modal="true" aria-labelledby="okBaslik" hidden>
  <header class="reader-bar">
    <div class="reader-titles">
      <span id="okKonu" class="reader-topic"></span>
      <h2 id="okBaslik" class="reader-title"></h2>
    </div>
    <div class="reader-actions">

      </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>

    <button id="okKalemKapat" class="tool-btn tool-clear" type="button">Kalemi bırak</button>
    <p class="tool-hint">Metnin üzerinde parmağını sürükleyerek işaretle. Kaydırmak veya not eklemek için kalemi bırak, işaretli yere dokun.</p>

<script>
/* Öğrenci Bahçesi — ortak yardımcılar (depolama, DOM, bildirim) */
(function (global) {
  'use strict';

  const KEY = 'dersKonulariYeni'; // eski verilerle uyumlu
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  const str = v => (v == null ? '' : String(v));
  const lc = s => str(s).toLocaleLowerCase('tr');

  /* Güvenli DOM üretici: metinler hep textContent ile yazılır (XSS yok) */
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid);
    return n;
  }

  /* Veriyi doğrula / eski formatı yeni formata taşı (id ekle) */
  function normalize(raw) {
    if (raw && !Array.isArray(raw) && Array.isArray(raw.konular)) raw = raw.konular;
    if (!Array.isArray(raw)) return { data: [], changed: raw != null };
    let changed = false;
    const seen = new Set();
    const newId = cur => {
      if (typeof cur === 'string' && cur && !seen.has(cur)) { seen.add(cur); return cur; }
      changed = true;
      let id; do { id = uid(); } while (seen.has(id));
      seen.add(id); return id;
    };
    const data = [];
    for (const k of raw) {
      if (!k || typeof k !== 'object') { changed = true; continue; }
      const sayfalar = [];
      for (const s of (Array.isArray(k.sayfalar) ? k.sayfalar : [])) {
        if (!s || typeof s !== 'object') { changed = true; continue; }
        sayfalar.push({
          id: newId(s.id),
          sayfaAdi: str(s.sayfaAdi).trim() || 'Adsız sayfa',
          icerik: str(s.icerik)
        });
      }
      data.push({ id: newId(k.id), konuAdi: str(k.konuAdi).trim() || 'Adsız konu', sayfalar });
    }
    return { data, changed };
  }

  function save(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }

  function load() {
    let raw = null;
    try {
      const t = localStorage.getItem(KEY);
      if (t) {
        try { raw = JSON.parse(t); }
        catch (e) { try { localStorage.setItem(KEY + '_bozuk_yedek', t); } catch (_) {} }
      }
    } catch (e) { /* depolama kapalı olabilir */ }
    const { data, changed } = normalize(raw);
    if (changed && raw != null) save(data);
    return data;
  }

  function usage() {
    try { return (KEY.length + (localStorage.getItem(KEY) || '').length) * 2; }
    catch (e) { return 0; }
  }

  function fmtBytes(b) {
    return b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
  }

  function onChange(cb) {
    window.addEventListener('storage', e => { if (e.key === KEY || e.key === null) cb(); });
    window.addEventListener('pageshow', e => { if (e.persisted) cb(); }); // geri tuşu / bfcache
  }

  let tt;
  function toast(msg, type) {
    let t = document.getElementById('toast');
    if (!t) { t = el('div', { id: 'toast', role: 'status', 'aria-live': 'polite' }); document.body.append(t); }
    t.textContent = msg;
    t.className = 'show ' + (type || 'ok');
    clearTimeout(tt);
    tt = setTimeout(() => { t.className = ''; }, type === 'err' ? 4500 : 2500);
  }

  global.OB = { KEY, uid, el, lc, load, save, normalize, usage, fmtBytes, onChange, toast };
})(window);

</script>
<script>
/* Öğrenci Bahçesi — ders notları sayfası */
(function () {
  'use strict';
  const { el, load, onChange, lc } = OB;
  const $ = id => document.getElementById(id);
  const listEl = $('liste'), qEl = $('ara'), statEl = $('istatistik'), allBtn = $('hepsi');

  let konular = [];
  let qRaw = '', query = '';
  const openT = new Set();
  const pageMap = new Map();   // sayfa id -> { p: sayfa, k: konu }
  const lcCache = new Map();   // id -> küçük harfli içerik (arama için, bir kez hesaplanır)

  const lowerOf = p => {
    let v = lcCache.get(p.id);
    if (v === undefined) { v = lc(p.icerik); lcCache.set(p.id, v); }
    return v;
  };
  const readMin = p => Math.max(1, Math.round(p.icerik.length / 1200));

  function filtrele() {
    if (!query) return konular.map(k => ({ k, pages: k.sayfalar }));
    const out = [];
    for (const k of konular) {
      if (lc(k.konuAdi).includes(query)) { out.push({ k, pages: k.sayfalar }); continue; }
      const pages = k.sayfalar.filter(p => lc(p.sayfaAdi).includes(query) || lowerOf(p).includes(query));
      if (pages.length) out.push({ k, pages });
    }
    return out;
  }

  function pageNode(p, k) {
    pageMap.set(p.id, { p, k });
    return el('button', { class: 'page-open', type: 'button', 'data-open-page': p.id },
      el('span', { class: 'badge solid', text: p.sayfaAdi }),
      el('span', { class: 'acc-meta' },
        el('span', { class: 'muted', text: '~' + readMin(p) + ' dk' }),
        el('span', { class: 'chev', 'aria-hidden': 'true' })));
  }

  function topicNode(k, pages) {
    const open = openT.has(k.id) || !!query;
    return el('section', { class: 'acc' + (open ? ' open' : ''), 'data-id': k.id },
      el('button', { class: 'acc-head', type: 'button', 'aria-expanded': String(open), 'data-toggle': 'topic' },
        el('span', { class: 'acc-title' }, el('span', { 'aria-hidden': 'true', text: '📖' }), el('span', { text: k.konuAdi })),
        el('span', { class: 'acc-meta' },
          el('span', { class: 'badge', text: pages.length + ' sayfa' }),
          el('span', { class: 'chev', 'aria-hidden': 'true' }))),
      el('div', { class: 'acc-body' },
        el('div', { class: 'acc-inner' },
          el('div', { class: 'sub-list' },
            pages.length ? pages.map(p => pageNode(p, k)) : el('p', { class: 'muted', text: 'Bu konuya henüz sayfa eklenmemiş.' })))));
  }

  function emptyBox(msg) {
    return el('div', { class: 'empty' }, el('p', { text: msg }));
  }

  function syncAllBtn() {
    const tops = listEl.querySelectorAll(':scope > .acc');
    allBtn.hidden = tops.length === 0;
    const allOpen = tops.length > 0 && [...tops].every(a => a.classList.contains('open'));
    allBtn.textContent = allOpen ? 'Tümünü Kapat' : 'Tümünü Aç';
  }

  function render() {
    pageMap.clear();
    const rows = filtrele();
    const frag = document.createDocumentFragment();
    if (!konular.length) frag.append(emptyBox('Henüz ders notu eklenmemiş.'));
    else if (!rows.length) frag.append(emptyBox('“' + qRaw + '” için sonuç bulunamadı.'));
    else for (const r of rows) frag.append(topicNode(r.k, r.pages));
    listEl.replaceChildren(frag);
    const sp = konular.reduce((n, k) => n + k.sayfalar.length, 0);
    statEl.textContent = konular.length + ' konu · ' + sp + ' sayfa' + (query ? ' · ' + rows.length + ' konuda eşleşme' : '');
    syncAllBtn();
  }

  function setOpen(acc, open) {
    acc.classList.toggle('open', open);
    const btn = acc.querySelector(':scope > .acc-head');
    btn.setAttribute('aria-expanded', String(open));
    open ? openT.add(acc.dataset.id) : openT.delete(acc.dataset.id);
  }

  // Tek olay dinleyici (event delegation)
  listEl.addEventListener('click', e => {
    const pg = e.target.closest('[data-open-page]');
    if (pg) return openReader(pg.dataset.openPage, pg);
    const btn = e.target.closest('[data-toggle]');
    if (!btn) return;
    const acc = btn.parentElement;
    setOpen(acc, !acc.classList.contains('open'));
    syncAllBtn();
  });

  /* ===== Tam ekran okuyucu + fosforlu kalem ===== */
  const rd = $('okuyucu'), rdBody = $('okGovde'), rdText = $('okMetin'), rdClose = $('okKapat');
  const rdPen = $('okKalem'), rdTools = $('okAraclar');
  const HKEY = 'dersKonulariIsaretler';           // işaretler ayrı anahtarda: notlara dokunmaz
  const COLORS = ['sar', 'yesil', 'pembe', 'mavi', 'kirmizi'];
  const rdSum = $('okOzet'), sheet = $('notKutu'), sheetText = $('notMetin');
  let rdFrom = null, curPage = null, marks = [], notes = [], tool = null, lastColor = 'sar', draw = null;
  let summary = false, sheetIdx = -1;
  // Not, işaretli bir aralığın içindeki bir konuma bağlıdır: [konum, metin]
  const noteOf = m => notes.find(n => n[0] >= m[0] && n[0] < m[1]);
  const inReaderState = () => !!(history.state && history.state.ob === 'reader');

  const hlLoad = () => { try { return JSON.parse(localStorage.getItem(HKEY)) || {}; } catch (_) { return {}; } };
  function hlSave() {
    const all = hlLoad();
    notes = notes.filter(n => marks.some(m => n[0] >= m[0] && n[0] < m[1]));  // işareti silinen notu da gider
    if (marks.length) all[curPage.id] = { len: curPage.icerik.length, m: marks, n: notes }; else delete all[curPage.id];
    try { localStorage.setItem(HKEY, JSON.stringify(all)); } catch (_) { OB.toast('İşaretler kaydedilemedi.', 'err'); }
  }

  // Metni, işaretli kısımları <mark> yaparak çizer (metin yine textContent ile yazılır)
  function paintSummary() {
    rdText.classList.add('summary');
    const frag = document.createDocumentFragment();
    const back = el('button', { class: 'btn btn-primary', type: 'button', 'data-back': '1', text: '← Konuya dön' });
    if (!marks.length) {
      frag.append(
        el('p', { class: 'sum-empty', text: 'Bu sayfada henüz işaretlediğin bir yer yok. Kalemi açıp metni işaretle.' }),
        el('div', { class: 'sum-actions' }, back));
    } else {
      frag.append(el('div', { class: 'sum-top' },
        el('p', { class: 'sum-hint', text: 'Sadece işaretlediklerin. Not eklemek için dokun.' }), back));
      marks.forEach((m, i) => {
        const n = noteOf(m);
        frag.append(el('div', { class: 'sum-item sum-' + m[2], 'data-i': i },
          el('p', { class: 'sum-text', text: curPage.icerik.slice(m[0], m[1]).trim() }),
          n ? el('p', { class: 'sum-note', text: '📝 ' + n[1] }) : null));
      });
    }
    rdText.replaceChildren(frag);
  }

  function paint() {
    if (summary) return paintSummary();
    rdText.classList.remove('summary');
    const text = curPage.icerik, frag = document.createDocumentFragment();
    let pos = 0;
    marks.forEach(([s, e, c], i) => {
      if (s > pos) frag.append(text.slice(pos, s));
      frag.append(el('mark', { class: 'hl hl-' + c, 'data-i': i, 'data-note': noteOf([s, e]) ? '1' : null, text: text.slice(s, e) }));
      pos = e;
    });
    if (pos < text.length) frag.append(text.slice(pos));
    const top = rdBody.scrollTop;
    rdText.replaceChildren(frag);
    rdBody.scrollTop = top;
  }

  // [başlangıç, bitiş, renk] aralığını ekler; c boşsa (silgi) o aralığı siler
  function applyMark(s, e, c) {
    const out = [];
    for (const m of marks) {
      if (m[1] <= s || m[0] >= e) { out.push(m); continue; }
      if (m[0] < s) out.push([m[0], s, m[2]]);
      if (m[1] > e) out.push([e, m[1], m[2]]);
    }
    if (c) out.push([s, e, c]);
    out.sort((x, y) => x[0] - y[0]);
    marks = out.reduce((acc, m) => {
      const l = acc[acc.length - 1];
      if (l && l[1] === m[0] && l[2] === m[2]) l[1] = m[1]; else acc.push(m.slice());
      return acc;
    }, []);
  }

  // Ekran noktası -> metindeki karakter sırası
  function offsetAt(x, y) {
    let node = null, off = 0;
    if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, y);
      if (p) { node = p.offsetNode; off = p.offset; }
    } else if (document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(x, y);
      if (r) { node = r.startContainer; off = r.startOffset; }
    }
    if (!node || !rdText.contains(node)) return null;
    const r = document.createRange();
    r.setStart(rdText, 0); r.setEnd(node, off);
    return r.toString().length;
  }
  function locate(abs) {
    const w = document.createTreeWalker(rdText, NodeFilter.SHOW_TEXT);
    let n, acc = 0;
    while ((n = w.nextNode())) {
      if (abs <= acc + n.data.length) return [n, abs - acc];
      acc += n.data.length;
    }
    return [rdText, rdText.childNodes.length];
  }

  // Çizerken canlı önizleme (destekleyen tarayıcılarda; yoksa parmak kalkınca işaretlenir)
  const canPreview = !!(window.CSS && CSS.highlights && window.Highlight);
  const clearPreview = () => { if (canPreview) ['sar', 'yesil', 'pembe', 'mavi', 'kirmizi', 'sil'].forEach(t => CSS.highlights.delete('on-' + t)); };
  function preview() {
    if (!canPreview || !draw) return;
    const s = Math.min(draw.a, draw.b), e = Math.max(draw.a, draw.b);
    if (s === e) return;
    const r = document.createRange();
    r.setStart(...locate(s)); r.setEnd(...locate(e));
    CSS.highlights.set('on-' + draw.tool, new Highlight(r));
  }

  function update() {
    const o = offsetAt(draw.x, draw.y);
    if (o != null) { draw.b = o; preview(); }
  }
  // Parmak alt/üst kenara yaklaşınca metin kendiliğinden kayar
  function loop() {
    if (!draw) return;
    const r = rdBody.getBoundingClientRect(), edge = 56;
    let dy = 0;
    if (draw.y < r.top + edge) dy = -Math.min(24, Math.ceil((r.top + edge - draw.y) / 5));
    else if (draw.y > r.bottom - edge) dy = Math.min(24, Math.ceil((draw.y - (r.bottom - edge)) / 5));
    if (dy) { rdBody.scrollTop += dy; update(); }
    draw.raf = requestAnimationFrame(loop);
  }
  function endDraw(commit) {
    if (!draw) return;
    cancelAnimationFrame(draw.raf);
    clearPreview();
    const { a, b, tool: t } = draw;
    draw = null;
    if (!commit) return;
    let s = Math.min(a, b), e = Math.max(a, b);
    if (s === e) {                                   // silgi ile işarete dokunmak onu siler
      if (t !== 'sil') return;
      const m = marks.find(x => s >= x[0] && s <= x[1]);
      if (!m) return;
      s = m[0]; e = m[1];
    }
    applyMark(s, e, t === 'sil' ? null : t);
    hlSave();
    paint();
  }

  rdBody.addEventListener('pointerdown', e => {
    if (!tool || e.button > 0) return;
    const o = offsetAt(e.clientX, e.clientY);
    if (o == null) return;
    e.preventDefault();
    draw = { a: o, b: o, x: e.clientX, y: e.clientY, tool };
    rdBody.setPointerCapture(e.pointerId);
    loop();
  });
  rdBody.addEventListener('pointermove', e => { if (draw) { draw.x = e.clientX; draw.y = e.clientY; update(); } });
  rdBody.addEventListener('pointerup', () => endDraw(true));
  rdBody.addEventListener('pointercancel', () => endDraw(false));
  // Metin seçme / kopyalama / sürükleme kapalı
  ['contextmenu', 'copy', 'cut', 'selectstart', 'dragstart'].forEach(t =>
    rdBody.addEventListener(t, e => e.preventDefault()));

  /* ===== Not ekleme ===== */
  function openSheet(i) {
    const m = marks[i];
    if (!m) return;
    sheetIdx = i;
    const q = curPage.icerik.slice(m[0], m[1]).trim();
    $('notAlinti').textContent = q.length > 140 ? q.slice(0, 140) + '…' : q;
    const n = noteOf(m);
    sheetText.value = n ? n[1] : '';
    $('notSil').hidden = !n;
    sheet.hidden = false;
    sheetText.focus({ preventScroll: true });
  }
  // Klavye açılınca pencereyi klavyenin üstüne taşı (görünür alan küçülür)
  const vv = window.visualViewport;
  function kbSync() {
    const kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
    sheet.style.bottom = kb + 'px';
  }
  if (vv) { vv.addEventListener('resize', kbSync); vv.addEventListener('scroll', kbSync); }
  sheetText.addEventListener('focus', () => { kbSync(); setTimeout(kbSync, 300); });
  sheetText.addEventListener('blur', () => setTimeout(kbSync, 100));
  function closeSheet() { sheet.hidden = true; sheetIdx = -1; sheet.style.bottom = ''; }
  function saveNote() {
    const m = marks[sheetIdx];
    if (!m) return closeSheet();
    const t = sheetText.value.trim();
    notes = notes.filter(n => !(n[0] >= m[0] && n[0] < m[1]));
    if (t) notes.push([m[0], t]);
    hlSave(); closeSheet(); paint();
    OB.toast(t ? 'Not kaydedildi.' : 'Not silindi.');
  }
  rdText.addEventListener('click', e => {
    if (e.target.closest('[data-back]')) return setSummary(false);
    if (tool) return;
    const t = e.target.closest('[data-i]');
    if (t) openSheet(+t.dataset.i);
  });
  $('notKaydet').addEventListener('click', saveNote);
  $('notSil').addEventListener('click', () => { sheetText.value = ''; saveNote(); });
  $('notKapat').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

  function setSummary(on) {
    summary = on;
    rdSum.setAttribute('aria-pressed', String(on));
    rdPen.disabled = on;
    if (on) setTool(null);
    paint();
    rdBody.scrollTop = 0;
  }
  rdSum.addEventListener('click', () => setSummary(!summary));

  function setTool(t) {
    tool = t;
    rdTools.hidden = !t;
    rdPen.setAttribute('aria-pressed', String(!!t));
    rdBody.classList.toggle('marking', !!t);
    if (!t) return;
    if (t !== 'sil') lastColor = t;
    rdTools.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
  }
  rdPen.addEventListener('click', () => setTool(tool ? null : lastColor));
  rdTools.addEventListener('click', e => {
    const b = e.target.closest('[data-tool]');
    if (b) return setTool(b.dataset.tool);
    if (e.target.closest('#okKalemKapat')) setTool(null);
  });

  function openReader(id, trigger) {
    const hit = pageMap.get(id);
    if (!hit) return;
    const p = hit.p, len = p.icerik.length, saved = hlLoad()[p.id];
    curPage = p;
    marks = saved && saved.len === len && Array.isArray(saved.m)
      ? saved.m.filter(m => Array.isArray(m) && m[0] >= 0 && m[1] > m[0] && m[1] <= len && COLORS.includes(m[2]))
               .sort((x, y) => x[0] - y[0])
      : [];
    notes = saved && saved.len === len && Array.isArray(saved.n)
      ? saved.n.filter(n => Array.isArray(n) && typeof n[0] === 'number' && typeof n[1] === 'string' && n[1])
      : [];
    $('okKonu').textContent = hit.k.konuAdi;
    $('okBaslik').textContent = p.sayfaAdi;
    closeSheet();
    summary = false;
    rdSum.setAttribute('aria-pressed', 'false');
    rdPen.disabled = false;
    paint();
    setTool(null);
    rdFrom = trigger;
    rd.hidden = false;
    rdBody.scrollTop = 0;
    document.body.classList.add('reader-open');
    history.pushState({ ob: 'reader' }, '');   // telefonun geri tuşu okuyucuyu kapatsın
    rdClose.focus({ preventScroll: true });
  }

  function hideReader() {
    if (rd.hidden) return;
    endDraw(false);
    setTool(null);
    closeSheet();
    rd.hidden = true;
    curPage = null;
    document.body.classList.remove('reader-open');
    if (rdFrom && rdFrom.isConnected) rdFrom.focus({ preventScroll: true });
    rdFrom = null;
  }

  function closeReader() { inReaderState() ? history.back() : hideReader(); }

  window.addEventListener('popstate', hideReader);
  rdClose.addEventListener('click', closeReader);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || rd.hidden) return;
    if (!sheet.hidden) closeSheet(); else closeReader();
  });

  allBtn.addEventListener('click', () => {
    const tops = [...listEl.querySelectorAll(':scope > .acc')];
    const allOpen = tops.every(a => a.classList.contains('open'));
    if (allOpen) {
      listEl.querySelectorAll('.acc.open').forEach(a => setOpen(a, false));
    } else {
      tops.forEach(a => setOpen(a, true));
    }
    syncAllBtn();
  });

  let timer;
  qEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { qRaw = qEl.value.trim(); query = lc(qRaw); render(); }, 180);
  });

  function yenile() { konular = load(); lcCache.clear(); render(); }
  onChange(yenile);
  yenile();
})();

</script>
</body>
</html>
