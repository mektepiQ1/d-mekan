<style>
:root{--navy:#2c3e66;--navy-d:#1a2744;--text:#2d3748;--muted:#718096;--line:#e2e8f0;--soft:#f7fafc;--danger:#c53030;--grad:linear-gradient(135deg,var(--navy),var(--navy-d))}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#f5f7fa,#c3cfe2) fixed;min-height:100vh;min-height:100dvh;color:var(--text);overflow-wrap:anywhere;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:100;padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.95);box-shadow:0 2px 20px rgba(0,0,0,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.topbar-in{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:12px}
.logo{flex:1;min-width:0;padding:16px 0;font-size:1.4em;color:var(--navy)}
.main{max-width:1280px;margin:0 auto;padding:32px 24px}
.main.narrow{max-width:900px;padding-top:calc(24px + env(safe-area-inset-top))}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:2em;color:var(--navy);margin-bottom:8px}
.header p{color:var(--muted)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.card{background:rgba(255,255,255,.98);border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08);margin-bottom:32px}
.card h2{margin-bottom:24px;font-size:1.5em;border-left:3px solid var(--navy);padding-left:16px}
.card>p{color:#4a5568;margin-bottom:12px}
.form-card{max-width:480px;margin:0 auto 32px;text-align:center}
.form-card h2{border:0;padding:0;color:var(--navy);margin-bottom:8px}

input,select{width:100%;padding:12px 16px;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px}

.sm{display:inline-block;width:auto;min-height:36px;padding:8px 16px;font-size:13px;font-weight:500;text-decoration:none;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:20px;cursor:pointer}

button,.sm{min-height:44px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px}
input,select{min-height:48px}.ah{min-height:52px}
@media(min-width:769px) and (max-width:1100px){.main{padding:28px 20px}.card{padding:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topbar,.drawer,.scrim,.navbar,.out,button{display:none!important}body{background:#fff}}
/* Bağlantı ağacı */
.tbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tree,.tree ul{list-style:none}
.tree ul{margin:8px 0 0 14px;padding-left:12px;border-left:2px dashed var(--line)}
.tnode{margin:8px 0}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--soft);border-radius:12px;border-left:3px solid var(--navy)}

.tg{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0;width:auto;min-height:40px;padding:6px 4px;background:none;color:var(--navy);border-radius:8px;font-size:15px;font-weight:600;text-align:left}

.cnt{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.tnode>ul{display:none}
.tnode.open>ul{display:block}
.ltxt{flex:1 1 220px;min-width:0}
.tact{display:flex;gap:6px;flex-wrap:wrap}
.tree .sm,.tbar .sm{min-height:38px;padding:6px 12px;font-size:12px}
.tree .mut{margin:6px 0}
.fg label input{margin-top:8px}
@media(max-width:600px){.tree ul{margin-left:6px;padding-left:8px}.tact{width:100%}.tact .sm{flex:1 1 auto;text-align:center}.tbar .sm{flex:1 1 auto}}
body:not(.authed) .topbar,body:not(.authed) #app,body:not(.authed) .drawer,body:not(.authed) .scrim{display:none}body.authed #gate{display:none}
#gerr:empty{display:none}
/* Yan çekmece menü */
.burger{flex:none;width:44px;padding:0;font-size:22px;line-height:1}
.scrim{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}

.drawer{position:fixed;top:0;bottom:0;left:0;z-index:160;width:min(300px,86vw);display:flex;flex-direction:column;background:#fff;box-shadow:8px 0 30px rgba(0,0,0,.18);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-y:auto;transform:translateX(-102%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.drawer.open{transform:none;visibility:visible;transition:transform .25s ease}
.drawer-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:var(--grad);color:#fff}
.drawer-h strong{font-size:17px}
.drawer-h button{width:44px;padding:0;background:rgba(255,255,255,.16);font-size:18px}
.dl{list-style:none;padding:12px}
.dl a{display:flex;align-items:center;gap:12px;min-height:48px;padding:12px 16px;margin-bottom:6px;border-radius:12px;border-left:4px solid transparent;color:#4a5568;font-weight:600;font-size:15px;text-decoration:none}
.dl a:hover{background:rgba(44,62,102,.06);color:var(--navy)}
.dl a.active{background:rgba(44,62,102,.1);border-left-color:var(--navy);color:var(--navy)}

</style>

<body>
<header class="topbar">
  <div class="topbar-in">
    <button class="burger" id="burger" type="button" aria-label="Menüyü aç" aria-expanded="false" aria-controls="drawer">☰</button>
    <h2 class="logo">Öğrenci Bahçesi</h2>
    <button class="sm" id="logout" type="button">Çıkış yap</button>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Ana menü">
  <div class="drawer-h"><strong>Menü</strong><button id="dclose" type="button" aria-label="Menüyü kapat">✕</button></div>
  <nav aria-label="Ana menü">
    <ul class="dl">
      <li><a href="#classes"><span class="ic" aria-hidden="true">🗂️</span>Sınıf Çekmecesi</a></li>
      <li><a href="#students"><span class="ic" aria-hidden="true">🎓</span>Öğrenciler</a></li>
      <li><a href="#links"><span class="ic" aria-hidden="true">🔗</span>Bağlantılar</a></li>
      <li><a href="#options"><span class="ic" aria-hidden="true">⚙️</span>Seçenekler</a></li>
    </ul>
  </nav>
</aside>
<main class="main narrow" id="gate">
  <div class="header"><h1>Yönetici girişi</h1><p>Öğrenci Bahçesi</p></div>
  <div class="card form-card"><h2>Giriş yap</h2><p class="sub-t">Yetkili hesabınızla oturum açın</p>
    <div id="gerr"></div>
    <form id="gform"><div class="fg"><label>E-posta</label><input name="e" type="email" required autocomplete="username"></div>
      <div class="fg"><label>Parola</label><input name="p" type="password" required autocomplete="current-password"></div>
      <button>Giriş yap</button></form></div>
</main>

<main class="main" id="app"></main>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mc" id="mc"></div></div>

<script type="module">
'use strict';

import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { ref, get, set, remove } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { config, db, auth, EMAIL_DOMAIN, USER_RE, ukey, errText } from "./firebase.js";
if (window.top !== window.self) { document.body.textContent = ''; throw new Error('Çerçeve içinde çalışamaz'); }
let startApp;
/* Firebase Realtime Database katmanı */
const DB = (() => {
  return {
    async all(store) {
      const snap = await get(ref(db, store));
      if (!snap.exists()) return [];
      const val = snap.val();
      if (Array.isArray(val)) return val.filter(Boolean);
      return Object.entries(val).map(([k, v]) => ({ ...v, _fbKey: k }));
    },
    async get(store, id) {
      const snap = await get(ref(db, `${store}/${id}`));
      return snap.exists() ? snap.val() : null;
    },
    async put(store, item) {
      let key = item._fbKey;
      if (!key) { item.id = item.id || Date.now(); key = `item_${item.id}`; }
      await set(ref(db, `${store}/${key}`), { ...item, _fbKey: key });
      return item;
    },
    async del(store, idOrKey) {
      const items = await this.all(store);
      const found = items.find(x => x.id === idOrKey || x._fbKey === idOrKey);
      if (found && found._fbKey) {
        await remove(ref(db, `${store}/${found._fbKey}`));
      } else {
        await remove(ref(db, `${store}/${idOrKey}`));
      }
    },
    async load() {
      const [classes, lessons, users, links, options] = await Promise.all(
        ['classes', 'lessons', 'users', 'links', 'options'].map(s => this.all(s)));
      let drawers = [], drawersErr = false;
      try { drawers = await this.all('drawers'); } catch { drawersErr = true; }
      return { classes, lessons, users, links, options, drawers, drawersErr };
    },
    async createStudent(username, password) {
      // Yönetici oturumu bozulmasın diye ikinci bir Firebase uygulaması kullanılır.
      const rnd = [...crypto.getRandomValues(new Uint8Array(4))].map(b => b.toString(16).padStart(2, '0')).join('');
      const email = `${username.toLowerCase()}.${rnd}@${EMAIL_DOMAIN}`;
      const sec = initializeApp(config, 'sec');
      try {
        const c = await createUserWithEmailAndPassword(getAuth(sec), email, password);
        await signOut(getAuth(sec));
        return { uid: c.user.uid, email };
      } finally { await deleteApp(sec); }
    }
  };
})();

/* Yardımcılar */
const U = {
  esc: s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';'),
  now: () => new Date().toISOString(),
  fd(iso, withTime = true) {
    const d = new Date(iso), p = n => String(n).padStart(2, '0');
    const date = `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
    return withTime ? `${date} ${p(d.getHours())}:${p(d.getMinutes())}` : date;
  },
  okUrl(u) {
    try { return /^https?:$/.test(new URL(u).protocol); } catch { return false; }
  }
};

(() => {
  const { esc, now, fd, okUrl } = U;
  const WRONG = 'Parola hatalı. Silme işlemi gerçekleştirilemedi.';
  const app = document.getElementById('app');
  const modalEl = document.getElementById('modal');
  const modalBox = document.getElementById('mc');
  let D, flash = null;
  const collapsed = new Set();
  const openF = new Set();           // açık klasörler (yeniden çizimlerde korunur)
  let migrating = false;

  /* Bağlantı ağacı yardımcıları */
  const isFolder = x => x.type === 'folder';
  const parentOf = x => x.parent_id || 0;
  let seq = 0;
  const nid = () => (seq = Math.max(seq + 1, Date.now()));
  const byId = id => D.links.find(x => x.id === id);
  const pathOf = pid => {               // "Ana › Alt › Daha alt" (eski öğrenci sayfası için uyumluluk)
    const names = []; let cur = pid, n = 0;
    while (cur && n++ < 200) { const f = byId(cur); if (!f) break; names.unshift(String(f.name)); cur = parentOf(f); }
    return names.join(' › ') || 'Genel';
  };
  const descendants = id => {
    const out = [], q = [id], seen = new Set([id]);
    while (q.length) {
      const p = q.shift();
      D.links.forEach(x => {
        if (parentOf(x) === p && !seen.has(x.id)) { seen.add(x.id); out.push(x); if (isFolder(x)) q.push(x.id); }
      });
    }
    return out;
  };
  const linkKey = x => x._fbKey || `item_${x.id}`;
  const drawerOf = itemId => D.drawers.find(d => (d.items || []).some(i => i.id === itemId));
  const sameName = (a, b) => String(a).trim().toLocaleLowerCase('tr') === String(b).trim().toLocaleLowerCase('tr');
  const folderField = (label, name, value = '', ph = '') =>
    `<div class="fg"><label>${label}<input name="${name}" required maxlength="100" autocomplete="off" value="${esc(value)}" placeholder="${ph}"></label></div>`;
  const urlField = (value = '') =>
    `<div class="fg"><label>Bağlantı URL<input name="u" type="url" required value="${esc(value)}" placeholder="https://..."></label></div>`;

  async function migrateLegacy() {      // eski düz "category" kayıtlarını klasör yapısına çevirir
    const legacy = D.links.filter(x => !x.type);
    const map = new Map();
    D.links.filter(x => isFolder(x) && !parentOf(x)).forEach(f => map.set(String(f.name), f.id));
    for (const l of legacy) {
      const c = String(l.category || '').trim() || 'Genel';
      if (!map.has(c)) {
        const id = nid();
        await DB.put('links', { id, type: 'folder', name: c, parent_id: 0, created_at: now() });
        map.set(c, id);
      }
      await DB.put('links', { ...l, type: 'link', parent_id: map.get(c), category: c });
    }
    return legacy.length > 0;
  }

  const msg = (type, text) => { flash = { type, text }; return render(); };
  const alertHtml = () => {
    const f = flash; flash = null;
    return f ? `<div class="alert ${f.type}" role="alert">${esc(f.text)}</div>` : '';
  };
  const head = (h, s) => `<div class="header"><h1>${h}</h1><p>${s}</p></div>`;
  const PW_FIELD = '<div class="fg"><label>Yönetici parolanız (doğrulama):</label><input type="password" name="pw" required autocomplete="current-password" placeholder="Parolanızı giriniz"></div>';
  const empty = (a, b) => `<div class="empty"><p>${a}</p><p>${b}</p></div>`;

  const views = {
    classes() {
      const list = [...D.classes].sort((a, b) => b.id - a.id);
      const drawers = [...D.drawers].sort((a, b) => a.id - b.id);
      const classCards = list.length ? list.map(c => {
        const lessons = D.lessons.filter(l => l.class_id === c.id).sort((a, b) => b.id - a.id);
        return `<div class="item">
          <div class="row"><strong class="nm">${esc(c.class_name)}</strong><button class="sm del" data-a="delClass" data-id="${c.id}">Sil</button></div>
          <small>Eklenme: ${fd(c.created_at)}</small>
          <div class="sub"><div class="t">Bu Sınıfa Ait Dersler:</div>
            ${lessons.length ? lessons.map(l => `<div class="les"><span>${esc(l.lesson_name)}</span>
              <button class="sm" data-a="lessonLink" data-id="${l.id}">Link Ekle</button></div>`).join('') : '<div class="mut">Henüz ders eklenmemiş.</div>'}
            <form class="inl" data-f="lesson" data-id="${c.id}">
              <input name="n" required maxlength="100" aria-label="Ders adı" placeholder="Ders adı"><button>Ders Ekle</button></form>
          </div></div>`;
      }).join('') : empty('Henüz hiç sınıf eklenmemiş.', 'Yukarıdaki formdan ekleyebilirsiniz.');
      const drawerCards = drawers.length ? drawers.map(dr => {
        const items = dr.items || [];
        return `<div class="item">
          <div class="row"><strong class="nm">🗂️ ${esc(dr.name)}</strong>
            <div class="btns"><button class="sm" data-a="renDrawer" data-id="${dr.id}">Yeniden adlandır</button>
              <button class="sm del" data-a="delDrawer" data-id="${dr.id}">Sil</button></div></div>
          <small>${items.length} bağlantı</small>
          <div class="sub">
            ${items.length ? items.map(i => `<div class="les"><span>${esc(i.name)}<small>${esc(i.url)}</small></span>
              <div class="btns">${okUrl(i.url) ? `<a class="sm" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">Git</a>` : ''}
                <button class="sm" data-a="editDItem" data-id="${i.id}">Düzenle</button>
                <button class="sm del" data-a="delDItem" data-id="${i.id}">Sil</button></div></div>`).join('')
              : '<div class="mut">Bu çekmecede henüz bağlantı yok.</div>'}
            <form class="inl" data-f="ditem" data-id="${dr.id}">
              <input name="n" required maxlength="100" aria-label="Bağlantı adı" placeholder="Bağlantı adı" autocomplete="off">
              <input name="u" type="url" required aria-label="Bağlantı URL" placeholder="https://..." autocomplete="off">
              <button>Bağlantı Ekle</button></form>
          </div></div>`;
      }).join('') : empty('Henüz çekmece eklenmemiş.', 'Yukarıdaki formdan ilk çekmeceyi ekleyebilirsiniz.');
      return head('Sınıf Çekmecesi', 'Sınıflar, dersler ve öğrenci çekmeceleri') + alertHtml() + `
        <div class="dash">
          <div class="card"><h2>Sınıf Oluştur</h2>
            <form data-f="class"><div class="fg"><label>Sınıf Adı</label>
              <input name="n" required maxlength="100" placeholder="Örn: TYT Lise, KPSS Lisans, 10-A">
              <div class="hint">Öğrenci profilini doldurunca otomatik atanır.</div></div>
              <button>Sınıf Ekle</button></form></div>
          <div class="card"><h2>Bilgi</h2>
            <p>Öğrenciler ogrenci.html üzerinden giriş yapar. Aşağıda sınıfları ve dersleri, en altta ise öğrencilerin ogrenci.html sayfasında göreceği çekmeceleri ve bağlantıları yönetebilirsiniz.</p>
            <p>Güvenlik: 30 dakika işlem yapılmazsa oturum otomatik kapanır; silme işlemleri parola doğrulaması ister.</p></div>
        </div>
        <div class="card"><h2>Tüm Sınıflar</h2>${classCards}</div>
        <div class="card"><h2>Öğrenci Çekmeceleri</h2>
          <p>Burada oluşturduğunuz çekmeceler ve içindeki bağlantılar (ad + URL) öğrencilerin ogrenci.html sayfasında görünür.</p>` +
          (D.drawersErr ? '<div class="alert er" role="alert">Çekmeceler okunamadı. Firebase Database Rules içine "drawers" düğümü için izin eklenmeli.</div>' : '') + `
          <form class="inl" data-f="drawer" style="margin:0 0 20px">
            <input name="n" required maxlength="60" autocomplete="off" aria-label="Çekmece adı" placeholder="Yeni çekmece adı (örn: Ders Programı)"><button>Çekmece Ekle</button></form>
          ${drawerCards}</div>`;
    },

    students() {
      const list = [...D.users].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
      const order = type => D.options.filter(o => o.type === type).sort((a, b) => a.id - b.id).map(o => o.label);
      const exams = order('exam'), edus = order('edu');
      const rank = (arr, v) => { const i = arr.indexOf(v); return i < 0 ? arr.length : i; };
      const byKey = new Map();
      list.forEach(u => {
        const done = !!(u.exam && u.education_status);
        const key = done ? JSON.stringify([u.exam, u.education_status]) : 'new';
        if (!byKey.has(key)) byKey.set(key, { key, done, exam: u.exam, edu: u.education_status, users: [] });
        byKey.get(key).users.push(u);
      });
      const groups = [...byKey.values()].sort((a, b) =>
        a.done - b.done ||
        rank(exams, a.exam) - rank(exams, b.exam) || String(a.exam).localeCompare(String(b.exam), 'tr') ||
        rank(edus, a.edu) - rank(edus, b.edu) || String(a.edu).localeCompare(String(b.edu), 'tr'));
      return head('Öğrenci Yönetimi', 'Öğrenci hesapları ve giriş bilgileri') + `
        <div class="card"><h2>Yeni Öğrenci Ekle</h2>${alertHtml()}
          <form data-f="student">
            <div class="fg"><label>Kullanıcı Adı</label><input name="un" required maxlength="30" autocomplete="off" autocapitalize="none"></div>
            <div class="fg"><label>Şifre</label><input name="pw" required minlength="8" maxlength="60" autocomplete="new-password"><div class="hint">En az 8 karakter.</div></div>
            <button>Öğrenci Ekle</button></form></div>
        <div class="card"><h2>Kayıtlı Öğrenciler</h2>` +
        (groups.length ? groups.map(g => `<div class="acc stu${collapsed.has(g.key) ? '' : ' open'}">
          <button class="ah" data-a="toggleGroup" data-k="${esc(g.key)}"><span>${g.done ? `${esc(g.exam)} · ${esc(g.edu)}` : 'Yeni Kayıt'} (${g.users.length} öğrenci)</span><span>▼</span></button>
          <div class="ac">${g.users.map(u => {
            const c = D.classes.find(x => x.id === u.class_id);
            const noClass = g.done ? 'Sınıf atanmamış' : 'Profil bekleniyor';
            return `<div class="item"><div class="row"><div>
              <strong class="nm">${esc(u.username)}</strong>
              <small>Kayıt Tarihi: ${fd(u.created_at)}</small>
              <small>${c ? `Atanan Sınıf: <b>${esc(c.class_name)}</b>` : noClass}</small></div>
              <div class="btns"><button class="sm" data-a="creds" data-id="${u.id}">Şifre Sıfırla</button>
                <button class="sm" data-a="assign" data-id="${u.id}">Sınıf Seç</button>
                <button class="sm del" data-a="delUser" data-id="${u.id}">Sil</button></div></div></div>`;
          }).join('')}</div></div>`).join('')
          : empty('Henüz hiç öğrenci eklenmemiş.', 'Yukarıdaki formdan ekleyebilirsiniz.')) + '</div>';
    },

    links() {
      const ids = new Set(D.links.map(x => x.id)), kids = new Map();
      D.links.forEach(x => {
        let p = parentOf(x); if (p && !ids.has(p)) p = 0;      // sahipsiz kayıt kök düzeye çıkar
        if (!kids.has(p)) kids.set(p, []);
        kids.get(p).push(x);
      });
      const kidsOf = p => (kids.get(p) || []).slice().sort((a, b) =>
        isFolder(b) - isFolder(a) ||
        (isFolder(a) ? String(a.name).localeCompare(String(b.name), 'tr') : a.id - b.id));
      const stats = p => kidsOf(p).reduce((s, x) => {
        if (isFolder(x)) { const t = stats(x.id); s.f += 1 + t.f; s.l += t.l; } else s.l++;
        return s;
      }, { f: 0, l: 0 });
      const list = p => kidsOf(p).map(node).join('');
      const node = x => {
        if (!isFolder(x)) {
          return `<li class="tnode"><div class="trow lk"><div class="ltxt"><strong>🔗 ${esc(x.button_text)}</strong><small>${esc(x.link_url)}</small></div>
            <div class="tact">${okUrl(x.link_url) ? `<a class="sm" href="${esc(x.link_url)}" target="_blank" rel="noopener noreferrer">Git</a>` : ''}
              <button class="sm" type="button" data-a="editLink" data-id="${x.id}">Düzenle</button>
              <button class="sm del" type="button" data-a="delLink" data-id="${x.id}">Sil</button></div></div></li>`;
        }
        const s = stats(x.id), open = openF.has(x.id), inner = list(x.id);
        return `<li class="tnode${open ? ' open' : ''}" data-n="${x.id}"><div class="trow">
          <button class="tg" type="button" data-a="tfold" data-id="${x.id}" aria-expanded="${open}"><span class="ch" aria-hidden="true">▶</span>
            <span class="tt">📁 ${esc(x.name)} <span class="cnt">${s.f} alt kategori · ${s.l} bağlantı</span></span></button>
          <div class="tact">
            <button class="sm" type="button" data-a="addFolder" data-id="${x.id}">+ Alt kategori</button>
            <button class="sm" type="button" data-a="addLink" data-id="${x.id}">+ Bağlantı</button>
            <button class="sm" type="button" data-a="renFolder" data-id="${x.id}">Yeniden adlandır</button>
            <button class="sm del" type="button" data-a="delFolder" data-id="${x.id}">Sil</button></div></div>
          <ul>${inner || '<li class="mut">Bu kategori boş. Alt kategori veya bağlantı ekleyin.</li>'}</ul></li>`;
      };
      return head('Bağlantı Yönetimi', 'İç içe kategoriler ve bağlantılar') + `
        <div class="card"><h2>Bağlantı Ağacı</h2>${alertHtml()}
          <div class="tbar">
            <button class="sm" type="button" data-a="addFolder" data-id="0">+ Ana kategori</button>
            <button class="sm" type="button" data-a="addLink" data-id="0">+ Ana düzeye bağlantı</button>
            <button class="sm" type="button" data-a="expandAll">Tümünü aç</button>
            <button class="sm" type="button" data-a="collapseAll">Tümünü kapat</button></div>` +
        (D.links.length ? `<ul class="tree">${list(0)}</ul>`
          : empty('Henüz kategori veya bağlantı eklenmemiş.', 'Yukarıdaki düğmeyle ilk ana kategoriyi ekleyebilirsiniz.')) + '</div>';
    },

    options() {
      const section = (type, title, placeholder) => {
        const list = D.options.filter(o => o.type === type).sort((a, b) => a.id - b.id);
        return `<div class="card"><h2>${title}</h2>
          <form class="inl" data-f="option" data-type="${type}" style="margin:0 0 20px">
            <input name="n" required maxlength="60" autocomplete="off" placeholder="${placeholder}"><button>Ekle</button></form>` +
          (list.length ? list.map(o => `<div class="item"><div class="row"><strong class="nm">${esc(o.label)}</strong>
            <button class="sm del" data-a="delOption" data-id="${o.id}">Sil</button></div></div>`).join('')
            : empty('Seçenek yok.', '')) + '</div>';
      };
      return head('Seçenekler', 'Sınav ve öğrenim düzeyi listeleri') + alertHtml() +
        section('exam', 'Sınav Türleri', 'Örn: TYT, AYT...') +
        section('edu', 'Öğrenim Düzeyleri', 'Örn: Lise, Lisans...');
    }
  };

  async function render() {
    try { D = await DB.load(); } catch (e) { app.innerHTML = '<div class="alert er" role="alert">' + esc(errText(e)) + '</div>'; return; }
    let page = location.hash.slice(1);
    if (!views[page]) page = 'classes';
    if (page === 'links' && !migrating && D.links.some(x => !x.type)) {
      migrating = true;
      try { if (await migrateLegacy()) D = await DB.load(); }
      catch (e) { flash = { type: 'er', text: 'Eski bağlantılar yeni yapıya aktarılamadı: ' + errText(e) }; }
      finally { migrating = false; }
    }
    app.innerHTML = views[page]();
    document.querySelectorAll('.dl a').forEach(a => { const on = a.getAttribute('href') === '#' + page; a.classList.toggle('active', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
    a11y();
  }

  const closeModal = () => modalEl.classList.remove('open');
  function modal(title, text, fields, button, onSubmit) {
    modalBox.innerHTML = `<h3>${title}</h3><p>${text}</p><form>${fields}<button>${button}</button><button type="button" class="gray" data-a="close">İptal</button></form>`;
    modalEl.classList.add('open');
    modalBox.querySelector('input,select,button')?.focus();
    modalBox.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const data = new FormData(e.target);
      closeModal();
      try { await onSubmit(data); } catch (err) { msg('er', errText(err)); }
    };
  }
  function confirmDelete(title, name, text, button, run, note = '') {
    modal(title, `<strong>${esc(name)}</strong> ${text}${note}`, PW_FIELD, button, async f => {
      try { await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, f.get('pw'))); }
      catch { return msg('er', WRONG); }
      msg('ok', await run());
    });
  }

  const forms = {
    async class(d) {
      const n = d.get('n').trim();
      if (!n) return msg('er', 'Geçerli bir sınıf adı giriniz.');
      await DB.put('classes', { class_name: n, created_at: now() });
      msg('ok', 'Sınıf başarıyla eklendi.');
    },
    async lesson(d, f) {
      const n = d.get('n').trim();
      if (!n) return;
      await DB.put('lessons', { class_id: +f.dataset.id, lesson_name: n, link_url: '', created_at: now() });
      msg('ok', 'Ders başarıyla eklendi.');
    },
    async drawer(d) {
      const n = d.get('n').trim();
      if (!n) return msg('er', 'Geçerli bir çekmece adı giriniz.');
      if (D.drawers.some(x => sameName(x.name, n))) return msg('er', 'Aynı adlı bir çekmece zaten var.');
      await DB.put('drawers', { id: nid(), name: n, items: [], created_at: now() });
      msg('ok', 'Çekmece eklendi.');
    },
    async ditem(d, f) {
      const dr = D.drawers.find(x => x.id === +f.dataset.id);
      const n = d.get('n').trim(), u = d.get('u').trim();
      if (!dr) return;
      if (!n || !okUrl(u)) return msg('er', 'Ad ve geçerli bir http(s) adresi giriniz.');
      await DB.put('drawers', { ...dr, items: [...(dr.items || []), { id: nid(), name: n, url: u }] });
      msg('ok', 'Bağlantı çekmeceye eklendi.');
    },
    async student(d) {
      const username = d.get('un').trim(), pw = d.get('pw');
      if (!USER_RE.test(username) || pw.length < 8)
        return msg('er', 'Kullanıcı adı 3-30 karakter (harf, rakam, . _ -), şifre en az 8 karakter olmalı.');
      if ((await get(ref(db, `usernames/${ukey(username)}`))).exists())
        return msg('er', 'Bu kullanıcı adı zaten kullanılıyor.');
      const { uid, email } = await DB.createStudent(username, pw);
      await DB.put('users', { id: uid, _fbKey: uid, username, exam: null, education_status: null, class_id: null, created_at: now() });
      await set(ref(db, `usernames/${ukey(username)}`), { email, uid });
      msg('ok', 'Öğrenci başarıyla eklendi.');
    },
    async option(d, f) {
      const type = f.dataset.type, label = d.get('n').trim();
      if (!label) return;
      await DB.put('options', { type, label, created_at: now() });
      msg('ok', 'Seçenek eklendi.');
    }
  };

  const actions = {
    close: closeModal,
    toggle: b => b.parentElement.classList.toggle('open'),
    toggleGroup(b) {
      const k = b.dataset.k;
      collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k);
      b.parentElement.classList.toggle('open');
    },
    delClass(id) {
      const c = D.classes.find(x => x.id === id);
      confirmDelete('Sınıf Silme', c.class_name, 'silinsin mi?', 'Sil', async () => {
        await Promise.all(D.lessons.filter(l => l.class_id === id).map(l => remove(ref(db, `lessons/${l._fbKey}`))));
        await DB.del('classes', id);
        return 'Silindi.';
      });
    },
    lessonLink(id) {
      const l = D.lessons.find(x => x.id === id);
      modal('Link Düzenle', esc(l.lesson_name), `<input type="url" name="u" value="${esc(l.link_url)}" required placeholder="https://...">`, 'Kaydet', async f => {
        const u = f.get('u').trim();
        if (!okUrl(u)) return msg('er', 'Yalnızca http(s) adresleri kabul edilir.');
        await DB.put('lessons', { ...l, link_url: u });
        msg('ok', 'Güncellendi.');
      });
    },
    assign(id) {
      const u = D.users.find(x => x.id === id);
      modal('Sınıf Ata', esc(u.username), `<select name="c">${D.classes.map(c => `<option value="${c.id}">${esc(c.class_name)}</option>`).join('')}</select>`, 'Ata', async f => {
        await DB.put('users', { ...u, class_id: +f.get('c') });
        msg('ok', 'Atandı.');
      });
    },
    creds(id) {
      const u = D.users.find(x => x.id === id);
      modal('Şifre Sıfırla', esc(u.username), '<input name="pw" type="password" minlength="8" maxlength="60" required autocomplete="new-password" placeholder="Yeni şifre (en az 8 karakter)">', 'Şifreyi sıfırla', async f => {
        const { uid, email } = await DB.createStudent(u.username, f.get('pw'));
        await DB.put('users', { ...u, id: uid, _fbKey: uid });
        await set(ref(db, `usernames/${ukey(u.username)}`), { email, uid });
        await remove(ref(db, `users/${u.id}`));
        msg('ok', 'Şifre sıfırlandı. Öğrenci yeni şifreyle giriş yapabilir.');
      });
    },
    delUser(id) {
      const u = D.users.find(x => x.id === id);
      confirmDelete('Öğrenci Sil', u.username, 'silinsin mi?', 'Sil', async () => { await DB.del('users', id); await remove(ref(db, `usernames/${ukey(u.username)}`)); return 'Silindi.'; });
    },
    delOption(id) {
      const o = D.options.find(x => x.id === id);
      confirmDelete('Seçenek Sil', o.label, 'silinsin mi?', 'Sil', async () => { await DB.del('options', id); return 'Silindi.'; });
    },
    renDrawer(id) {
      const dr = D.drawers.find(x => x.id === id);
      modal('Çekmeceyi Yeniden Adlandır', esc(dr.name), folderField('Yeni ad', 'n', dr.name), 'Kaydet', async f => {
        const n = f.get('n').trim();
        if (!n) return msg('er', 'Geçerli bir çekmece adı giriniz.');
        if (D.drawers.some(x => x.id !== id && sameName(x.name, n))) return msg('er', 'Aynı adlı bir çekmece zaten var.');
        await DB.put('drawers', { ...dr, name: n });
        msg('ok', 'Çekmece adı güncellendi.');
      });
    },
    delDrawer(id) {
      const dr = D.drawers.find(x => x.id === id);
      confirmDelete('Çekmece Sil', dr.name, 'çekmecesi ve içindeki bağlantılar silinsin mi?', 'Sil', async () => { await DB.del('drawers', id); return 'Silindi.'; });
    },
    editDItem(id) {
      const dr = drawerOf(id), it = dr.items.find(i => i.id === id);
      modal('Bağlantıyı Düzenle', esc(dr.name), folderField('Bağlantı adı', 'n', it.name) + urlField(it.url), 'Kaydet', async f => {
        const n = f.get('n').trim(), u = f.get('u').trim();
        if (!n || !okUrl(u)) return msg('er', 'Eksik veya hatalı bilgi (yalnızca http/https adresleri kabul edilir).');
        await DB.put('drawers', { ...dr, items: dr.items.map(i => i.id === id ? { ...i, name: n, url: u } : i) });
        msg('ok', 'Bağlantı güncellendi.');
      });
    },
    delDItem(id) {
      const dr = drawerOf(id), it = dr.items.find(i => i.id === id);
      confirmDelete('Bağlantı Sil', it.name, 'silinsin mi?', 'Sil', async () => {
        await DB.put('drawers', { ...dr, items: dr.items.filter(i => i.id !== id) });
        return 'Silindi.';
      });
    },
    tfold(id) {
      const li = app.querySelector(`li[data-n="${id}"]`);
      if (!li) return;
      const o = li.classList.toggle('open');
      o ? openF.add(id) : openF.delete(id);
      li.querySelector(':scope > .trow > .tg').setAttribute('aria-expanded', o);
    },
    expandAll: () => app.querySelectorAll('li.tnode[data-n]').forEach(li => {
      li.classList.add('open'); openF.add(+li.dataset.n);
      li.querySelector(':scope > .trow > .tg').setAttribute('aria-expanded', 'true');
    }),
    collapseAll: () => app.querySelectorAll('li.tnode[data-n]').forEach(li => {
      li.classList.remove('open'); openF.delete(+li.dataset.n);
      li.querySelector(':scope > .trow > .tg').setAttribute('aria-expanded', 'false');
    }),
    addFolder(pid) {
      const p = pid ? byId(pid) : null;
      modal(p ? 'Alt Kategori Ekle' : 'Ana Kategori Ekle', p ? `<strong>${esc(p.name)}</strong> içine eklenecek` : 'En üst düzeye eklenecek',
        folderField('Kategori adı', 'n', '', 'Örn: Matematik'), 'Ekle', async f => {
          const n = f.get('n').trim();
          if (!n) return msg('er', 'Geçerli bir kategori adı giriniz.');
          if (D.links.some(x => isFolder(x) && parentOf(x) === pid && sameName(x.name, n)))
            return msg('er', 'Bu düzeyde aynı adlı bir kategori zaten var.');
          await DB.put('links', { id: nid(), type: 'folder', name: n, parent_id: pid, created_at: now() });
          if (pid) openF.add(pid);
          msg('ok', 'Kategori eklendi.');
        });
    },
    addLink(pid) {
      const p = pid ? byId(pid) : null;
      modal('Bağlantı Ekle', p ? `<strong>${esc(p.name)}</strong> içine eklenecek` : 'En üst düzeye eklenecek',
        folderField('Buton metni', 'b', '', 'Buton adı') + urlField(), 'Ekle', async f => {
          const b = f.get('b').trim(), u = f.get('u').trim();
          if (!b || !okUrl(u)) return msg('er', 'Eksik veya hatalı bilgi (yalnızca http/https adresleri kabul edilir).');
          await DB.put('links', { id: nid(), type: 'link', parent_id: pid, category: pathOf(pid), button_text: b, link_url: u, created_at: now() });
          if (pid) openF.add(pid);
          msg('ok', 'Bağlantı eklendi.');
        });
    },
    renFolder(id) {
      const f = byId(id);
      modal('Kategoriyi Yeniden Adlandır', esc(f.name), folderField('Yeni ad', 'n', f.name), 'Kaydet', async d => {
        const n = d.get('n').trim();
        if (!n) return msg('er', 'Geçerli bir kategori adı giriniz.');
        if (D.links.some(x => isFolder(x) && x.id !== id && parentOf(x) === parentOf(f) && sameName(x.name, n)))
          return msg('er', 'Bu düzeyde aynı adlı bir kategori zaten var.');
        const old = { ...f };
        f.name = n;
        await DB.put('links', { ...old, name: n });
        // alttaki bağlantıların "category" yolunu güncel tut
        for (const x of descendants(id).filter(x => !isFolder(x))) {
          const c = pathOf(parentOf(x));
          if (x.category !== c) await DB.put('links', { ...x, category: c });
        }
        msg('ok', 'Kategori adı güncellendi.');
      });
    },
    editLink(id) {
      const l = byId(id);
      modal('Bağlantıyı Düzenle', esc(l.button_text), folderField('Buton metni', 'b', l.button_text) + urlField(l.link_url), 'Kaydet', async f => {
        const b = f.get('b').trim(), u = f.get('u').trim();
        if (!b || !okUrl(u)) return msg('er', 'Eksik veya hatalı bilgi (yalnızca http/https adresleri kabul edilir).');
        await DB.put('links', { ...l, button_text: b, link_url: u });
        msg('ok', 'Bağlantı güncellendi.');
      });
    },
    delFolder(id) {
      const f = byId(id), sub = descendants(id);
      const nf = sub.filter(isFolder).length, nl = sub.length - nf;
      confirmDelete('Kategori Sil', f.name, `kategorisi silinsin mi?`, 'Sil', async () => {
        await Promise.all([f, ...sub].map(x => remove(ref(db, `links/${linkKey(x)}`))));
        openF.delete(id);
        return 'Kategori ve içindekiler silindi.';
      }, `<br><small>İçindeki ${nf} alt kategori ve ${nl} bağlantı da silinecek. Bu işlem geri alınamaz.</small>`);
    },
    delLink(id) {
      const l = D.links.find(x => x.id === id);
      confirmDelete('Bağlantı Sil', l.button_text, 'silinsin mi?', 'Sil', async () => { await DB.del('links', id); return 'Silindi.'; });
    }
  };

  app.addEventListener('submit', async e => { e.preventDefault(); try { await forms[e.target.dataset.f]?.(new FormData(e.target), e.target); } catch (err) { msg('er', errText(err)); } });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  document.addEventListener('click', e => {
    if (e.target === modalEl) return closeModal();
    const b = e.target.closest('[data-a]');
    if (b) actions[b.dataset.a]?.(b.dataset.id ? (/^\d+$/.test(b.dataset.id) ? +b.dataset.id : b.dataset.id) : b);
  });
  addEventListener('hashchange', () => { if (!auth.currentUser) return; flash = null; render(); });

  startApp = render;
})();

const a11y = () => document.querySelectorAll('.fg').forEach((g, i) => { const l = g.querySelector('label'), c = g.querySelector('input,select'); if (l && c) { c.id = c.id || 'f' + i; l.htmlFor = c.id; } });
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

const $ = id => document.getElementById(id);
const drawer = $('drawer'), scrim = $('scrim'), burger = $('burger');
const setDrawer = open => {
  drawer.classList.toggle('open', open); scrim.classList.toggle('open', open);
  burger.setAttribute('aria-expanded', open); burger.setAttribute('aria-label', open ? 'Menüyü kapat' : 'Menüyü aç');
  (open ? drawer.querySelector('a.active, a') : burger).focus();
};
burger.addEventListener('click', () => setDrawer(!drawer.classList.contains('open')));
scrim.addEventListener('click', () => setDrawer(false));
$('dclose').addEventListener('click', () => setDrawer(false));
drawer.addEventListener('click', e => { if (e.target.closest('a')) setDrawer(false); });
addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) setDrawer(false); });
const gerr = t => { $('gerr').innerHTML = t ? `<div class="alert er" role="alert">${U.esc(t)}</div>` : ''; };
setPersistence(auth, browserSessionPersistence).catch(() => {});
$('gform').addEventListener('submit', async e => {
  e.preventDefault(); gerr('');
  const f = new FormData(e.target);
  try { await signInWithEmailAndPassword(auth, f.get('e').trim(), f.get('p')); e.target.reset(); }
  catch (err) { gerr(err.code === 'auth/too-many-requests' ? errText(err) : 'E-posta veya parola hatalı.'); }
});
$('logout').addEventListener('click', () => signOut(auth));
let idle;
const bump = () => { clearTimeout(idle); if (auth.currentUser) idle = setTimeout(() => signOut(auth), 30 * 60 * 1000); };
['click', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, bump, { passive: true }));
onAuthStateChanged(auth, async user => {
  if (!user) { document.body.classList.remove('authed'); drawer.classList.remove('open'); scrim.classList.remove('open'); $('app').innerHTML = ''; return; }
  let ok = false;
  try { ok = (await get(ref(db, `admins/${user.uid}`))).val() === true; } catch {}
  if (!ok) { await signOut(auth); gerr('Bu hesap yönetici yetkisine sahip değil.'); return; }
  document.body.classList.add('authed'); bump(); startApp();
});
</script>
</body>
</html>
