<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c3e66">
<meta name="robots" content="noindex, nofollow">
<title>Yönetici Paneli | Öğrenci Bahçesi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
<style>
:root{--navy:#2c3e66;--navy-d:#1a2744;--text:#2d3748;--muted:#718096;--line:#e2e8f0;--soft:#f7fafc;--danger:#c53030;--grad:linear-gradient(135deg,var(--navy),var(--navy-d))}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#f5f7fa,#c3cfe2) fixed;min-height:100vh;min-height:100dvh;color:var(--text);overflow-wrap:anywhere;overflow-x:hidden;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:100;padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.95);box-shadow:0 2px 20px rgba(0,0,0,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.topbar-in{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{padding:16px 0;font-size:1.4em;color:var(--navy)}
.tabs{display:flex;list-style:none;gap:32px}
.tabs a{display:block;padding:20px 0;color:#4a5568;font-weight:500;font-size:15px;text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover,.tabs a.active{color:var(--navy);border-color:var(--navy)}
.top-actions{display:flex;align-items:center;gap:10px}
.who{font-size:12px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{max-width:1280px;margin:0 auto;padding:32px 24px}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:2em;color:var(--navy);margin-bottom:8px}
.header p{color:var(--muted)}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.card{background:rgba(255,255,255,.98);border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08);margin-bottom:32px}
.card h2{margin-bottom:24px;font-size:1.5em;border-left:3px solid var(--navy);padding-left:16px}
.card>p{color:#4a5568;margin-bottom:12px}
.form-card{max-width:480px;margin:0 auto 32px;text-align:center}
.form-card h2{border:0;padding:0;color:var(--navy);margin-bottom:8px}
.form-card .sub-t{color:var(--muted);font-size:14px;margin-bottom:24px}
.fg{margin-bottom:20px;text-align:left}
label{display:block;margin-bottom:8px;color:#4a5568;font-weight:500;font-size:14px}
input,select{width:100%;padding:12px 16px;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px}
input:focus,select:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(44,62,102,.1);background:#fff}
button{width:100%;padding:12px 28px;background:var(--grad);color:#fff;border:0;border-radius:12px;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
button:hover{opacity:.95}
button.gray{background:var(--line);color:#4a5568;margin-top:12px}
.sm{display:inline-block;width:auto;min-height:36px;padding:8px 16px;font-size:13px;font-weight:500;text-decoration:none;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:20px;cursor:pointer}
.sm:hover{background:var(--navy);color:#fff;opacity:1}
.sm.del{color:var(--danger);border-color:#feb2b2}
.sm.del:hover{background:var(--danger);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.alert{padding:14px 18px;border-radius:12px;margin-bottom:24px;font-size:14px;font-weight:500;text-align:left}
.ok{background:#f0fff4;color:#276749;border:1px solid #9ae6b4}
.er{background:#fff5f5;color:var(--danger);border:1px solid #feb2b2}
.item{background:var(--soft);padding:18px;margin-bottom:12px;border-radius:14px;border-left:3px solid var(--navy)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row>*{min-width:0}
.nm{font-size:17px}
small,.mut{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.mut{font-size:13px;color:#a0aec0;margin:12px 0}
.sub{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.t{font-size:13px;font-weight:600;color:#4a5568;margin-bottom:8px}
.les{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;padding:10px 14px;margin:8px 0;border-radius:10px;border-left:2px solid var(--navy)}
.les>span{min-width:0;flex:1}
.inl{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.inl input{flex:1;min-width:160px}
.inl button{width:auto}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.empty{text-align:center;padding:48px 24px;color:#a0aec0;background:var(--soft);border-radius:16px}
.acc{margin-bottom:16px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.ah{display:flex;justify-content:space-between;gap:12px;width:100%;padding:16px 20px;background:var(--grad);color:#fff;border-radius:0;text-align:left;font-size:16px}
.ac{display:none;max-height:500px;overflow-y:auto}
.acc.open .ac{display:block}
.acc.stu .ac{max-height:none}
.ac>.item{margin:12px}
.li{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--soft);padding:16px;margin:12px;border-radius:12px;border-left:3px solid var(--navy)}
.li>div{min-width:0}
.modal{display:none;position:fixed;inset:0;z-index:1000;padding:16px;overflow-y:auto;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal.open{display:flex}
.mc{width:100%;max-width:450px;margin:auto;padding:32px;background:#fff;border-radius:24px;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.2)}
.mc h3{margin-bottom:16px}
.mc p{margin-bottom:16px}
.out{width:auto;padding:10px 20px;background:#edf2f7;color:#4a5568;border:1px solid var(--line);font-size:14px;font-weight:600}
.warn{background:#fff5f5;color:var(--danger);padding:18px;border-radius:14px;text-align:center;border:1px solid #feb2b2}
.login-wrap{max-width:520px;margin:0 auto;padding:24px}
@media(hover:hover){.card:hover{box-shadow:0 20px 40px rgba(0,0,0,.12)}}
@media(max-width:900px){
.dash{grid-template-columns:1fr;gap:24px}
.topbar-in{flex-direction:column;padding:4px 16px;gap:8px}
.logo{padding:12px 0 4px;font-size:1.2em}
.tabs{width:100%;justify-content:space-around;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:12px 6px;font-size:14px}
.top-actions{width:100%;justify-content:space-between}
.main{padding:24px 12px}
.card{padding:20px}
.header h1{font-size:1.6em}
.btns,.btns .sm,.row>.sm{width:100%;text-align:center}
.inl button{width:100%}
.slesson{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.header h1{font-size:clamp(1.5rem,1.1rem + 1.8vw,2.2rem)}
@media(min-width:1500px){.main{max-width:1440px}}
@media(max-width:400px){.card{padding:16px;border-radius:16px}.main{padding:16px 10px}.tabs a{font-size:13px}.mc{padding:24px 18px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <h2 class="logo">Öğrenci Bahçesi</h2>
    <nav id="mainNav" aria-label="Ana menü" hidden>
      <ul class="tabs">
        <li><a href="#dashboard">Ana Sayfa</a></li>
        <li><a href="#classes">Sınıflar</a></li>
        <li><a href="#students">Öğrenciler</a></li>
        <li><a href="#links">Bağlantılar</a></li>
        <li><a href="#options">Seçenekler</a></li>
      </ul>
    </nav>
    <div class="top-actions" id="userArea" hidden>
      <span class="who" id="whoami"></span>
      <button class="out" id="logoutBtn" type="button">Çıkış</button>
    </div>
  </div>
</header>

<main class="main" id="app"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mc" id="mc"></div></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get, set, update, remove, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtqtkB4mYY7t1HCM3umVLxRC2un30_-fQ",
  authDomain: "ogrenciveyonetim.firebaseapp.com",
  databaseURL: "https://ogrenciveyonetim-default-rtdb.firebaseio.com",
  projectId: "ogrenciveyonetim",
  storageBucket: "ogrenciveyonetim.firebasestorage.app",
  messagingSenderId: "660345359561",
  appId: "1:660345359561:web:5c74d90d8624c8e4c75118"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* Yardımcılar */
const U = {
  esc: s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';'),
  now: () => Date.now(),
  fd(ms, withTime = true) {
    if (!ms) return '-';
    const d = new Date(ms), p = n => String(n).padStart(2, '0');
    const date = `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
    return withTime ? `${date} ${p(d.getHours())}:${p(d.getMinutes())}` : date;
  },
  okUrl(u) { try { return /^https?:$/.test(new URL(u).protocol); } catch { return false; } },
  arr: o => Object.entries(o || {}).map(([id, v]) => ({ id, ...v })),
  matchClass(classes, exam, edu) {
    const norm = s => String(s || '').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g, 'i').trim();
    const has = (name, term) => !!term && new RegExp('(^|[^a-z0-9])' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])').test(name);
    const e = norm(exam), l = norm(edu);
    let best, top = 0;
    for (const c of [...classes].sort((x, y) => (x.created_at || 0) - (y.created_at || 0))) {
      const n = norm(c.class_name), score = (has(n, e) ? 2 : 0) + (has(n, l) ? 1 : 0);
      if (score > top) { best = c; top = score; }
    }
    return best;
  }
};
const { esc, fd, okUrl } = U;
const objArr = U.arr;

const STUDENT_EMAIL_DOMAIN = 'ogrenci-bahcesi.app';
const studentEmail = username => `${username.toLowerCase()}.${Math.random().toString(36).slice(2, 8)}@${STUDENT_EMAIL_DOMAIN}`;

const appEl = document.getElementById('app');
const modalEl = document.getElementById('modal');
const modalBox = document.getElementById('mc');
const navEl = document.getElementById('mainNav');
const userArea = document.getElementById('userArea');
const whoEl = document.getElementById('whoami');
const logoutBtn = document.getElementById('logoutBtn');

let D = { classes: {}, lessons: {}, students: {}, links: {}, options: {} };
let currentUser = null;
let flash = null;
let loginError = '';
const collapsed = new Set();

const msg = (type, text) => { flash = { type, text }; return render(); };
const alertHtml = () => { const f = flash; flash = null; return f ? `<div class="alert ${f.type}">${esc(f.text)}</div>` : ''; };
const head = (h, s) => `<div class="header"><h1>${h}</h1><p>${s}</p></div>`;
const empty = (a, b) => `<div class="empty"><p>${a}</p><p>${b}</p></div>`;

/* ---------- Yönetici Giriş ---------- */
const loginView = () => `
  <div class="login-wrap">
    <div class="card form-card">
      <h2>Yönetici Girişi</h2>
      <p class="sub-t">Bu panel yalnızca yetkili yöneticiler içindir.</p>
      ${loginError ? `<div class="alert er">${esc(loginError)}</div>` : ''}
      <form data-f="login">
        <div class="fg"><label>E-posta</label>
          <input name="email" type="email" required autocomplete="username" autocapitalize="none"></div>
        <div class="fg"><label>Şifre</label>
          <input name="pw" type="password" required autocomplete="current-password"></div>
        <button>Giriş Yap</button>
      </form>
    </div>
  </div>`;

/* ---------- Sayfalar ---------- */
const views = {
  dashboard: () => head('Yönetici Paneli', 'Öğrenci Bahçesi - Ana Panel') + `
    <div class="dash">
      <div class="card"><h2>Sınıf Oluştur</h2>${alertHtml()}
        <form data-f="class"><div class="fg"><label>Sınıf Adı</label>
          <input name="n" required maxlength="100" placeholder="Örn: TYT Lise, KPSS Lisans, 10-A">
          <div class="hint">Öğrenci profilini doldurunca, seçtiği sınav türü ve öğrenim düzeyi adında geçen sınıfa otomatik atanır (örn. "TYT Lise").</div></div>
          <button>Sınıf Ekle</button></form></div>
      <div class="card"><h2>Bilgi</h2>
        <p>Öğrenciler, "Öğrenciler" sayfasında belirlediğiniz kullanıcı adı ve şifre ile ogrenci.html üzerinden giriş yapar. Bu panelden sınıf, ders, öğrenci, bağlantı ve ilk girişte sorulan sınav türü / öğrenim düzeyi seçeneklerini yönetebilirsiniz.</p>
        <p><strong>Güvenlik:</strong> Yönetici hesapları yalnızca Firebase Console üzerinden oluşturulur. Öğrenci şifrelerini göremez veya sıfırlayamazsınız; öğrenci kendi panelinden şifresini değiştirebilir.</p></div>
    </div>`,

  classes() {
    const list = objArr(D.classes).sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
    return head('Sınıf Yönetimi', 'Tüm sınıflar ve dersler') + `<div class="card"><h2>Tüm Sınıflar</h2>${alertHtml()}` +
      (list.length ? list.map(c => {
        const lessons = objArr(D.lessons).filter(l => l.class_id === c.id).sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
        return `<div class="item">
          <div class="row"><strong class="nm">${esc(c.class_name)}</strong>
            <button class="sm del" data-a="delClass" data-id="${esc(c.id)}">Sil</button></div>
          <small>Eklenme: ${fd(c.created_at)}</small>
          <div class="sub"><div class="t">Bu Sınıfa Ait Dersler:</div>
            ${lessons.length ? lessons.map(l => `<div class="les"><span>${esc(l.lesson_name)}</span>
              <button class="sm" data-a="lessonLink" data-id="${esc(l.id)}">Link Ekle</button></div>`).join('') : '<div class="mut">Henüz ders eklenmemiş.</div>'}
            <form class="inl" data-f="lesson" data-id="${esc(c.id)}">
              <input name="n" required maxlength="100" placeholder="Ders adı (Örn: Matematik)"><button>Ders Ekle</button></form>
          </div></div>`;
      }).join('') : empty('Henüz hiç sınıf eklenmemiş.', 'Ana sayfadaki formdan sınıf ekleyebilirsiniz.')) + '</div>';
  },

  students() {
    const list = objArr(D.students).sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
    const opts = objArr(D.options);
    const order = type => opts.filter(o => o.type === type).sort((a, b) => (a.created_at || 0) - (b.created_at || 0)).map(o => o.label);
    const exams = order('exam'), edus = order('edu');
    const rank = (arr, v) => { const i = arr.indexOf(v); return i < 0 ? arr.length : i; };
    const byKey = new Map();
    list.forEach(u => {
      const done = !!(u.exam && u.education_status);
      const key = done ? JSON.stringify([u.exam, u.education_status]) : 'new';
      if (!byKey.has(key)) byKey.set(key, { key, done, exam: u.exam, edu: u.education_status, users: [] });
      byKey.get(key).users.push(u);
    });
    const groups = [...byKey.values()].sort((a, b) =>
      (a.done ? 1 : 0) - (b.done ? 1 : 0) ||
      rank(exams, a.exam) - rank(exams, b.exam) || String(a.exam || '').localeCompare(String(b.exam || ''), 'tr') ||
      rank(edus, a.edu) - rank(edus, b.edu) || String(a.edu || '').localeCompare(String(b.edu || ''), 'tr'));

    return head('Öğrenci Yönetimi', 'Öğrenci hesapları ve giriş bilgileri') + `
      <div class="card"><h2>Yeni Öğrenci Ekle</h2>${alertHtml()}
        <form data-f="student">
          <div class="fg"><label>Kullanıcı Adı</label>
            <input name="un" required maxlength="30" autocomplete="off" autocapitalize="none">
            <div class="hint">3-30 karakter: harf, rakam, nokta, alt çizgi veya tire. Başlangıç/bitiş alfanümerik olmalı.</div></div>
          <div class="fg"><label>Şifre</label>
            <input name="pw" type="password" required minlength="6" maxlength="60" autocomplete="new-password">
            <div class="hint">En az 6 karakter.</div></div>
          <button>Öğrenci Ekle</button></form></div>
      <div class="card"><h2>Kayıtlı Öğrenciler</h2>` +
      (groups.length ? groups.map(g => `<div class="acc stu${collapsed.has(g.key) ? '' : ' open'}">
        <button type="button" class="ah" data-a="toggleGroup" data-k="${esc(g.key)}"><span>${g.done ? `${esc(g.exam)} · ${esc(g.edu)}` : 'Yeni Kayıt · Profil Bekleniyor'} (${g.users.length} öğrenci)</span><span>▼</span></button>
        <div class="ac">${g.users.map(u => {
          const c = D.classes[u.class_id];
          const noClass = g.done ? 'Henüz sınıf atanmamış (Otomatik eşleşme bulunamadı)' : 'Henüz sınıf atanmamış (öğrenci profilini tamamlamadı)';
          return `<div class="item"><div class="row"><div>
            <strong class="nm">${esc(u.username)}</strong>
            <small>Kayıt: ${fd(u.created_at)}</small>
            <small>${c ? `Atanan Sınıf: <b>${esc(c.class_name)}</b>` : noClass}</small></div>
            <div class="btns"><button class="sm" data-a="creds" data-id="${esc(u.id)}">Kullanıcı Adı</button>
              <button class="sm" data-a="assign" data-id="${esc(u.id)}">Sınıf Seç</button>
              <button class="sm del" data-a="delUser" data-id="${esc(u.id)}">Sil</button></div></div></div>`;
        }).join('')}</div></div>`).join('')
        : empty('Henüz hiç öğrenci eklenmemiş.', 'Yukarıdaki formdan kullanıcı adı ve şifre belirleyerek öğrenci ekleyebilirsiniz.')) + '</div>';
  },

  links() {
    const groups = {};
    objArr(D.links).forEach(l => (groups[l.category] = groups[l.category] || []).push(l));
    const cats = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'tr'));
    return head('Bağlantı Yönetimi', 'Kategorilere göre bağlantılar oluşturun ve yönetin') + `
      <div class="card"><h2>Yeni Bağlantı Ekle</h2>${alertHtml()}
        <form data-f="link">
          <div class="fg"><label>Kategori Seç</label>
            <select name="c" id="cat" required><option value="">-- Kategori Seçiniz --</option>
              ${cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
              <option value="__new">+ Yeni kategori ekle...</option></select>
            <input name="nc" id="nc" maxlength="100" placeholder="Yeni kategori adı" hidden style="margin-top:10px"></div>
          <div class="fg"><label>Buton Metni</label><input name="b" required maxlength="100" placeholder="Örn: Ders Notları"></div>
          <div class="fg"><label>Bağlantı URL</label><input name="u" type="url" required placeholder="https://..."></div>
          <button>Bağlantı Ekle</button></form></div>` +
      (cats.length ? cats.map(c => `<div class="acc"><button type="button" class="ah" data-a="toggle"><span>${esc(c)} (${groups[c].length} bağlantı)</span><span>▼</span></button>
        <div class="ac">${[...groups[c]].sort((a, b) => (b.created_at || 0) - (a.created_at || 0)).map(l => `<div class="li"><div>
          <strong>${esc(l.button_text)}</strong><small>${esc(l.link_url)}</small><small>Eklenme: ${fd(l.created_at)}</small></div>
          <div class="btns"><a class="sm" href="${esc(l.link_url)}" target="_blank" rel="noopener noreferrer">Git</a>
            <button class="sm del" data-a="delLink" data-id="${esc(l.id)}">Sil</button></div></div>`).join('')}</div></div>`).join('')
        : empty('Henüz hiç bağlantı eklenmemiş.', 'Yukarıdaki formdan bağlantı ekleyebilirsiniz.'));
  },

  options() {
    const section = (type, title, placeholder) => {
      const list = objArr(D.options).filter(o => o.type === type).sort((a, b) => (a.created_at || 0) - (b.created_at || 0));
      return `<div class="card"><h2>${title}</h2>
        <form class="inl" data-f="option" data-type="${type}" style="margin:0 0 20px">
          <input name="n" required maxlength="60" autocomplete="off" placeholder="${placeholder}"><button>Ekle</button></form>` +
        (list.length ? list.map(o => `<div class="item"><div class="row"><strong class="nm">${esc(o.label)}</strong>
          <button class="sm del" data-a="delOption" data-id="${esc(o.id)}">Sil</button></div></div>`).join('')
          : empty('Henüz seçenek eklenmemiş.', 'Öğrenciler bu listeyi boş görür ve profilini tamamlayamaz.')) + '</div>';
    };
    return head('Seçenekler', 'Öğrencilerin ilk girişte seçeceği listeleri düzenleyin') + alertHtml() +
      section('exam', 'Sınav Türleri', 'Örn: TYT, AYT, LGS, KPSS...') +
      section('edu', 'Öğrenim Düzeyleri', 'Örn: Lise, Önlisans, Lisans...');
  }
};

async function loadData() {
  const [c, l, s, li, o] = await Promise.all([
    get(ref(db, 'classes')), get(ref(db, 'lessons')), get(ref(db, 'students')),
    get(ref(db, 'links')), get(ref(db, 'options'))
  ]);
  D = {
    classes: c.val() || {}, lessons: l.val() || {}, students: s.val() || {},
    links: li.val() || {}, options: o.val() || {}
  };
}

async function render() {
  try { await loadData(); }
  catch (e) {
    appEl.innerHTML = `<div class="alert er">Veriler yüklenemedi: ${esc(e.message)}</div>`;
    return;
  }
  let page = location.hash.slice(1);
  if (!views[page]) page = 'dashboard';
  appEl.innerHTML = views[page]();
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + page));
}

async function seedOptionsIfNeeded() {
  try {
    const meta = await get(ref(db, 'meta/optionsSeeded'));
    if (meta.exists()) return;
    const optSnap = await get(ref(db, 'options'));
    if (optSnap.exists()) { await set(ref(db, 'meta/optionsSeeded'), true); return; }
    const defaults = [
      ['exam', 'TYT'], ['exam', 'AYT'], ['exam', 'LGS'], ['exam', 'KPSS'],
      ['edu', 'Lise'], ['edu', 'Önlisans'], ['edu', 'Lisans']
    ];
    const upd = {};
    defaults.forEach(([type, label]) => {
      const key = push(ref(db, 'options')).key;
      upd[`options/${key}`] = { type, label, created_at: U.now() };
    });
    upd['meta/optionsSeeded'] = true;
    await update(ref(db), upd);
  } catch (e) { console.warn('seed skipped:', e.message); }
}

/* ---------- Modal ---------- */
const closeModal = () => modalEl.classList.remove('open');
function modal(title, text, fields, button, onSubmit) {
  modalBox.innerHTML = `<h3>${title}</h3><p>${text}</p><form>${fields}<button>${button}</button><button type="button" class="gray" data-a="close">İptal</button></form>`;
  modalEl.classList.add('open');
  modalBox.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const data = new FormData(e.target);
    closeModal();
    await onSubmit(data);
  };
}
function confirmDelete(title, name, text, button, run, note = '') {
  modal(title, `<strong>${esc(name)}</strong> ${text}${note}`, '', button, async () => {
    msg('ok', await run());
  });
}

/* ---------- Form işlemleri ---------- */
const forms = {
  async login(d) {
    loginError = '';
    const email = d.get('email').trim(), pw = d.get('pw');
    try {
      await signInWithEmailAndPassword(auth, email, pw);
    } catch (e) {
      loginError = 'E-posta veya şifre hatalı.';
      appEl.innerHTML = loginView();
    }
  },
  async class(d) {
    const n = d.get('n').trim();
    if (!n) return msg('er', 'Geçerli bir sınıf adı giriniz.');
    await push(ref(db, 'classes'), { class_name: n, created_at: U.now() });
    msg('ok', 'Sınıf başarıyla eklendi.');
  },
  async lesson(d, f) {
    const n = d.get('n').trim();
    if (!n) return;
    await push(ref(db, 'lessons'), {
      class_id: f.dataset.id, lesson_name: n, link_url: '', created_at: U.now()
    });
    msg('ok', 'Ders başarıyla eklendi.');
  },
  async student(d) {
    const username = d.get('un').trim(), pw = d.get('pw');
    if (!/^[a-zA-Z0-9](?:[a-zA-Z0-9._-]{1,28})[a-zA-Z0-9]$/.test(username))
      return msg('er', 'Kullanıcı adı 3-30 karakter olmalı; harf/rakamla başlayıp bitmeli, ortada . _ - olabilir.');
    if (pw.length < 6)
      return msg('er', 'Şifre en az 6 karakter olmalı.');

    const unameKey = username.toLowerCase();
    try {
      const taken = await get(ref(db, `usernames/${unameKey}`));
      if (taken.exists()) return msg('er', 'Bu kullanıcı adı zaten kullanılıyor.');

      const email = studentEmail(username);
      const sec = initializeApp(firebaseConfig, 'tmp-' + Date.now());
      const secAuth = getAuth(sec);
      let uid;
      try {
        const cred = await createUserWithEmailAndPassword(secAuth, email, pw);
        uid = cred.user.uid;
        await signOut(secAuth);
      } finally {
        await deleteApp(sec);
      }

      const upd = {};
      upd[`students/${uid}`] = {
        username, email,
        exam: null, education_status: null, class_id: null,
        created_at: U.now()
      };
      upd[`usernames/${unameKey}`] = { uid, email };
      await update(ref(db), upd);
      msg('ok', 'Öğrenci başarıyla eklendi.');
    } catch (e) {
      msg('er', 'Öğrenci eklenemedi: ' + (e.message || 'bilinmeyen hata'));
    }
  },
  async option(d, f) {
    const type = f.dataset.type, label = d.get('n').trim();
    if (!label) return msg('er', 'Lütfen geçerli bir değer giriniz.');
    const key = s => s.toLocaleLowerCase('tr');
    if (objArr(D.options).some(o => o.type === type && key(o.label) === key(label)))
      return msg('er', 'Bu seçenek zaten listede var.');
    await push(ref(db, 'options'), { type, label, created_at: U.now() });
    msg('ok', 'Seçenek başarıyla eklendi.');
  },
  async link(d) {
    const c = d.get('c') === '__new' ? (d.get('nc') || '').trim() : d.get('c');
    const b = d.get('b').trim(), u = d.get('u').trim();
    if (!c || !b || !okUrl(u)) return msg('er', 'Lütfen tüm alanları doldurunuz ve geçerli bir URL giriniz.');
    await push(ref(db, 'links'), { category: c, button_text: b, link_url: u, created_at: U.now() });
    msg('ok', 'Bağlantı başarıyla eklendi.');
  }
};

/* ---------- Buton işlemleri ---------- */
const actions = {
  close: closeModal,
  toggle: b => b.parentElement.classList.toggle('open'),
  toggleGroup(b) {
    const k = b.dataset.k;
    collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k);
    b.parentElement.classList.toggle('open');
  },

  async delClass(id) {
    const c = D.classes[id];
    if (!c) return;
    confirmDelete('Sınıf Silme Onayı', c.class_name, 'sınıfını silmek istediğinize emin misiniz?', 'Sınıfı Sil', async () => {
      const upd = {};
      upd[`classes/${id}`] = null;
      Object.entries(D.lessons).forEach(([lid, l]) => { if (l.class_id === id) upd[`lessons/${lid}`] = null; });
      Object.entries(D.students).forEach(([uid, u]) => { if (u.class_id === id) upd[`students/${uid}/class_id`] = null; });
      await update(ref(db), upd);
      return 'Sınıf başarıyla silindi.';
    }, '<br><small style="color:var(--danger)">Uyarı: Bu sınıf silindiğinde içindeki tüm dersler de silinecektir.</small>');
  },

  lessonLink(id) {
    const l = D.lessons[id];
    if (!l) return;
    modal('Derse Link Ekle/Güncelle', `<strong>${esc(l.lesson_name)}</strong> dersine link ekleyin/güncelleyin:`,
      `<div class="fg"><label>Link URL:</label><input type="url" name="u" value="${esc(l.link_url)}" placeholder="https://..." required></div>`,
      'Link Ekle/Güncelle', async f => {
        const u = f.get('u').trim();
        if (!okUrl(u)) return msg('er', 'Lütfen geçerli bir link girin.');
        await update(ref(db, `lessons/${id}`), { link_url: u });
        msg('ok', 'Link başarıyla eklendi/güncellendi.');
      });
  },

  assign(id) {
    const u = D.students[id];
    if (!u) return;
    const classes = objArr(D.classes).sort((a, b) => a.class_name.localeCompare(b.class_name, 'tr'));
    modal('Öğrenciye Sınıf Seç', `<strong>${esc(u.username)}</strong> öğrencisine sınıf seçiniz:`,
      `<div class="fg"><label>Sınıf Seçiniz:</label><select name="c" required><option value="">-- Sınıf Seçiniz --</option>
        ${classes.map(c => `<option value="${esc(c.id)}"${c.id === u.class_id ? ' selected' : ''}>${esc(c.class_name)}</option>`).join('')}</select></div>`,
      'Sınıfı Ata', async f => {
        await update(ref(db, `students/${id}`), { class_id: f.get('c') });
        msg('ok', 'Sınıf başarıyla atandı.');
      });
  },

  creds(id) {
    const u = D.students[id];
    if (!u) return;
    modal('Giriş Bilgileri', `<strong>${esc(u.username)}</strong> için kullanıcı adı:`,
      `<div class="fg"><label>Kullanıcı Adı</label>
        <input name="un" required maxlength="30" value="${esc(u.username)}" autocomplete="off" autocapitalize="none"></div>
       <div class="hint">Öğrenci şifresi değiştirilemez (Firebase Auth). Öğrenci kendi panelinden şifresini değiştirebilir.</div>`,
      'Kaydet', async f => {
        const username = f.get('un').trim();
        if (!/^[a-zA-Z0-9](?:[a-zA-Z0-9._-]{1,28})[a-zA-Z0-9]$/.test(username))
          return msg('er', 'Kullanıcı adı geçersiz.');
        const nLower = username.toLowerCase();
        if (nLower === u.username.toLowerCase()) return msg('ok', 'Değişiklik yok.');
        const taken = await get(ref(db, `usernames/${nLower}`));
        if (taken.exists()) return msg('er', 'Bu kullanıcı adı zaten kullanılıyor.');

        const upd = {};
        upd[`usernames/${nLower}`] = { uid: id, email: u.email };
        upd[`usernames/${u.username.toLowerCase()}`] = null;
        upd[`students/${id}/username`] = username;
        await update(ref(db), upd);
        msg('ok', 'Kullanıcı adı güncellendi.');
      });
  },

  async delUser(id) {
    const u = D.students[id];
    if (!u) return;
    confirmDelete('Öğrenci Silme Onayı', u.username, 'kullanıcı adlı öğrenciyi silmek istediğinize emin misiniz?', 'Sil', async () => {
      const upd = {};
      upd[`students/${id}`] = null;
      upd[`usernames/${u.username.toLowerCase()}`] = null;
      await update(ref(db), upd);
      return 'Öğrenci başarıyla silindi.';
    }, '<br><small>Not: Firebase Auth hesabı teknik olarak kalır ancak öğrenci kaydı olmadığından giriş yapamaz.</small>');
  },

  delOption(id) {
    const o = D.options[id];
    if (!o) return;
    confirmDelete('Seçenek Silme Onayı', o.label, 'seçeneğini listeden kaldırmak istediğinize emin misiniz?', 'Sil', async () => {
      await remove(ref(db, `options/${id}`));
      return 'Seçenek başarıyla silindi.';
    }, '<br><small>Bu seçeneği daha önce seçmiş öğrencilerin kaydı değişmez.</small>');
  },

  delLink(id) {
    const l = D.links[id];
    if (!l) return;
    confirmDelete('Bağlantı Silme Onayı', l.button_text, 'bağlantısını silmek istediğinize emin misiniz?', 'Bağlantıyı Sil', async () => {
      await remove(ref(db, `links/${id}`));
      return 'Bağlantı başarıyla silindi.';
    });
  }
};

/* ---------- Olaylar ---------- */
appEl.addEventListener('submit', e => {
  e.preventDefault();
  const f = forms[e.target.dataset.f];
  if (f) f(new FormData(e.target), e.target);
});
document.addEventListener('click', e => {
  if (e.target === modalEl) return closeModal();
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const action = actions[b.dataset.a];
  if (!action) return;
  e.preventDefault();
  if (b.dataset.id) action(b.dataset.id);
  else action(b);
});
document.addEventListener('change', e => {
  if (e.target.id !== 'cat') return;
  const input = document.getElementById('nc');
  if (!input) return;
  const isNew = e.target.value === '__new';
  input.hidden = !isNew;
  input.required = isNew;
});
addEventListener('hashchange', () => { if (currentUser) { flash = null; render(); } });

logoutBtn.addEventListener('click', async () => {
  await signOut(auth);
});

/* ---------- Auth akışı ---------- */
onAuthStateChanged(auth, async user => {
  if (!user) {
    currentUser = null;
    navEl.hidden = true;
    userArea.hidden = true;
    appEl.innerHTML = loginView();
    return;
  }
  try {
    const snap = await get(ref(db, `admins/${user.uid}`));
    if (!snap.exists()) {
      await signOut(auth);
      loginError = 'Bu hesap yönetici yetkisine sahip değil. Firebase Console → Realtime Database altında admins/' + user.uid + ' = true ekleyin.';
      appEl.innerHTML = loginView();
      return;
    }
    currentUser = user;
    navEl.hidden = false;
    userArea.hidden = false;
    whoEl.textContent = user.email || '';
    await seedOptionsIfNeeded();
    await render();
  } catch (e) {
    appEl.innerHTML = `<div class="alert er">Yetki kontrolü başarısız: ${esc(e.message)}</div>`;
  }
});
</script>
</body>
</html>
